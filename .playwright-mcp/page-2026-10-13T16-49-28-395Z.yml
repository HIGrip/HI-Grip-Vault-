          - paragraph [ref=e511]: Offer available to eligible WHOOP customers who are new to Natural Cycles. Your free year of Natural Cycles is linked to your active WHOOP membership. If your WHOOP membership ends or becomes inactive, your complimentary Natural Cycles access will also end, and standard subscription fees will apply.
          - paragraph [ref=e512]: "Additional Medical Information:"
          - paragraph [ref=e513]: "1. Healthspan: This feature is not available for users under the age of 18. This feature is for wellness purposes only and not for medical use."
          - paragraph [ref=e514]:
            - text: "2. ECG: This feature is not intended for users with known arrhythmias other than AFib or users under 22 years old. It is not recommended for users with a cardiac pacemaker, ICDs or other implanted electronic devices. ECG is a medically regulated feature and is not available in every region. Find out where else it's available"
            - link "here" [ref=e515] [cursor=pointer]:
              - /url: /nl/en/feature-availability/
            - text: .
          - paragraph [ref=e516]: "Within EU/UK ECG is not available in the following regions: Faroe Islands (FO) - Not available yet, Guernsey (GG)- Not available yet, Isle of Man (IM) - Not available yet, Jersey (JE) - Not available yet, Monaco (MC) - Not available yet, Greenland (GL) - Not available yet"
          - paragraph [ref=e517]:
            - text: "3. Irregular Heart Rhythm Notifications (IHRN): This feature is not intended for users with known atrial fibrillation or users under 22 years old. IHRN is a medically regulated feature and is not currently available in every region. Find out where else it's available"
            - link "here" [ref=e518] [cursor=pointer]:
              - /url: /nl/en/feature-availability/
            - text: .
          - paragraph [ref=e519]: "Within EU/UK IHRN is not available in the following regions: Faroe Islands (FO) - Not available yet, Guernsey (GG)- Not available yet, Isle of Man (IM) - Not available yet, Jersey (JE) - Not available yet, Monaco (MC) - Not available yet, Greenland (GL) - Not available yet"
          - paragraph [ref=e520]: "4. Blood Pressure Insights: Blood Pressure Insights is not a medical device and cannot diagnose or manage medical conditions. It does not provide medical advice. Always consult your doctor for health concerns and never delay or modify medical care based on its information. Blood Pressure Insights is not intended for use if you are pregnant or on blood pressure medication."
          - paragraph [ref=e521]: "5. Women's Hormonal Insights: Menstrual Cycle Insights is not a medical device or medical advice and should not be used for conception or contraception. All phases, including the ovulatory phase, are estimates."
          - paragraph [ref=e522]: "6. WHOOP Advanced Labs: WHOOP Advanced Labs is only available in the United States. You must be 18 years or older and not pregnant to participate. Advanced Labs testing is not available in Arizona, Hawaii, Wyoming, North Dakota, or South Dakota; however, tests may be completed out of state. If you are within 20 weeks postpartum, weigh under 100 lbs (45 kg), have severe anemia (Hb < 8 g/dL), or have recently undergone surgery, we recommend waiting until you have been cleared by your clinician before testing."
