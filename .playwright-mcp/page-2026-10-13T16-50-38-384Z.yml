  - contentinfo [ref=f13e854]:
    - generic [ref=f13e855]:
      - heading "Apple Footer" [level=2] [ref=f13e856]
      - region "Voetnoten" [ref=f13e857]:
        - list [ref=f13e858]:
          - listitem [ref=f13e859]: 2x meer Actieve Ruisonderdrukking in vergelijking met AirPods Pro 2. Beoordeling van ’s werelds beste in‑ear Actieve Ruisonderdrukking uitgevoerd in juli 2025 conform IEC-standaard 60268-24 en vergeleken met de bestverkochte draadloze oortjes die ten tijde van de tests verkrijgbaar waren.
          - listitem [ref=f13e860]: In vergelijking met AirPods Pro 2.
          - listitem [ref=f13e861]: Tests uitgevoerd door Apple in juli en augustus 2025 met prototypen van AirPods Pro 3 met de MagSafe-oplaadcase gekoppeld aan prototypen van iPhone 17 Pro; alle devices zijn getest met een prereleaseversie van de software. De afspeellijst bevatte 358 unieke muzieknummers die waren gekocht in de iTunes Store (256‑Kb/s AAC). Wanneer het volume was ingesteld op 50% en Actieve Ruisonderdrukking was ingeschakeld, was de luistertijd tot 8 uur. Met Ruimtelijke Audio en Hoofdtracking ingeschakeld was de luistertijd tot 7,5 uur. Bij de tests werd audio afgespeeld totdat de batterij helemaal leeg was en de eerste AirPod Pro stopte met afspelen. Batterijduur is afhankelijk van device-instellingen, omgeving, gebruik en vele andere factoren.
          - listitem [ref=f13e862]: Compatibele hardware en software vereist. Werkt met compatibele content in ondersteunde apps. Niet alle content is beschikbaar in Dolby Atmos. Voor het maken van een persoonlijk profiel voor Gepersonaliseerde Ruimtelijke Audio is een iPhone met TrueDepth-camera vereist. Het profiel wordt gesynchroniseerd met andere Apple devices waarop het nieuwste besturingssysteem staat, waaronder iOS, iPadOS, macOS en tvOS. Gepersonaliseerde Ruimtelijke Audio is niet beschikbaar in combinatie met andere devices.
          - listitem [ref=f13e863]:
            - text: Geïntegreerde hartslagmonitor is bedoeld voor gebruik tijdens work‑outs met de Conditie-app en compatibele apps van derden op een iPhone met iOS 26 of nieuwer. Zie
            - link "support.apple.com/nl-nl/123184" [ref=f13e864] [cursor=pointer]:
              - /url: https://support.apple.com/nl-nl/123184
            - text: voor meer informatie.
          - listitem [ref=f13e865]:
            - text: De features Gehoortest en Gehoorapparaat worden ondersteund op AirPods Pro 2 of nieuwer met de nieuwste firmware gekoppeld met een compatibele iPhone of iPad met iOS 18 of iPadOS 18 of nieuwer. Deze features zijn bedoeld voor gebruikers van 18 jaar en ouder. De feature Gehoorapparaat wordt ook ondersteund op compatibele Macs met macOS Sequoia of nieuwer. De feature is bedoeld voor mensen die licht tot matig gehoorverlies ervaren. Sommige features zijn mogelijk niet in alle talen of regio’s beschikbaar.
            - link "Bekijk de volledige lijst" [ref=f13e866] [cursor=pointer]:
              - /url: /nl/airpods-pro/feature-availability/
            - text: .
          - listitem [ref=f13e867]:
            - text: Ondersteund op AirPods Pro 2 of nieuwer met de nieuwste firmware, als die zijn gekoppeld met een compatibele iPhone met iOS 26 of nieuwer. Deze feature is mogelijk niet in alle talen of regio’s beschikbaar.
            - link "Bekijk de volledige lijst" [ref=f13e868] [cursor=pointer]:
              - /url: /nl/airpods-pro/feature-availability/
            - text: .
          - listitem [ref=f13e869]: 67% langere batterijduur vergeleken met AirPods Pro 2. Tests uitgevoerd door Apple in juli en augustus 2025 met prototypen van AirPods Pro 3 met de MagSafe-oplaadcase gekoppeld aan prototypen van iPhone 17 Pro; alle devices zijn getest met een prereleaseversie van de software. Het volume en de versterking waren ingesteld op 50% met Transparantie ingeschakeld. Bij de tests was de Gehoorapparaat-feature ingeschakeld zonder audio af te spelen vanaf iPhone, net zolang tot de batterij van de eerste AirPod Pro helemaal leeg was. Batterijduur is afhankelijk van device-instellingen, omgeving, gebruik en vele andere factoren.
          - listitem [ref=f13e870]:
            - text: AirPods Pro 3 zijn stof-, zweet- en waterbestendig voor sporten en trainingen die niet in het water plaatsvinden. Producten inclusief oplaadcase zijn getest onder gecontroleerde omstandigheden en voldoen aan bestendigheidsnorm IP57 volgens IEC‑standaard 60529. Stof-, zweet- en waterbestendigheid kunnen na verloop van tijd afnemen als gevolg van normale slijtage. Probeer natte AirPods niet op te laden. Raadpleeg
            - link "support.apple.com/nl-nl/HT210711" [ref=f13e871] [cursor=pointer]:
              - /url: https://support.apple.com/nl-nl/HT210711
            - text: voor instructies met betrekking tot reinigen en drogen.
          - listitem [ref=f13e872]: Beschikbaar op compatibele devices met iOS 26 of iPadOS 26 en nieuwer als die zijn gekoppeld met AirPods 4, AirPods 4 met Actieve Ruisonderdrukking of AirPods Pro 2 en nieuwer.
          - listitem [ref=f13e873]:
            - text: In vergelijking met AirPods Pro 2. Verbeterde feature Nauwkeurig Zoeken werkt met AirPods Pro 3 die zijn gekoppeld met iPhone Air- of iPhone 15-modellen of nieuwer (behalve iPhone 16e). Beschikbaarheid verschilt per regio. Ga naar
            - link "apple.com/uwb" [ref=f13e874] [cursor=pointer]:
              - /url: /uwb
            - text: voor meer informatie.
          - listitem [ref=f13e875]: Tests uitgevoerd door Apple in juli 2025, waarbij gebruik is gemaakt van AirPods Pro 3 gekoppeld aan iPhone 16 met een prereleaseversie van de AirPods-firmware en iOS 26. Ruisonderdrukking getest conform IEC‑standaard 60268‑24. Vergeleken met de bestverkochte draadloze oortjes die ten tijde van de tests verkrijgbaar waren. Prestaties zijn afhankelijk van de instellingen van het device, de omgeving en vele andere factoren.
          - listitem [ref=f13e876]: Tot 4x meer Actieve Ruisonderdrukking in vergelijking met de eerste generatie AirPods Pro en AirPods 4 met Actieve Ruisonderdrukking tijdens tests conform IEC-standaard 60268‑24.
          - listitem [ref=f13e877]: Vereist een compatibel Apple device met het nieuwste besturingssysteem.
          - listitem [ref=f13e878]:
            - text: De feature Gehoorbescherming werkt als AirPods Pro 2 of nieuwer met de nieuwste firmware zijn gekoppeld met een compatibele iPhone, iPad of Mac met iOS 18, iPadOS 18 of macOS Sequoia of nieuwer. Deze feature is niet in alle talen of regio’s beschikbaar.
            - link "Bekijk de volledige lijst" [ref=f13e879] [cursor=pointer]:
              - /url: /nl/airpods-pro/feature-availability/
            - text: . Ga naar
            - link "support.apple.com/nl-nl/120850" [ref=f13e880] [cursor=pointer]:
              - /url: https://support.apple.com/nl-nl/120850
            - text: voor uitgebreide informatie over de demping en meer. De feature Gehoorbescherming beschermt niet tegen extreem luide impulsgeluiden, zoals die van vuurwapens, vuurwerk of sloophamers. Deze feature beschermt ook niet tegen langdurige geluiden luider dan 110 dBA. De feature Gehoorbescherming biedt niet op alle werkplekken de geschikte bescherming. Overleg vooraf met je werkgever. De feature Gehoorbescherming van AirPods Pro 3 voldoet aan de gehoorbeschermingsnorm EN 352 wanneer Gehoorbescherming is ingeschakeld.
          - listitem [ref=f13e881]: Vereist een Apple Account en een compatibel Apple device met het nieuwste besturingssysteem.
          - listitem [ref=f13e882]: Siri en activering met gewoon “Siri” zijn mogelijk niet overal of in alle talen beschikbaar; de beschikbaarheid van features kan per gebied variëren. Vereist een compatibel device en internettoegang. Voor mobiel gebruik kunnen kosten in rekening worden gebracht.
          - listitem [ref=f13e883]: Voor opladen met MagSafe heb je een compatibele MagSafe-oplader nodig. Voor draadloos opladen heb je een draadloze Qi‑oplader nodig. De oplaadcase van AirPods Pro 3 en AirPods Pro 2 is ook te gebruiken met de Apple Watch-oplader of de USB‑C‑connector.
          - listitem [ref=f13e884]: Tot 3x meer Actieve Ruisonderdrukking in vergelijking met AirPods 5 tijdens tests conform IEC‑standaard 60268‑24.
          - listitem [ref=f13e885]:
            - text: Opgehoopt oorsmeer en vuil kunnen van invloed zijn op de prestaties van het device en van features voor geluidsbeheersing, zoals Actieve Ruisonderdrukking, Adaptieve Audio en Transparantie. Maak je AirPods geregeld schoon zodat alles naar behoren blijft werken. Raadpleeg
            - link "support.apple.com/nl-nl/102672" [ref=f13e886] [cursor=pointer]:
              - /url: https://support.apple.com/nl-nl/102672
            - text: voor instructies met betrekking tot het reinigen van AirPods 4. Raadpleeg
            - link "support.apple.com/nl-nl/120409" [ref=f13e887] [cursor=pointer]:
              - /url: https://support.apple.com/nl-nl/120409
            - text: voor instructies met betrekking tot het reinigen van AirPods Pro.
          - listitem [ref=f13e888]: Beschikbaar op compatibele devices met iOS 18, iPadOS 18 of macOS Sequoia en nieuwer als die zijn gekoppeld met AirPods 4, AirPods 4 met Actieve Ruisonderdrukking of AirPods Pro 2 of nieuwer met de nieuwste firmware. Installeer de nieuwste software voor het beste resultaat.
          - listitem [ref=f13e889]: Siri is mogelijk niet overal of in alle talen beschikbaar; de beschikbaarheid van features kan per gebied variëren. Vereist een compatibel device en internettoegang. Voor mobiel gebruik kunnen kosten in rekening worden gebracht.
          - listitem [ref=f13e890]: Beschikbaar op compatibele devices met iOS 18, iPadOS 18 of macOS Sequoia en nieuwer als die zijn gekoppeld met AirPods 4, AirPods 4 met Actieve Ruisonderdrukking of AirPods Pro 2 en nieuwer met de nieuwste firmware.
          - listitem [ref=f13e891]: Tot 1,5x meer Actieve Ruisonderdrukking in vergelijking met AirPods 4 met Actieve Ruisonderdrukking tijdens tests conform IEC-standaard 60268‑24.
          - listitem [ref=f13e892]: Tests uitgevoerd door Apple in juli en augustus 2026 met prototypen van AirPods 5 met de draadloze oplaadcase gekoppeld aan prototypen van iPhone 18 Pro; alle devices zijn getest met een prereleaseversie van de software. De afspeellijst bevatte 358 unieke muzieknummers die waren gekocht in de iTunes Store (256‑Kb/s AAC). Het volume was ingesteld op 50% en Ruimtelijke Audio en Gespreksdetectie waren uitgeschakeld. Actieve Ruisonderdrukking was ingeschakeld. Wanneer Geluidsbeheersing was uitgeschakeld, was de luistertijd maximaal 7 uur. Bij de tests werd audio afgespeeld totdat de batterij helemaal leeg was en de eerste AirPod stopte met afspelen. Batterijduur is afhankelijk van device-instellingen, omgeving, gebruik en vele andere factoren.
