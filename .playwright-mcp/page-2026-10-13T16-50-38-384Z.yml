            - paragraph [ref=f13e391]:
              - text: Met AirPods Pro 3 wordt ’s werelds eerste alles‑in‑één-oplossing voor je gehoorgezondheid nog beter.
              - superscript [ref=f13e392]:
                - link "Voetnoot 6" [ref=f13e393] [cursor=pointer]:
                  - /url: "#footnote-6"
                  - text: "6"
              - text: Zo kun je de wetenschappelijk onderbouwde Gehoortest nu onder nog meer omstandigheden uitvoeren. Voor de Gehoorapparaat-feature is de helderheid van het stemgeluid verbeterd en wordt automatisch Gespreksversterking ingeschakeld.
              - superscript [ref=f13e394]:
                - link "Voetnoot 7" [ref=f13e395] [cursor=pointer]:
                  - /url: "#footnote-7"
                  - text: "7"
              - text: Bovendien gaat de batterij na één keer volledig opladen tot wel 67% langer mee in de Transparantiemodus.
              - superscript [ref=f13e396]:
                - link "Voetnoot 8" [ref=f13e397] [cursor=pointer]:
                  - /url: "#footnote-8"
                  - text: "8"
              - text: En met actieve Gehoorbescherming kun je voorkomen dat je aan hard geluid wordt blootgesteld.
              - superscript [ref=f13e398]:
                - link "Voetnoot 15" [ref=f13e399] [cursor=pointer]:
                  - /url: "#footnote-15"
                  - text: "15"
          - generic [ref=f13e400]:
            - img "Iemand met AirPods Pro 3 in; rondom het oor zijn geluidsgolven afgebeeld, animation" [ref=f13e402]
            - generic [ref=f13e407]:
              - button [aria-hidden]
        - list "Overzicht Gehoorgezondheid" [ref=f13e412]:
          - listitem [ref=f13e413]:
            - generic [ref=f13e414]:
              - heading [level=3] [ref=f13e415]:
                - strong [ref=f13e416]: Batterijduur.
              - paragraph [ref=f13e417]:
                - text: Gebruik je Gehoorapparaat met Transparantie, dan gaat de batterij na één keer opladen tot wel 67% langer mee. Dat is tot wel 10 uur in totaal, zodat je deze baanbrekende feature nu op elk moment van de dag kunt gebruiken.
                - superscript [ref=f13e418]:
                  - link "Voetnoot 8" [ref=f13e419] [cursor=pointer]:
                    - /url: "#footnote-8"
                    - text: "8"
            - generic [ref=f13e420]:
              - generic [ref=f13e421]:
