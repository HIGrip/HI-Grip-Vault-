                - paragraph [ref=f13e427]:
                  - strong [ref=f13e428]: 4 uur meer
                  - text: voor de Gehoorapparaat-feature
                  - superscript [ref=f13e429]:
                    - link "Voetnoot 8" [ref=f13e430] [cursor=pointer]:
                      - /url: "#footnote-8"
                      - text: "8"
              - paragraph
          - listitem [ref=f13e431]:
            - generic [ref=f13e432]:
              - heading [level=3] [ref=f13e433]:
                - strong [ref=f13e434]: Automatische Gespreksversterking.
              - paragraph [ref=f13e435]:
                - text: Als je in een druk restaurant of kantoor aan het praten bent, laat Gespreksversterking automatisch de stem van je gesprekspartner harder klinken. Tegelijk worden afleidende geluiden om je heen zoveel mogelijk weggefilterd. Dankzij de nieuwe microfoons, transducer en versterker klinkt je stem bovendien helderder en natuurlijker dan ooit.
                - superscript [ref=f13e436]:
                  - link "Voetnoot 7" [ref=f13e437] [cursor=pointer]:
                    - /url: "#footnote-7"
                    - text: "7"
            - img "gespreksversterking" [ref=f13e441]
          - listitem [ref=f13e442]:
            - generic [ref=f13e443]:
              - heading [level=3] [ref=f13e444]:
                - strong [ref=f13e445]: Gehoortest en Gehoorapparaat.
              - paragraph [ref=f13e446]:
                - text: Met de verbeterde pasvorm en sterkere ruisonderdrukking is het nu mogelijk om een wetenschappelijk onderbouwde Gehoortest te doen, in nog meer alledaagse situaties. Gewoon bij je thuis. En als je licht tot matig gehoorverlies hebt, kun je overal de vernieuwde Gehoorapparaat-feature gebruiken.
                - superscript [ref=f13e447]:
                  - link "Voetnoot 6" [ref=f13e448] [cursor=pointer]:
                    - /url: "#footnote-6"
                    - text: "6"
            - img "Blauwe cirkelvormige geluidsgolf" [ref=f13e452]
          - listitem [ref=f13e453]:
            - generic [ref=f13e454]:
              - heading [level=3] [ref=f13e455]:
                - strong [ref=f13e456]: Gehoorbescherming.
              - paragraph [ref=f13e457]:
                - text: Met actieve Gehoorbescherming en de passieve ruisonderdrukking van de oortips kun je voorkomen dat je aan hard geluid wordt blootgesteld. Dankzij machinelearning op de H2‑chip wordt ruis 48.000 keer per seconde actief gereguleerd. En tegelijkertijd blijft alles waar je naar luistert natuurlijk en levendig klinken.
                - superscript [ref=f13e458]:
                  - link "Voetnoot 15" [ref=f13e459] [cursor=pointer]:
                    - /url: "#footnote-15"
                    - text: "15"
            - img "Blauwe balken die de mate van Gehoorbescherming aangeven" [ref=f13e463]
