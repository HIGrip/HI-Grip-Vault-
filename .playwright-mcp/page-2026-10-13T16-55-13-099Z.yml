            - heading "Sportkleding" [level=1] [ref=f66e1004]
            - paragraph [ref=f66e1005]: Onze sportkleding is ontworpen om het beste uit jezelf te halen. Want als je maximaal wilt presteren, zou niets je in de weg moeten zitten - zeker je gymkleding niet.
            - heading "Vanuit het krachthonk" [level=2] [ref=f66e1006]
            - paragraph [ref=f66e1007]:
              - text: Gymshark is in 2012 ontstaan vanuit een liefde voor fitness en lifting en die passie zie je vandaag de dag terug in alle collecties die we ontwerpen. Onze roots liggen in het krachthonk en daarom weten we uit ervaring wat er qua sportkleding wel en niet werkt. De comfy en functionele Gymshark collecties zijn dan ook voorzien van de laatste innovaties en onze accessoires helpen je om op je best te presteren. Om onze roots eer aan te doen, hebben we bodybuildingcollecties voor
              - link "dames" [ref=f66e1008] [cursor=pointer]:
                - /url: /collections/bodybuilding/womens
              - text: en
              - link "heren" [ref=f66e1009] [cursor=pointer]:
                - /url: /collections/bodybuilding/mens
              - text: met moderne ontwerpen die zijn voorzien van klassieke details en innovatieve stoffen waarin je je volledig op je volgende PB kunt richten.
            - heading "Gymshark sportkleding" [level=2] [ref=f66e1010]
            - paragraph [ref=f66e1011]:
              - text: We zorgen er met onze sportkleding voor dat je het beste uit jezelf kunt halen – ongeacht de sport die je beoefent. Onze collecties zijn ontworpen om je de steun te geven die je nodig hebt om optimaal te kunnen presteren. Of dat nu op de baan, in de gym of in de studio is. Tussen onze
              - link "dames" [ref=f66e1012] [cursor=pointer]:
                - /url: /pages/shop-women
              - text: "- en"
              - link "herencollecties" [ref=f66e1013] [cursor=pointer]:
                - /url: /pages/shop-men
              - text: vind je zweetafvoerende
              - link "t-shirts" [ref=f66e1014] [cursor=pointer]:
                - /url: /collections/t-shirts-tops/mens
              - text: en
              - link "tanktops" [ref=f66e1015] [cursor=pointer]:
                - /url: /collections/tanks/mens
              - text: ","
              - link "shorts" [ref=f66e1016] [cursor=pointer]:
                - /url: /collections/shorts/mens
              - text: ","
              - link "joggingbroeken" [ref=f66e1017] [cursor=pointer]:
                - /url: /collections/joggers-sweatpants/mens
              - text: ","
              - link "leggings" [ref=f66e1018] [cursor=pointer]:
                - /url: /collections/leggings/womens
              - text: ","
              - link "sport-bh’s" [ref=f66e1019] [cursor=pointer]:
                - /url: /collections/sports-bras/womens
              - text: en meer. Veel van onze kleding is afgewerkt met een comfortabele seamless technologie, waarmee je wrijving tijdens het trainen voorkomt. Daarnaast maken we voor sommige collecties gebruik van innovatieve stoffen en technologieën. Zo helpt ESNCE™️ technologie bijvoorbeeld om geurtjes tijdens het sporten tegen te gaan en geeft de super elastische en boterzachte RLSE™️ stof je ultieme bewegingsvrijheid. Alles wat we ontwerpen doen we vanuit de gedachte dat we trainingen en rustdagen naar een hoger niveau willen tillen, zodat jij je doelen keer op keer zo comfortabel mogelijk bereikt.
            - heading "Meer dan alleen sportkleding" [level=2] [ref=f66e1020]
            - paragraph [ref=f66e1021]: "Gymshark bestaat om de conditioning* community te verenigen. Dat doen we door iedereen de middelen te geven die ze nodig hebben om het beste uit zichzelf te halen: van kwalitatief hoogwaardige sportkleding om workouts in te smashen tot inspirerende content en een community waar je je thuis voelt. De Gymshark familie bestaat inmiddels uit meer dan 10 miljoen mensen van over de hele wereld die zich niet met elkaar verbonden voelen door hun gedeelde doelen, maar door de dingen die ze doen om ze te bereiken. *Conditioning is alles wat we vandaag de dag doen om ons voor te bereiden op morgen."
