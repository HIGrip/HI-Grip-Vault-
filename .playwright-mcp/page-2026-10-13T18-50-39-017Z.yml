        - generic [ref=f51e136]:
          - heading "FAQs" [level=1] [ref=f51e138]
          - generic [ref=f51e139]:
            - heading [level=2] [ref=f51e140]:
              - button "Are LightSpray™ shoes waterproof or water-resistant?" [ref=f51e141] [cursor=pointer]
            - region [ref=f51e149]:
              - paragraph [ref=f51e150]: No. LightSpray™ shoes are engineered for maximum breathability and ultra-light performance, so they're not currently waterproof or water resistant.
          - generic [ref=f51e151]:
            - heading [level=2] [ref=f51e152]:
              - button "How durable are LightSpray™ shoes for long-distance running?" [ref=f51e153] [cursor=pointer]
            - region [ref=f51e161]:
              - paragraph [ref=f51e162]: LightSpray™ uppers are tested to be just as tough as our standard running shoes. The key difference is the foam under your foot.
              - paragraph [ref=f51e163]: The LightSpray Cloudboom Strike uses our ultra-responsive Helion™ HF super foam, which is optimized for peak performance over a shorter lifespan than a daily trainer.
          - generic [ref=f51e164]:
            - heading [level=2] [ref=f51e165]:
              - button "What is the best way to clean LightSpray™ shoes?" [ref=f51e166] [cursor=pointer]
            - region [ref=f51e174]:
              - paragraph [ref=f51e175]: For daily care, simply brush off dry dirt. If a deeper clean is needed, gently hand wash the upper with warm water. Do not machine wash.
          - generic [ref=f51e176]:
            - heading [level=2] [ref=f51e177]:
              - button "Can LightSpray™ running shoes handle off-road running?" [ref=f51e178] [cursor=pointer]
            - region [ref=f51e186]:
              - paragraph [ref=f51e187]: LightSpray™ is currently engineered purely for road running. We don't recommend them for trails or technical terrain.
          - generic [ref=f51e188]:
            - heading [level=2] [ref=f51e189]:
              - button "How do LightSpray™ running shoes fit compared to other On shoes?" [ref=f51e190] [cursor=pointer]
            - region [ref=f51e198]:
              - paragraph [ref=f51e199]: LightSpray™ shoes fit true to size. The seamless upper is designed for absolute precision, creating a 'second-skin' feel without excess padding. So, for a locked-in, performance feel, stick to your standard On size.
          - generic [ref=f51e200]:
            - heading [level=2] [ref=f51e201]:
              - button "Are LightSpray™ shoes good for daily runs or only races?" [ref=f51e202] [cursor=pointer]
            - region [ref=f51e210]:
              - paragraph [ref=f51e211]: Both. Originally a race-day tech, it is now built for training too. The LightSpray Cloudmonster 3 Hyper pairs that ultra-light, seamless upper with a max-cushioned bottom unit designed for high mileage.
          - generic [ref=f51e212]:
            - heading [level=2] [ref=f51e213]:
              - button "Are LightSpray™ running shoes neutral?" [ref=f51e214] [cursor=pointer]
            - region [ref=f51e222]:
              - paragraph [ref=f51e223]: Yes. LightSpray™ supports a neutral running gait. The ultra-thin construction minimizes the material between your foot and the foam, providing a direct, responsive ride.
          - generic [ref=f51e224]:
            - heading [level=2] [ref=f51e225]:
              - button "How are LightSpray™ uppers different from knit or mesh uppers?" [ref=f51e226] [cursor=pointer]
            - region [ref=f51e234]:
              - paragraph [ref=f51e235]: Traditional uppers are cut, sewn and glued from multiple pieces of fabric. LightSpray™ is fused. A robotic arm sprays a single 1.5km filament directly onto the midsole in just three minutes. The result is a seamless, glueless one-piece upper that's lighter than conventional materials and free of distinct pressure points.
          - generic [ref=f51e236]:
            - heading [level=2] [ref=f51e237]:
              - button "Can LightSpray™ shoes be returned or exchanged if they don’t fit?" [ref=f51e238] [cursor=pointer]
            - region [ref=f51e246]:
              - paragraph [ref=f51e247]: Because LightSpray™ shoes are limited edition, we cannot offer direct exchanges. If the fit isn’t perfect, simply return them unworn and in their original packaging for a full refund.
          - generic [ref=f51e248]:
            - heading [level=2] [ref=f51e249]:
              - button "Are LightSpray™ shoes good for runners with wide feet?" [ref=f51e250] [cursor=pointer]
            - region [ref=f51e258]:
              - paragraph [ref=f51e259]: LightSpray™ shoes currently come in standard width only. The precision one-piece upper stretches less than traditional mesh. So, if you typically require a wider fit, we strongly recommend trying them on in-store first.
          - generic [ref=f51e260]:
            - heading [level=2] [ref=f51e261]:
              - button "Do LightSpray™ shoes require a break-in period?" [ref=f51e262] [cursor=pointer]
            - region [ref=f51e270]:
              - paragraph [ref=f51e271]: LightSpray™ shoes are race-ready out of the box. Over time, the upper will subtly adapt to your foot shape, creating a custom fit without ever becoming loose or losing stability.
          - generic [ref=f51e272]:
            - heading [level=2] [ref=f51e273]:
              - button "How can LightSpray™ technology improve my running times?" [ref=f51e274] [cursor=pointer]
            - region [ref=f51e282]:
              - paragraph [ref=f51e283]: It comes down to weight and focus. A LightSpray™ upper weighs as little as 30 grams, saving critical weight. The seamless design helps you focus on your cadence and pace, rather than adjusting your gear.
          - generic [ref=f51e284]:
            - heading [level=2] [ref=f51e285]:
              - button "What makes LightSpray™ better than traditional sewn uppers?" [ref=f51e286] [cursor=pointer]
            - region [ref=f51e294]:
              - paragraph [ref=f51e295]: Traditional uppers use seams and glue. That can create pressure points. A LightSpray™ upper is one piece – reducing the risk of blisters and creating a 'second-skin' feel.
          - generic [ref=f51e296]:
            - heading [level=2] [ref=f51e297]:
              - button "Are LightSpray™ running shoes suitable for marathon training?" [ref=f51e298] [cursor=pointer]
            - region [ref=f51e306]:
              - paragraph [ref=f51e307]: Absolutely. The LightSpray Cloudmonster 3 Hyper is engineered for high mileage. With 77% more Helion™ HF hyper foam than the original Cloudmonster Hyper, it delivers elite energy return without a plate – maximizing impact protection and helping to keep your legs fresh.
          - generic [ref=f51e308]:
            - heading [level=2] [ref=f51e309]:
              - button "How does LightSpray™ technology reduce waste?" [ref=f51e310] [cursor=pointer]
            - region [ref=f51e318]:
              - paragraph [ref=f51e319]: LightSpray™ reimagines shoe construction to minimize waste. We spray material directly onto the shoe mold and using only the exact amount of filament needed. Eliminating offcut scraps. The assembly process minimizes waste, eliminates the need for glues and produces 75% less CO₂ when produced at On Labs Zurich, compared to other On racing shoes
          - generic [ref=f51e320]:
            - heading [level=2] [ref=f51e321]:
              - button "Will LightSpray™ shoes stretch over time?" [ref=f51e322] [cursor=pointer]
            - region [ref=f51e330]:
              - paragraph [ref=f51e331]: Yes, but intentionally. A LightSpray™ upper is designed to mold to your foot’s unique shape over time. It creates a personalized fit without over-stretching or sacrificing the secure lockdown you need for running.
          - generic [ref=f51e332]:
            - heading [level=2] [ref=f51e333]:
              - button "Do LightSpray™ soles provide good traction in wet conditions?" [ref=f51e334] [cursor=pointer]
            - region [ref=f51e342]:
              - paragraph [ref=f51e343]: Yes. The outsoles of our LightSpray™ shoes feature the same high-traction compounds found in our standard road models, delivering reliable grip in wet and dry conditions.
          - generic [ref=f51e344]:
            - heading [level=2] [ref=f51e345]:
              - button "Where can I try it and buy LightSpray™ running shoes?" [ref=f51e346] [cursor=pointer]
            - region [ref=f51e354]:
              - paragraph [ref=f51e355]: You can find LightSpray™ models on our website, at On retail stores and at select premium partners. Also, keep an eye out at major marathons. We might just be showcasing the technology live. Check our events page for more details.
          - generic [ref=f51e356]:
            - heading [level=2] [ref=f51e357]:
              - button "Can I wash my LightSpray™ running shoes in the washing machine?" [ref=f51e358] [cursor=pointer]
            - region [ref=f51e366]:
              - paragraph [ref=f51e367]: No. To maintain the integrity of the LightSpray™ filament, do not use a washing machine. For daily care, simply brush off dry dirt. If a deeper clean is needed, gently hand wash the upper with warm water.
