            - heading "Behind the tech" [level=2] [ref=f51e106]
            - paragraph [ref=f51e107]: Most shoes take hours to build and many human hands. LightSpray™ takes just minutes to engineer an upper with a single robot arm. This manufacturing innovation minimizes waste and reduces carbon emissions from upper production, compared to other On racing shoes.
