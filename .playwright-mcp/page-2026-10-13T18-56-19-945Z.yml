        - generic [ref=f65e643]:
          - heading "Komm in den SNOCKS Club!" [level=2] [ref=f65e644]
          - paragraph [ref=f65e645]: "Als Mitglied im SNOCKS Club wirst du für jeden Einkauf und jede Aktivität bei uns belohnt! Dich erwarten exklusive Rabatte, Geburtstagsgeschenke und vieles mehr. Ganz wichtig: Mitglied im SNOCKS Club zu sein, ist für dich 100% kostenlos!"
          - link "Mehr erfahren" [ref=f65e646] [cursor=pointer]:
            - /url: /pages/snocks-club
          - link "Kostenlos anmelden" [ref=f65e647] [cursor=pointer]:
            - /url: /account
        - generic [ref=f65e648]:
          - generic [ref=f65e649]: SNOCKS CLUB
          - img "SNOCKS-CLUB" [ref=f65e652]
      - generic [ref=f65e655]:
        - generic [ref=f65e656]:
          - heading "@SNOCKS im echten Leben" [level=2] [ref=f65e657]
          - generic [ref=f65e658]: Lass dich inspirieren
        - generic:
          - generic [ref=f65e659] [cursor=pointer]
          - generic [ref=f65e660] [cursor=pointer]
      - generic [ref=f65e665]:
        - generic [ref=f65e666]:
          - heading "SNOCKS Socks sind dein Begleiter" [level=2] [ref=f65e667]
          - paragraph [ref=f65e668]:
            - text: Schon die alten Ägypter wussten, dass nackte Füße nicht immer eine gute Idee sind. Seit der Zeit von Pharaonen und Sphinxen hat sich einiges getan. Dies gilt auch für Strümpfe, für Liebhaber von Anglizismen auch Socks genannt. Heute gibt es sie in allen möglichen Farben und Ausführungen, die weltweit von unzähligen Anbietern vertrieben werden. Bei SNOCKS findest du
            - link "Socken" [ref=f65e669] [cursor=pointer]:
              - /url: https://snocks.com/collections/socken
            - text: ", die perfekt zu allen möglichen Aspekten deines Lifestyles passen. Unsere Produkte stehen für Tragekomfort, Stil und Qualität. So musst du dir um deine Strümpfe keine Sorgen mehr machen. Stattdessen kannst du dich auf dein Leben, deine Erfahrungen und deine Selbstverwirklichung konzentrieren. SNOCKS Socks tragen dich wie von selbst ans Ziel."
        - generic [ref=f65e670]:
          - heading "Ziele erreichen mit SNOCKS Socks" [level=2] [ref=f65e671]
          - paragraph [ref=f65e672]:
            - text: Apropos „Ziele erreichen“; Für deine Reise möchten wir dich natürlich mit den richtigen Strümpfen ausrüsten. Wir sind keine Freunde von Grenzen und Einschränkungen. Deshalb stellen wir dir bei unseren Socken eine breite Produktpalette zur Verfügung. Unsere
            - link "Füßlinge" [ref=f65e673] [cursor=pointer]:
              - /url: https://snocks.com/collections/fuesslinge
            - text: begleiten dich ungesehen bei jedem Abenteuer. Mit unseren
            - link "Sportsocken" [ref=f65e674] [cursor=pointer]:
              - /url: https://snocks.com/collections/sportsocken
            - text: bist du bereit für den nächsten Wettkampf. Geschäftliche Angelegenheiten klärst du mit unseren
            - link "Business Socken" [ref=f65e675] [cursor=pointer]:
              - /url: https://snocks.com/products/business-socken-leichte-lange-socken
            - text: . Alles was du tun musst ist, das richtige Produkt auszuwählen. Egal, welchen Weg du beschreiten wirst. Wir sorgen dafür, dass du so komfortabel wie möglich ankommst. SNOCKS Socks sind dein Begleiter und tragen dich über die Ziellinie. Komme, was wolle!
        - generic [ref=f65e676]:
          - heading "SNOCKS ist dein Ausstatter für alle Basics" [level=2] [ref=f65e677]
          - paragraph [ref=f65e678]:
            - text: Unsere Vision ist es, deine Anlaufstelle Nummer eins für Basics und Lifestyle Klamotten zu werden. Dazu gehören auch Produkte wie
            - link "Unterhemden" [ref=f65e679] [cursor=pointer]:
              - /url: https://snocks.com/collections/unterhemden
            - text: . Genau wie bei den Socken und
            - link "Herren Unterhosen" [ref=f65e680] [cursor=pointer]:
              - /url: https://snocks.com/collections/unterwaesche
            - text: möchten wir immer mehr Produkte, die als “unsexy” gelten, in einem neuen Licht erscheinen lassen. Basic Produkte wie Tank Tops haben genauso viel Aufmerksamkeit und Liebe zum Detail verdient wie andere Klamotten. Deshalb stecken wir viel Zeit und Energie in die Recherche und Entwicklung neuer Produkte. Ziel ist es immer, qualitativ hochwertige Kleidungsstücke zu einem fairen Preis anzubieten. Wir möchten, dass du dir keinerlei Gedanken mehr um deine Grundbedürfnisse in Sachen Klamotten machen musst. Um das zu erreichen, erweitern wir unser Produktportfolio konstant, um dein persönlicher Ausstatter für alle Basics zu werden.
        - generic [ref=f65e681]:
          - heading "SNOCKS Boxershorts passen perfekt" [level=2] [ref=f65e682]
          - paragraph [ref=f65e683]:
            - text: Was hast du drunter? Auch wenn es zunächst wie ein plumper Anmachspruch klingen mag, haben wir uns näher mit dieser Frage beschäftigt. Nur weil man
            - link "Boxershorts" [ref=f65e684] [cursor=pointer]:
              - /url: https://snocks.com/products/boxershorts
            - text: in der Regel nicht direkt sieht, solltest du nicht automatisch deine Ansprüche zurückschrauben. Uns bei SNOCKS liegt es besonders am Herzen, dass du mit unseren Produkten Spaß hast. Dazu gehört auch, dass Boxershorts nicht kratzen, zwicken, oder am Hosenbein hochrollen. Deine Lebenszeit ist einfach zu kostbar, um sich mit solchen Problemen herumschlagen zu müssen. Wie alle unsere Produkte gibt es auch unsere
            - link "Herren Unterhosen" [ref=f65e685] [cursor=pointer]:
              - /url: https://snocks.com/collections/unterwaesche
            - text: in guter Qualität und zu einem fairen Preis. Damit wollen wir zeigen, dass Komfort und Wohlbefinden, zumindest was Boxershorts angeht, nicht abhängig von deinem Bankkonto sein müssen. Wenn dir Boxershorts einfach zu lang sind oder nur untenrum mal etwas Neues ausprobieren möchtest, können wir unsere schnittigen
            - link "Herren Slips" [ref=f65e686] [cursor=pointer]:
              - /url: https://snocks.com/collections/maenner-slips
            - text: empfehlen.
        - generic [ref=f65e687]:
          - heading "SNOCKS Kleidung für lässige Looks" [level=2] [ref=f65e688]
          - paragraph [ref=f65e689]:
            - text: Um deinen Look zu komplettieren, bieten wir nicht nur Socken und Unterwäsche, sondern auch andere Kleidungsstücke wie Shirts oder Kappen an. Damit wollen wir es dir ermöglichen, einen Großteil deiner modischen Bedürfnisse direkt bei uns befriedigen zu können. Unser lässiger Hoodie ist beispielsweise in verschiedenen Farben erhältlich und lässt sich dadurch mit nahezu jedem Outfit kombinieren. Gerade diese Flexibilität und Entscheidungsfreiheit ist uns sehr wichtig. Wie sollst du dich auf die Entfaltung deiner Persönlichkeit konzentrieren, wenn du schon bei der Auswahl deiner Kleidung eingeschränkt wirst? Deshalb bieten wir dir neben Produkten wie unseren Invisible Socks oder unseren beliebten
            - link "Boxershorts" [ref=f65e690] [cursor=pointer]:
              - /url: https://snocks.com/products/boxershorts
            - text: oder
            - link "Unterhosen für Herren" [ref=f65e691] [cursor=pointer]:
              - /url: https://snocks.com/collections/unterwaesche
            - text: weitere Klamotten an.
        - generic [ref=f65e692]:
          - heading "Dein Partner für Lifestyle Produkte" [level=2] [ref=f65e693]
          - paragraph [ref=f65e694]:
            - text: Wir wollen nicht nur der Ausstatter und Klamottenhersteller deines Vertrauens sein, sondern dein kompetenter Partner in Sachen Lifestyle Produkte. Hierzu gehören Basics,
            - link "Herren Unterwäsche" [ref=f65e695] [cursor=pointer]:
              - /url: https://snocks.com/collections/unterwaesche
            - text: genauso wie zeitlose Klassiker und auch Pullover. Dabei geht es nicht nur darum, dass wir ausgewählte Kleidungsstücke selbst anbieten. Wir haben natürlich immer ein Auge auf modische Entwicklungen und erweitern unser Portfolio Stück für Stück. Es geht darüber hinaus darum, dir regelmäßig Informationen über Trends und Lifestyle Themen zur Verfügung zu stellen. Auf unserem Blog findest du in regelmäßigen Abständen neue Artikel über aktuelle Modetrends, aber auch Themen wie
            - link "Nachhaltigkeit" [ref=f65e696] [cursor=pointer]:
              - /url: https://snocks.com/pages/sustainability
            - text: . Dadurch möchten wir für dich mehr darstellen als einen Onlineshop. SNOCKS soll dein Ansprechpartner Nummer eins für Lifestyle Produkte sein.
