    - generic [ref=f87e164]:
      - generic [ref=f87e165]:
        - heading "Your games?" [level=2] [ref=f87e166]
        - paragraph [ref=f87e167]:
          - text: You can also make your own Playdate games. Our SDK is free to download, no special hardware required. And with the
          - link [ref=f87e168] [cursor=pointer]:
            - /url: /pulp/about/
            - strong [ref=f87e169]: Pulp
          - text: game maker, all you need is a web browser. Plus, sideloading games onto the Playdate is easy.
        - link "Playdate Developer Site" [ref=f87e171] [cursor=pointer]:
          - /url: /dev/
        - figure [ref=f87e172]:
          - img "A trio of screenshots showing development tools in the Playdate SDK." [ref=f87e173]
      - generic [ref=f87e174]:
        - heading "Big Screen Optional." [level=2] [ref=f87e175]
        - paragraph [ref=f87e176]:
          - text: If you ever want to play Playdate games on another screen, we've got that covered with the
          - link [ref=f87e177] [cursor=pointer]:
            - /url: /mirror
            - strong [ref=f87e178]: Playdate Mirror
          - text: app. It's a desktop app that streams gameplay in real-time from your Playdate to a macOS, Windows, or Linux computer. Handy for recording your playthrough or using alternative game controllers.
        - link "Playdate Mirror" [ref=f87e180] [cursor=pointer]:
          - /url: /mirror
        - figure [ref=f87e181]:
          - img "A screenshot of the Mirror app on a laptop, with a Playdate in front of it. Both are running the same game, Ratcheteer." [ref=f87e182]
    - generic [ref=f87e183]:
      - heading [level=1] [ref=f87e184]:
        - link "Playdate for Education" [ref=f87e185] [cursor=pointer]:
          - /url: /education/
      - heading [level=3] [ref=f87e186]:
        - strong [ref=f87e187]: Playdate's simplicity and scope make it perfect for teaching programming and game design.
      - text: With Playdate, students create real, playable games on a device they can hold in their hands. Students can code on their computers, test out the game on a Playdate, then go back to fine-tune. It’s experiential, project-based, learning-by-doing at its very best.
      - paragraph
      - paragraph [ref=f87e188]: Qualified education customers receive a 15% discount on all Playdate hardware and accessories!
      - link "Learn More" [ref=f87e190] [cursor=pointer]:
        - /url: /education/
    - generic [ref=f87e191]:
      - heading "All for just $229." [level=2] [ref=f87e192]
      - figure [ref=f87e193]:
        - img "The Playdate device." [ref=f87e194]
      - paragraph [ref=f87e195]:
        - strong [ref=f87e196]: Includes the full Season One of games
        - text: – 24 original Playdate games, delivered weekly, at no extra charge.
      - paragraph [ref=f87e197]: Does not include shipping. But you do get a very nice yellow USB-C to USB-A cable.
