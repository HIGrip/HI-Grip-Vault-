        - heading "Catalog" [level=2] [ref=f87e158]
      - paragraph [ref=f87e159]:
        - text: The fun continues with awesome new Playdate games made by developers around the world. You can install our favorites with
        - link "Catalog" [ref=f87e160] [cursor=pointer]:
          - /url: /games
        - text: ", a little game store right on your Playdate."
      - link "Grab some games!" [ref=f87e162] [cursor=pointer]:
