  - main [ref=f87e16]:
    - generic [ref=f87e17]:
      - heading "The System." [level=2] [ref=f87e18]
      - paragraph [ref=f87e19]:
        - text: Playdate is familiar, but unlike anything you've ever seen. It has a
        - strong [ref=f87e20]: very special black and white screen
        - text: – not backlit, but super reflective – that looks way more amazing than you're probably imagining.
      - figure [ref=f87e21]:
        - img "An exploded view of the internals of a Playdate device." [ref=f87e22]
      - paragraph [ref=f87e23]: It also has a peppy little processor, Wi-Fi, and a surprisingly loud loudspeaker. And when you're not using it, the screen doesn't turn off – it becomes a very nice low-power clock!
    - generic [ref=f87e24]:
      - heading "The Design." [level=2] [ref=f87e25]
      - paragraph [ref=f87e26]:
        - text: Thanks to our friends at
        - link "Teenage Engineering" [ref=f87e27] [cursor=pointer]:
          - /url: https://teenage.engineering/
        - text: ","
        - strong [ref=f87e28]: Playdate looks incredible
        - text: . It's colorful. It fits in your pocket. And we worked hard to make sure buttons feel perfectly clicky and that the crank action is silky smooth.
      - figure [ref=f87e29]:
        - img "A hand holding a Playdate device." [ref=f87e30]
    - generic [ref=f87e31]:
      - heading "The Crank." [level=2] [ref=f87e32]
      - paragraph [ref=f87e33]:
        - text: Yes, the crank. Is it a gimmick? Nah. Does it charge Playdate's battery? Nope. Is it really fun? Yes yes yes.
        - strong [ref=f87e34]: It's an analog controller that flips out from the side
        - text: ", allowing you to precisely dial in the action. Not every game uses it, but some really do, like Crankin's Time Travel Adventure, below."
    - generic [ref=f87e35]:
      - heading "The Season." [level=2] [ref=f87e36]
      - paragraph [ref=f87e37]:
        - text: Here's the truly unique bit. Playdate isn't just an empty system.
        - strong [ref=f87e38]:
          - text: Once you set up your Playdate, you'll start to receive
          - emphasis [ref=f87e39]: two
          - text: brand new games...
          - emphasis [ref=f87e40]: every week.
        - text: For 12 weeks.
      - paragraph [ref=f87e41]: That's 24 free games, in lots of genres. Some are short. Some are long. Will you love them all? Probably not. Will you have a great time trying them? Absolutely.
      - button [ref=f87e43] [cursor=pointer]:
        - text: Wait!
        - emphasis [ref=f87e44]: No spoilers
        - text: ", please!"
