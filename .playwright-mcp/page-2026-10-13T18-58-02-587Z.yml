  - banner [ref=f87e9]:
    - link "Preorder Season 3" [ref=f87e11] [cursor=pointer]:
      - /url: https://play.date/games/seasons/three/
    - paragraph [ref=f87e12]: It's a new, tiny handheld game system with a bunch of brand-new games. We made Playdate just for fun.
    - heading "Playdate®" [level=1] [ref=f87e13]:
      - link "Playdate®":
        - /url: /
    - link "Shop Now!!" [ref=f87e15] [cursor=pointer]:
