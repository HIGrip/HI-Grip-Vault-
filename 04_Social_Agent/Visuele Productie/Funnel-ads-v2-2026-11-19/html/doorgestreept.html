<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Doorgestreept</title>
<link rel="stylesheet" href="base.css">
<style>
/* Vervaagd veld onder flutlicht: sfeer zonder sport te kiezen. Links en onder donkerder voor leesbaarheid */
.ad { background: url(../bron/veld_vervaagd.jpg) center / cover no-repeat; }
.ad::before { content: ""; position: absolute; inset: 0;
  background:
    linear-gradient(90deg, rgba(17,17,17,.72) 0, rgba(17,17,17,.35) 55%, rgba(17,17,17,0) 100%),
    linear-gradient(180deg, rgba(17,17,17,0) 60%, rgba(17,17,17,.85) 100%); }

.intro { position: absolute; left: 72px; top: 176px; font: 600 32px/1.2 Poppins; }

/* Drie klachten, doorgestreept: de kijker voelt de opluchting voordat hij het product ziet */
.weg { position: absolute; left: 66px; top: 236px; }
.weg li { list-style: none; position: relative; width: max-content;
  font: italic 900 150px/1 Poppins; letter-spacing: -.045em; text-transform: uppercase; color: #5c5c5e; }
.weg li + li { margin-top: 6px; }
.weg li::after { content: ""; position: absolute; left: -10px; right: -14px; top: 54%; height: 12px; background: var(--hi-white); border-radius: 6px; }

.sok { position: absolute; left: 628px; top: 392px; height: 790px; transform: rotate(-4deg); transform-origin: 50% 85%;
  filter: drop-shadow(0 30px 30px rgba(0,0,0,.55)); }

.uitleg { position: absolute; left: 72px; top: 1018px; width: 500px; }
.uitleg p { font: 500 31px/1.38 Poppins; }
.uitleg strong { font-weight: 800; }
.uitleg small { display: block; margin-top: 18px; font: 500 24px/1.3 Poppins; color: var(--hi-titanium); }
</style>
</head>
<body>
<div class="ad">
  <div class="logo"><img src="../bron/logo_mark_wit.png" alt=""><span>HÏ GRIP</span></div>

  <p class="intro">Wat je straks niet meer voelt:</p>
  <ul class="weg">
    <li>Schuiven.</li>
    <li>Glippen.</li>
    <li>Blaren.</li>
  </ul>

  <img class="sok" src="../bron/sok_zwart_vrij.png" alt="">

  <div class="uitleg">
    <p><strong>Siliconen gripzones</strong> houden je voet vast in je schoen.</p>
    <small>3500+ sporters gingen je voor.</small>
  </div>

  <div class="pill">Shop nu<i><svg viewBox="0 0 24 24" fill="none" stroke="#CCFF00" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></i></div>
</div>
</body>
</html>
