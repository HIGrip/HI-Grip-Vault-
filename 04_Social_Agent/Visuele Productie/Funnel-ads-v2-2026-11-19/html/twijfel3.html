<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Twijfel 3-pack v3</title>
<link rel="stylesheet" href="base.css">
<style>
.ad { background: url(../bron/veld_vervaagd.jpg) center/cover; }
.ad::before { content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(17,17,17,.94) 0%, rgba(17,17,17,.82) 48%, rgba(17,17,17,.35) 100%),
              linear-gradient(180deg, rgba(17,17,17,0) 55%, rgba(17,17,17,.96) 86%); }

.logo, .kop, .twijfels, .prijs, .pill { z-index: 2; }
.kop { font-size: 100px; word-spacing: .14em; }

/* Eén sok die op zijn zool staat, met een contactschaduw: hij staat, hij zweeft niet */
.schaduw { position: absolute; left: 640px; top: 1074px; width: 380px; height: 44px; border-radius: 50%; z-index: 1;
  background: radial-gradient(closest-side, rgba(0,0,0,.85), rgba(0,0,0,0)); }
.sok { position: absolute; left: 640px; top: 372px; width: 400px; z-index: 1;
  filter: drop-shadow(0 18px 24px rgba(0,0,0,.5)); }

/* Drie bezwaren in de woorden van de koper: werkt het, kost het, komt het op tijd */
.twijfels { position: absolute; left: 72px; top: 512px; width: 540px; }
.twijfel { padding: 28px 0; border-top: 1.5px solid var(--line); }
.twijfel:first-child { border-top: 0; padding-top: 0; }
.twijfel p { font: 500 26px/1.2 Poppins; color: var(--hi-titanium); }
.twijfel strong { display: block; margin-top: 10px; font: 800 34px/1.15 Poppins; }
.twijfel .bron { margin-top: 14px; display: flex; align-items: center; gap: 10px; font: 500 22px/1 Poppins; color: #cfcfcf; }
.sterren { display: inline-flex; gap: 3px; }
.sterren b { width: 24px; height: 24px; background: var(--hi-trust); display: grid; place-items: center; }
.sterren b.half { background: linear-gradient(90deg, var(--hi-trust) 50%, #5a5a5a 50%); }
.sterren svg { width: 16px; height: 16px; }

.prijs { position: absolute; left: 72px; top: 1150px; }
.prijs .groot { font: italic 900 72px/1 Poppins; letter-spacing: -.03em; word-spacing: .12em; text-transform: uppercase; }
.prijs .groot em { font-style: inherit; color: var(--hi-yellow); }
.prijs .klein { margin-top: 14px; font: 400 24px/1.3 Poppins; color: #d6d6d6; }
.pill { top: 1176px; }
</style>
</head>
<body>
<div class="ad">
  <div class="logo"><img src="../bron/logo_mark_wit.png" alt=""><span>HÏ GRIP</span></div>

  <div class="schaduw"></div>
  <img class="sok" src="../bron/sok_zwart_vrij_schoon.png" alt="">

  <h1 class="kop">Wat houdt je<br>nog tegen?</h1>

  <div class="twijfels">
    <div class="twijfel"><p>"Werkt het echt?"</p><strong>3500+ sporters gingen je voor.</strong>
      <div class="bron"><span class="sterren"><b><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg></b><b><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg></b><b><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg></b><b><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg></b><b class="half"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg></b></span>4,6 op Trustpilot</div></div>
    <div class="twijfel"><p>"Is het niet te duur?"</p><strong>€14,98 per paar bij 3 paar.</strong></div>
    <div class="twijfel"><p>"Zaterdag al nodig?"</p><strong>Binnen 1 werkdag de deur uit.</strong></div>
  </div>

  <div class="prijs">
    <div class="groot">3 paar <em>€44,95</em></div>
    <div class="klein">Gratis verzonden</div>
  </div>

  <div class="pill">Shop 3-pack<i><svg viewBox="0 0 24 24" fill="none" stroke="#CCFF00" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></i></div>
</div>
</body>
</html>
