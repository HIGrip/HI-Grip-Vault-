<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Nog een wedstrijd 3-pack</title>
<link rel="stylesheet" href="base.css">
<style>
/* Echte shootfoto: de zool staat op het gras, de grip is het focuspunt */
.ad { background: url(../bron/zool_kunstgras.jpg) 63% 0 / auto 1180px no-repeat, var(--hi-near-black); }
.ad::before { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(17,17,17,.88) 0%, rgba(17,17,17,.55) 24%, rgba(17,17,17,0) 40%),
              linear-gradient(180deg, rgba(17,17,17,0) 60%, rgba(17,17,17,.92) 78%, #111 87%); }

.logo, .kop, .onder, .pill { z-index: 2; }
.kop { font-size: 96px; line-height: .92; word-spacing: .14em; }
.sub { display: block; margin-top: 18px; font: 600 34px/1.2 Poppins; letter-spacing: 0; text-transform: none; font-style: normal; }

.onder { position: absolute; left: 72px; right: 72px; top: 1062px; }
.bewijs { display: flex; align-items: center; gap: 12px; font: 500 24px/1 Poppins; color: #d6d6d6; }
.bewijs .punt { width: 5px; height: 5px; border-radius: 50%; background: var(--hi-titanium); margin: 0 6px; }
.sterren { display: inline-flex; gap: 3px; }
.sterren b { width: 24px; height: 24px; background: var(--hi-trust); display: grid; place-items: center; }
.sterren b.half { background: linear-gradient(90deg, var(--hi-trust) 50%, #5a5a5a 50%); }
.sterren svg { width: 16px; height: 16px; }

.prijs { margin-top: 40px; }
.prijs .groot { font: italic 900 72px/1 Poppins; letter-spacing: -.03em; word-spacing: .12em; text-transform: uppercase; }
.prijs .groot em { font-style: inherit; color: var(--hi-yellow); }
.prijs .klein { margin-top: 12px; font: 400 24px/1.3 Poppins; color: #d6d6d6; }
.pill { top: 1176px; }
</style>
</head>
<body>
<div class="ad">
  <div class="logo"><img src="../bron/logo_mark_wit.png" alt=""><span>HÏ GRIP</span></div>

  <h1 class="kop">Nog één<br>wedstrijd<br>glijden?<span class="sub">Of sta de volgende gewoon vast.</span></h1>

  <div class="onder">
    <div class="bewijs">
      <span class="sterren"><b><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg></b><b><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg></b><b><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg></b><b><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg></b><b class="half"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7L2 9.5l7.1-.6z"/></svg></b></span>
      4,6 op Trustpilot<i class="punt"></i>3500+ sporters gingen je voor
    </div>
    <div class="prijs">
      <div class="groot">3 paar <em>€44,95</em></div>
      <div class="klein">€14,98 per paar · gratis verzonden<br>Binnen 1 werkdag de deur uit</div>
    </div>
  </div>

  <div class="pill">Shop 3-pack<i><svg viewBox="0 0 24 24" fill="none" stroke="#CCFF00" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></i></div>
</div>
</body>
</html>
