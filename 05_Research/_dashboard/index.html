<title>HÏ Grip Research Dashboard</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Alle onderzoeken, routines, acties en de dagelijkse actiecontrole van HÏ Grip op één plek. De vault is de bron.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap">
<style>
  /* Tokens. Elke kleur heeft één betekenis: rood = P1, oranje = P2, volt = nieuw/ongelezen,
     blauw = door de actiecontrole bevestigd. Verder alleen zwart, wit, grijs en de neutrals. */
  :root {
    color-scheme: light;
    --ground: #EAE8E5;
    --surface: #FFFFFF;
    --sunk: #F4F3F1;
    --ink: #111111;
    --ink-2: #4A4945;
    --muted: #66645F;
    --rule: rgba(17, 17, 17, 0.10);
    --rule-strong: rgba(17, 17, 17, 0.24);
    --p1: #E10600;
    --p2: #FF6A00;
    --new: #CCFF00;
    --auto: #0011A7;
    --auto-soft: rgba(0, 17, 167, 0.08);
    --auto-ink: #0011A7;
    --rail: #111111;
    --rail-ink: #F2F1EE;
    --rail-muted: #9A9893;
    --rail-hover: rgba(255, 255, 255, 0.07);
    --rail-line: rgba(255, 255, 255, 0.10);
    --hl-top: 58%;
    --hl-bottom: 2px;
    --ease: cubic-bezier(.32, .72, 0, 1);
    --font: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #111111; --surface: #1a1a1a; --sunk: #151515;
      --ink: #F2F1EE; --ink-2: #C9C7C2; --muted: #8F8D88;
      --rule: rgba(242, 241, 238, 0.09); --rule-strong: rgba(242, 241, 238, 0.22);
      --auto-soft: rgba(120, 135, 255, 0.13); --auto-ink: #A8B0FF;
      --rail: #000000;
      --hl-top: 80%; --hl-bottom: 3px;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #111111; --surface: #1a1a1a; --sunk: #151515;
    --ink: #F2F1EE; --ink-2: #C9C7C2; --muted: #8F8D88;
    --rule: rgba(242, 241, 238, 0.09); --rule-strong: rgba(242, 241, 238, 0.22);
    --auto-soft: rgba(120, 135, 255, 0.13); --auto-ink: #A8B0FF;
    --rail: #000000;
    --hl-top: 80%; --hl-bottom: 3px;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 400 15px/1.6 var(--font); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--auto-ink); outline-offset: 2px; }
  [hidden] { display: none !important; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  code { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: .86em; background: var(--sunk); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ── Frame: rail + werkvlak ─────────────────────────────────────────── */
  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
  .nav {
    position: sticky; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--rail); color: var(--rail-ink);
    display: flex; flex-direction: column; gap: 28px; padding: 26px 16px 18px;
  }
  .merk { display: grid; gap: 0; padding: 0 10px; text-decoration: none; }
  .merk b { font-weight: 900; font-size: 19px; letter-spacing: -0.3px; text-transform: uppercase; }
  .merk span { font-size: 10px; font-weight: 600; letter-spacing: 3px; color: var(--rail-muted); text-transform: uppercase; }
  .nav-groep { display: grid; gap: 2px; }
  .nav-kop { margin: 0 0 8px; padding: 0 10px; font-size: 10px; letter-spacing: 3px; font-weight: 600; color: var(--rail-muted); text-transform: uppercase; }
  .nav a.item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--rail-ink);
    font-weight: 500; font-size: 14px; position: relative;
  }
  .nav a.item.klein { font-size: 13px; padding: 6px 10px; }
  .nav a.item.is-leeg { color: var(--rail-muted); }
  .nav a.item:hover { background: var(--rail-hover); }
  .nav a.item[aria-current="page"] { background: rgba(255, 255, 255, 0.11); font-weight: 600; }
  .nav a.item[aria-current="page"]::before { content: ""; position: absolute; left: -16px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--rail-ink); }
  .nav .tel { font-size: 12px; color: var(--rail-muted); font-variant-numeric: tabular-nums; }
  .nav .tel--p1 { background: var(--p1); color: #fff; font-weight: 600; padding: 0 7px; border-radius: 99px; }
  .nav .tel--nieuw { background: var(--new); color: #111; font-weight: 600; padding: 0 7px; border-radius: 99px; }
  .nav-voet { margin-top: auto; display: grid; gap: 10px; padding: 14px 10px 0; border-top: 1px solid var(--rail-line); font-size: 12px; color: var(--rail-muted); }
  .nav-voet label { display: block; margin-bottom: 4px; }
  .nav-voet input { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--rail-line); background: rgba(255, 255, 255, 0.06); color: var(--rail-ink); font-size: 13px; }
  .nav-voet input::placeholder { color: var(--rail-muted); }
  .nav :focus-visible, .topbar :focus-visible { outline-color: var(--rail-ink); }

  .topbar { display: none; }
  .werk { min-width: 0; padding-block: 28px 96px; padding-inline: clamp(16px, 4vw, 56px); }
  .werk-in { max-width: 1180px; margin-inline: auto; display: flex; flex-direction: column; gap: 40px; }

  @media (max-width: 899px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .nav {
      position: fixed; z-index: 50; inset: 0 auto 0 0; width: min(300px, 86vw); height: auto;
      padding-top: calc(22px + env(safe-area-inset-top, 0px)); transform: translateX(-102%); transition: transform 220ms var(--ease);
    }
    .nav.is-open { transform: none; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.5); }
    .topbar {
      display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 40;
      background: var(--rail); color: var(--rail-ink); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    }
    .topbar button { background: none; border: 1px solid var(--rail-line); color: var(--rail-ink); border-radius: 8px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; flex: none; }
    .topbar b { font-weight: 900; text-transform: uppercase; letter-spacing: -0.3px; }
    .topbar span { color: var(--rail-muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }

  /* ── Paginakop ──────────────────────────────────────────────────────── */
  .pagina-kop { display: grid; gap: 8px; }
  .kruimel { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  .kruimel a { color: var(--muted); text-decoration: none; }
  .kruimel a:hover { color: var(--ink); text-decoration: underline; }
  .pagina-kop h1, .topline h1 { font-weight: 900; font-size: clamp(28px, 3.4vw, 42px); line-height: 1.02; letter-spacing: -1px; text-transform: uppercase; }
  .pagina-kop p { margin: 0; color: var(--muted); max-width: 70ch; }
  .sectie { display: grid; gap: 12px; }
  .block-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
  .block-title h2 { font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.2px; display: flex; align-items: center; gap: 10px; }
  .block-title a, .block-title .tel { font-size: 13px; color: var(--muted); text-decoration: none; font-weight: 500; }
  .block-title a:hover { color: var(--ink); text-decoration: underline; }
  .panel { background: var(--surface); border-radius: 14px; padding: 22px; }
  @media (max-width: 600px) { .panel { padding: 18px 16px; } }

  /* ── Chips en markeringen ───────────────────────────────────────────── */
  .prio { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .5px; padding: 2px 7px; border-radius: 5px; white-space: nowrap; line-height: 16px; }
  .prio.p1 { background: var(--p1); color: #fff; }
  .prio.p2 { background: var(--p2); color: #111; }
  .prio.p3 { box-shadow: inset 0 0 0 1.5px var(--rule-strong); color: var(--muted); }
  .newdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--new); box-shadow: 0 0 0 1.5px var(--ink); flex: none; }
  .autochip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .3px; color: var(--auto-ink); background: var(--auto-soft); padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .autochip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; white-space: nowrap; font-weight: 600; font-size: 11px; letter-spacing: .4px; line-height: 18px; background: var(--sunk); color: var(--ink-2); }
  .chip--sync { background: transparent; box-shadow: inset 0 0 0 1px var(--muted); color: var(--muted); }
  .deadline { font-weight: 700; color: var(--ink); white-space: nowrap; }
  .sname { display: flex; align-items: baseline; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-2); }
  .sname .v { font-weight: 600; letter-spacing: .5px; color: var(--muted); }
  .st { width: 14px; height: 14px; flex: none; display: inline-block; vertical-align: -2px; color: var(--ink); }
  .st--verwerkt, .st--gearchiveerd { color: var(--muted); }
  .leeg { color: var(--muted); padding: 12px 0; margin: 0; }
  .melding { font-size: 13px; color: var(--ink); font-weight: 600; }
  .melding:empty { display: none; }

  /* ── Vandaag: status + tellers ──────────────────────────────────────── */
  .vandaag-kop { display: flex; flex-direction: column; gap: 20px; }
  .statusbar { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .live { display: inline-flex; align-items: center; gap: 10px; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); position: relative; flex: none; }
  .pulse.aan { background: var(--auto-ink); }
  .pulse.aan::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--auto-ink); opacity: 0; }
  .topline { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
  .topline h1 { margin-top: 8px; }
  .tally { display: flex; gap: 28px; flex-wrap: wrap; }
  .tally a { display: flex; flex-direction: column; text-decoration: none; }
  .tally b { font-weight: 800; font-size: 34px; line-height: 1; }
  .tally b.rood { color: var(--p1); }
  .tally span { font-size: 11px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; margin-top: 8px; display: inline-flex; gap: 6px; align-items: center; }
  .tally a:hover span { color: var(--ink); }

  /* Actiecontrole-paneel */
  .check-panel { display: grid; gap: 18px; }
  .check-panel h2 { font-size: 15px; font-weight: 600; }
  .check-panel > div > p { margin: 4px 0 0; font-size: 13px; color: var(--muted); max-width: 64ch; }
  .results { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--rule); }
  .res { padding: 16px 18px 4px 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .res + .res { padding-left: 18px; border-left: 1px solid var(--rule); }
  .res-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .res-h b { font-weight: 800; font-size: 28px; line-height: 1; }
  .res-h span { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .res.ok .res-h b { color: var(--auto-ink); }
  .res-sub { font-size: 12px; color: var(--muted); margin: -4px 0 0; }
  .res ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: var(--ink-2); }
  .res li { line-height: 1.45; }
  .res li a { text-decoration: none; color: var(--ink); font-weight: 500; }
  .res li a:hover { text-decoration: underline; }
  .res li small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .res .meer { font-size: 12px; color: var(--muted); text-decoration: none; font-weight: 600; }
  .res .meer:hover { color: var(--ink); text-decoration: underline; }

  /* Bureau: eerst doen + nieuw binnen */
  .desk { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 40px; align-items: start; }
  .todo { list-style: none; margin: 0; padding: 0; }
  .todo-item { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--rule); transition: opacity .5s var(--ease); }
  .todo-item.done { opacity: .5; }
  .todo-item.done .todo-text { text-decoration: line-through; text-decoration-thickness: 1px; }
  .todo-item.is-dubbel { opacity: .6; }
  .check { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin: 2px 0 0; border-radius: 6px; cursor: pointer; box-shadow: inset 0 0 0 1.5px var(--rule-strong); background: var(--surface); display: grid; place-items: center; transition: transform .3s var(--ease); }
  .check:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .check:active { transform: scale(.88); }
  .check:checked { background: var(--ink); box-shadow: none; }
  .check.auto:checked { background: var(--auto); }
  .check::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px) scale(0); transition: transform .35s var(--ease); }
  .check.auto::after { border-color: #fff; }
  .check:checked::after { transform: rotate(-45deg) translate(1px, -1px) scale(1); }
  .check:disabled { cursor: wait; }
  .bol { width: 20px; height: 20px; margin-top: 2px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--rule-strong); display: grid; place-items: center; }
  .bol.is-af { background: var(--ink); box-shadow: none; }
  .bol.is-af.auto { background: var(--auto); }
  .bol.is-af::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
  .bol.is-af.auto::after { border-color: #fff; }
  .todo-text { display: block; font-size: 14.5px; line-height: 1.5; font-weight: 500; overflow-wrap: anywhere; cursor: default; }
  label.todo-text { cursor: pointer; }
  .todo--compact .todo-item { padding: 11px 0; gap: 12px; }
  .todo--compact .todo-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; }
  .todo--compact .todo-meta { margin-top: 4px; }
  .controle-kort { background: var(--surface); border-radius: 14px; }
  .controle-kort > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 16px 22px; }
  .controle-kort > summary::-webkit-details-marker { display: none; }
  .controle-kort > summary h2 { font-size: 15px; font-weight: 600; margin-right: auto; }
  .controle-kort .ck-getal { display: inline-flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .5px; text-transform: uppercase; }
  .controle-kort .ck-getal b { font-size: 20px; color: var(--ink); letter-spacing: 0; }
  .controle-kort .ck-getal.ok b { color: var(--auto-ink); }
  .controle-kort .chev { flex: none; }
  .controle-kort[open] .chev { transform: rotate(180deg); }
  .controle-kort > .check-panel { padding-top: 0; }
  .nav-binnenkort > summary { list-style: none; cursor: pointer; }
  .nav-binnenkort > summary::-webkit-details-marker { display: none; }
  .nav-binnenkort > summary.item { color: var(--rail-muted); display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 500; }
  .nav-binnenkort > summary.item:hover { background: var(--rail-hover); }
  .tabbalk { display: none; }
  @media (max-width: 899px) {
    .tabbalk { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: var(--rail); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rail-line); }
    .tabbalk a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; min-height: 44px; border-radius: 10px; color: var(--rail-muted); text-decoration: none; font-size: 11px; font-weight: 600; letter-spacing: .3px; position: relative; }
    .tabbalk a[aria-current="page"] { color: var(--rail-ink); background: rgba(255, 255, 255, 0.08); }
    .tabbalk .tb-tel { position: absolute; top: -4px; right: calc(50% - 38px); min-width: 18px; padding: 0 5px; border-radius: 99px; background: var(--p1); color: #fff; font-size: 10px; line-height: 16px; }
    .werk { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  }
  .why { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.5; overflow-wrap: anywhere; }
  .todo-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .todo-meta a { color: var(--ink-2); text-decoration: none; font-weight: 600; }
  .todo-meta a:hover { text-decoration: underline; }
  .bewijs { font-size: 12px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }

  .feed { list-style: none; margin: 0; padding: 0; }
  .feed a { display: block; padding: 14px 10px; margin: 0 -10px; border-bottom: 1px solid var(--rule); color: inherit; text-decoration: none; border-radius: 8px; transition: transform .4s var(--ease); }
  .feed a:hover { background: var(--surface); transform: translateX(3px); }
  .feed h3 { font-size: 15px; font-weight: 600; line-height: 1.35; margin-top: 4px; }
  .feed p { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .feed .meta { display: flex; gap: 10px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }

  /* Weekrooster */
  .week-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .week-head h2 { font-size: 15px; font-weight: 600; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; align-items: center; }
  .legend > span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .cell { width: 12px; height: 12px; border-radius: 3px; }
  .tabel-scroll { overflow-x: auto; }
  table.sched { border-collapse: collapse; width: 100%; min-width: 560px; }
  .sched th { font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; padding: 0 0 8px; letter-spacing: 1px; text-transform: uppercase; }
  .sched th:first-child { text-align: left; }
  .sched th.today { color: var(--ink); }
  .sched td { padding: 6px 0; text-align: center; border-top: 1px solid var(--rule); }
  .sched td:first-child { text-align: left; font-size: 13px; font-weight: 500; white-space: nowrap; padding-right: 12px; }
  .sched td:first-child small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
  .sched th:first-child, .sched td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); }
  .sched td.todaycol, .sched th.today { background: var(--sunk); }
  .cell { display: inline-block; width: 22px; height: 22px; border-radius: 6px; vertical-align: middle; }
  a.cell:hover { transform: scale(1.12); }
  .cell.ran { background: var(--ink); }
  .cell.plan { box-shadow: inset 0 0 0 1.5px var(--rule-strong); }
  .cell.miss { box-shadow: inset 0 0 0 1.5px var(--ink); background: repeating-linear-gradient(135deg, var(--ink-2) 0 1.5px, transparent 1.5px 5px); }
  .cell.off::after { content: ""; display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--rule-strong); margin: 9px auto; }

  .key { display: flex; flex-wrap: wrap; gap: 10px 22px; font-size: 12px; color: var(--muted); align-items: center; }
  .key > span { display: inline-flex; gap: 8px; align-items: center; }

  /* ── Lijsten ────────────────────────────────────────────────────────── */
  .filterbalk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .zoek { flex: 1 1 260px; position: relative; }
  .zoek input { width: 100%; padding: 9px 12px 9px 36px; border: 0; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule-strong); }
  .zoek svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
  .zoek kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 600 11px var(--font); color: var(--muted); box-shadow: inset 0 0 0 1px var(--rule-strong); border-radius: 4px; padding: 0 5px; }
  .kiezer { padding: 8px 10px; border: 0; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule-strong); font-size: 13px; }
  .schakel { display: inline-flex; border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--rule-strong); background: var(--surface); }
  .schakel { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .schakel button { border: 0; background: transparent; padding: 8px 12px; font-size: 13px; cursor: pointer; color: var(--muted); white-space: nowrap; flex: none; }
  .schakel button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
  .vink { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .telregel { font-size: 13px; color: var(--muted); }

  .lijst { display: grid; background: var(--surface); border-radius: 14px; padding: 0 18px; }
  .groep-kop { display: flex; align-items: center; gap: 10px; padding: 18px 0 8px; border-bottom: 2px solid var(--ink); }
  .groep-kop b { font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: -.1px; }
  .groep-kop .tel { font-size: 12px; color: var(--muted); }
  .rij { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto 56px 64px; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit; }
  .rij:last-child { border-bottom: 0; }
  .rij:hover .rij-titel b { text-decoration: underline; }
  .rij.is-archief { opacity: .55; }
  .rij-titel { min-width: 0; display: grid; gap: 1px; }
  .rij-titel b { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rij-titel > span:last-child { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rij .acties-tel, .rij .datum { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
  .rij-meta { display: none; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
  @media (max-width: 760px) {
    .lijst { padding: 0 14px; }
    .rij { grid-template-columns: 16px minmax(0, 1fr) auto; grid-template-areas: "st titel datum" ". meta meta"; row-gap: 4px; }
    .rij > .st { grid-area: st; align-self: start; margin-top: 18px; }
    .rij > .rij-titel { grid-area: titel; }
    .rij > .datum { grid-area: datum; align-self: start; }
    .rij > .cat, .rij > .prio-cel, .rij > .acties-tel { display: none; }
    .rij > .rij-meta { grid-area: meta; display: flex; }
  }
  .lijst .todo-item:last-child { border-bottom: 0; }

  /* Reeks-tegels en grafieken (Overzicht) */
  .reeksen { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .reeks-tegel { display: grid; gap: 6px; align-content: start; padding: 18px; background: var(--surface); border-radius: 14px; text-decoration: none; color: inherit; transition: transform .4s var(--ease); }
  .reeks-tegel:hover { transform: translateY(-2px); }
  .reeks-tegel .boven { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .reeks-tegel b { font-weight: 800; font-size: 15px; }
  .reeks-tegel .groot { font-weight: 900; font-size: 28px; line-height: 1; }
  .reeks-tegel p { margin: 0; font-size: 12px; color: var(--muted); }
  .grafieken { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 760px) { .grafieken { grid-template-columns: minmax(0, 1fr); } }
  .grafiek { display: grid; gap: 8px; align-content: start; }
  .grafiek h2 { font-size: 15px; font-weight: 600; }
  .grafiek p { margin: 0; font-size: 12px; color: var(--muted); }
  .grafiek svg { width: 100%; height: auto; display: block; }
  .grafiek svg text { fill: var(--ink); font-family: var(--font); font-size: 12px; font-variant-numeric: tabular-nums; }
  .grafiek svg .as { stroke: var(--rule-strong); }
  .grafiek svg .raster { stroke: var(--rule); stroke-dasharray: 2 4; }
  .grafiek svg .staaf { fill: var(--muted); }
  .grafiek svg .laatste { fill: var(--ink); }
  .grafiek svg .hit { fill: transparent; }
  .tip { position: fixed; z-index: 60; pointer-events: none; padding: 6px 10px; border-radius: 6px; background: var(--ink); color: var(--surface); font-size: 12px; font-weight: 600; white-space: nowrap; }

  /* ── Dossier ────────────────────────────────────────────────────────── */
  .banner { padding: 12px 16px; background: var(--surface); border-radius: 10px; font-size: 13px; box-shadow: inset 3px 0 0 var(--ink); }
  .banner a { font-weight: 600; }
  .dossier { background: var(--surface); border-radius: 18px; overflow: hidden; }
  .d-head { padding: clamp(20px, 4vw, 40px); border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 14px; }
  .d-series { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
  .d-series b { font-weight: 900; font-size: clamp(22px, 2.8vw, 34px); letter-spacing: -.5px; text-transform: uppercase; line-height: 1; }
  .d-series .ver { font-weight: 800; font-size: clamp(22px, 2.8vw, 34px); line-height: 1; color: var(--muted); }
  .d-series .of { font-size: 12px; color: var(--muted); font-weight: 500; }
  .runs { display: flex; gap: 4px; align-items: center; }
  .runs a, .runs span { width: 18px; height: 6px; border-radius: 3px; background: var(--rule-strong); display: block; }
  .runs a:hover { background: var(--ink-2); }
  .runs .cur { background: var(--ink); }
  .d-titel { font-size: clamp(20px, 2.3vw, 28px); font-weight: 600; line-height: 1.25; letter-spacing: -.3px; max-width: 40ch; }
  .d-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); align-items: center; }
  .d-meta strong { color: var(--ink); font-weight: 600; }
  .d-meta > span { display: inline-flex; gap: 6px; align-items: center; }
  .d-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
  .d-main { padding: clamp(20px, 4vw, 40px); display: flex; flex-direction: column; gap: 40px; min-width: 0; }
  .d-side { padding: clamp(20px, 3vw, 32px); background: var(--sunk); border-left: 1px solid var(--rule); display: flex; flex-direction: column; gap: 24px; min-width: 0; }
  @media (max-width: 1020px) {
    .d-body { grid-template-columns: minmax(0, 1fr); }
    .d-side { border-left: 0; border-top: 1px solid var(--rule); }
    .desk { grid-template-columns: minmax(0, 1fr); }
  }

  .bluf { font-size: clamp(17px, 1.9vw, 21px); line-height: 1.55; font-weight: 500; max-width: 64ch; margin: 0; }
  .zin { font-weight: 600; }
  .hl { position: relative; z-index: 0; }
  .hl::before { content: ""; position: absolute; left: -1px; right: -1px; top: var(--hl-top); bottom: var(--hl-bottom); background: var(--new); z-index: -1; transform: scaleX(0); transform-origin: left center; }
  .zin.on .hl::before { transform: none; }

  .figs { display: grid; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .fig { padding: 18px 18px 18px 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .fig + .fig { padding-left: 18px; border-left: 1px solid var(--rule); }
  .fig b { font-weight: 800; font-size: clamp(28px, 3.4vw, 44px); line-height: 1; letter-spacing: -1px; overflow-wrap: anywhere; }
  .fig.lead b { font-size: clamp(34px, 4.4vw, 56px); }
  .fig span { font-size: 12px; color: var(--muted); font-weight: 500; }
  .delta { font-size: 13px; font-weight: 600; color: var(--ink) !important; }
  .delta.up::before, .delta.down::before { content: ""; display: inline-block; border: 5px solid transparent; margin-right: 5px; vertical-align: 1px; }
  .delta.up::before { border-bottom: 7px solid currentColor; border-top: 0; }
  .delta.down::before { border-top: 7px solid currentColor; border-bottom: 0; }
  @media (max-width: 600px) {
    .figs { grid-template-columns: 1fr 1fr !important; }
    .fig:nth-child(odd) { padding-left: 0; border-left: 0; }
    .fig:nth-child(n+3) { border-top: 1px solid var(--rule); }
  }

  .acc { border-top: 1px solid var(--rule); }
  .acc:last-child { border-bottom: 1px solid var(--rule); }
  .acc > summary { list-style: none; cursor: pointer; padding: 16px 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
  .acc > summary::-webkit-details-marker { display: none; }
  .acc h3 { font-size: 15px; font-weight: 600; }
  .acc p.sub { margin: 2px 0 0; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
  .acc[open] p.sub { display: none; }
  .chev { width: 28px; height: 28px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; transition: transform .5s var(--ease); }
  .chev::before { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); transform: translateY(-2px) rotate(45deg); }
  .acc[open] .chev { transform: rotate(180deg); }
  .acc-body { padding: 0 0 22px; }

  .props { margin: 0; display: flex; flex-direction: column; gap: 18px; }
  .prop { display: flex; flex-direction: column; gap: 6px; }
  .prop dt { font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .prop dd { margin: 0; font-size: 14px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .status-sel { width: 100%; appearance: none; -webkit-appearance: none; background-color: var(--surface); border: 0; border-radius: 10px; padding: 10px 34px 10px 12px; box-shadow: inset 0 0 0 1px var(--rule-strong); font-weight: 600; font-size: 14px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
  .links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 13px; width: 100%; }
  .links a { color: var(--ink); text-decoration: none; display: flex; flex-direction: column; min-width: 0; }
  .links a small { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .links a span { overflow-wrap: anywhere; }
  .links a:hover span { text-decoration: underline; }
  .bronlink { font-weight: 600; font-size: 13px; text-decoration: none; }
  .bronlink:hover { text-decoration: underline; }
  .notes { display: grid; gap: 8px; width: 100%; }
  .note { padding: 10px 12px; background: var(--surface); border-radius: 10px; font-size: 13px; }
  .note .wie { font-size: 11px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 2px; }
  .note .wat { white-space: pre-wrap; overflow-wrap: anywhere; }
  textarea { width: 100%; min-height: 90px; resize: vertical; border: 0; border-radius: 10px; padding: 10px 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule-strong); font-size: 14px; }
  .knop { display: inline-flex; align-items: center; gap: 10px; border: 0; cursor: pointer; background: var(--ink); color: var(--surface); border-radius: 99px; padding: 8px 8px 8px 18px; font-weight: 600; font-size: 14px; white-space: nowrap; text-decoration: none; transition: transform .3s var(--ease); }
  .knop i { width: 24px; height: 24px; border-radius: 50%; background: color-mix(in srgb, var(--surface) 16%, transparent); display: grid; place-items: center; transition: transform .4s var(--ease); }
  .knop i::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-top: 1.5px solid currentColor; transform: translateX(-1px) rotate(45deg); }
  .knop:hover i { transform: translateX(2px); }
  .knop:active { transform: scale(.97); }
  .knop:disabled { opacity: .45; cursor: not-allowed; }
  .invoer { display: grid; gap: 10px; width: 100%; }

  .bladeren { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 18px; }
  .bladeren a { display: grid; gap: 2px; text-decoration: none; padding: 10px 14px; background: var(--sunk); border-radius: 10px; max-width: 48%; min-width: 0; }
  .bladeren a:hover b { text-decoration: underline; }
  .bladeren a span { font-size: 12px; color: var(--muted); }
  .bladeren a b { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bladeren .volgende { margin-left: auto; text-align: right; }
  @media (max-width: 600px) { .bladeren a { max-width: 100%; flex: 1 1 100%; } }

  /* Markdown */
  .md { max-width: 74ch; overflow-wrap: anywhere; font-size: 14.5px; color: var(--ink-2); }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4 { color: var(--ink); text-transform: none; letter-spacing: 0; margin: 1.5em 0 .5em; line-height: 1.3; }
  .md h1 { font-size: 1.35rem; font-weight: 800; }
  .md h2 { font-size: 1.2rem; font-weight: 800; }
  .md h3 { font-size: 1.05rem; font-weight: 700; }
  .md h4 { font-size: .95rem; font-weight: 700; }
  .md strong { color: var(--ink); }
  .md p, .md ul, .md ol { margin: .6em 0; }
  .md li { margin: .25em 0; }
  .md a { color: var(--ink); text-decoration-thickness: 1px; text-underline-offset: 2px; font-weight: 500; }
  .md blockquote { margin: 1em 0; padding: 10px 16px; background: var(--sunk); border-radius: 8px; }
  .md blockquote p { margin: .3em 0; }
  .md pre { overflow-x: auto; background: var(--sunk); padding: 14px; border-radius: 8px; }
  .md pre code { background: none; padding: 0; }
  .md hr { border: 0; border-top: 1px solid var(--rule); margin: 1.6em 0; }
  .md .tabel { overflow-x: auto; margin: 1em 0; }
  .md table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .md th, .md td { text-align: left; vertical-align: top; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--rule); }
  .md th { font-weight: 600; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); border-bottom-color: var(--rule-strong); }
  .md--breed { max-width: none; }
  .md-vlak { background: var(--surface); border-radius: 14px; padding: clamp(18px, 3vw, 32px); }

  /* ── Beweging: subtiel, alleen transform/opacity, vanaf zichtbare rusttoestand ── */
  @media (prefers-reduced-motion: no-preference) {
    .animeer .rise { animation: rise .8s var(--ease) both; animation-delay: calc(var(--r, 0) * 60ms); }
    @keyframes rise { from { transform: translateY(12px); } to { transform: none; } }
    .pulse.aan::after { animation: ping 2.4s var(--ease) infinite; }
    @keyframes ping { 0% { transform: scale(.6); opacity: .8; } 100% { transform: scale(1.8); opacity: 0; } }
    .animeer .cell.ran { animation: pop .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 35ms + 200ms); }
    @keyframes pop { from { transform: scale(.4); } to { transform: none; } }
    .hl::before { transition: transform .45s var(--ease); transition-delay: calc(var(--w, 0) * 30ms); }
    .acc[open] > .acc-body { animation: uitklap .45s var(--ease) both; }
    @keyframes uitklap { from { opacity: .35; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  @media (max-width: 760px) {
    .results { grid-template-columns: minmax(0, 1fr); }
    .res { padding-right: 0; padding-bottom: 14px; }
    .res + .res { padding-left: 0; border-left: 0; border-top: 1px solid var(--rule); }
    .tally { gap: 22px; }
  }

  /* ── Cijferstrook + doelbalk (Vandaag) ─────────────────────────────── */
  .strook { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--rule); border-radius: 14px; overflow: hidden; }
  .kpi { background: var(--surface); padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .kpi .k-label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .kpi b { font-weight: 800; font-size: clamp(24px, 2.4vw, 32px); line-height: 1.05; letter-spacing: -.5px; overflow-wrap: anywhere; }
  .kpi.is-leeg b { color: var(--muted); font-weight: 600; font-size: 15px; letter-spacing: 0; line-height: 1.4; }
  .kpi .k-sub { font-size: 12px; color: var(--muted); }
  .kpi .k-bron { font-size: 11px; color: var(--muted); margin-top: auto; padding-top: 6px; }
  .kpi .k-bron a { color: var(--ink-2); font-weight: 600; }
  .doel { grid-column: 1 / -1; background: var(--surface); padding: 16px 20px 18px; display: grid; gap: 10px; }
  .doel-kop { display: flex; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .doel-kop b { color: var(--ink); font-weight: 700; }
  .balk { position: relative; height: 10px; border-radius: 99px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--rule); }
  .balk > i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--ink); max-width: 100%; }
  .balk > s { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--muted); border-radius: 1px; }
  @media (max-width: 1020px) {
    .strook { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .strook > .kpi:first-child { grid-column: span 2; }
  }
  @media (max-width: 600px) {
    .strook { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi { padding: 14px 16px; }
    .doel { padding: 14px 16px 16px; }
  }

  /* ── Tweede bureau (besluit/kansen, agenda/deadlines) ───────────────── */
  .duo { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 40px; align-items: start; }
  @media (max-width: 1020px) { .duo { grid-template-columns: minmax(0, 1fr); } }
  .uitleg-leeg { margin: 0; padding: 14px 0; font-size: 13px; color: var(--muted); max-width: 60ch; }
  .uitleg-leeg a { color: var(--ink); font-weight: 600; }
  .uitleg-leeg code { font-size: .92em; }

  /* Kansen */
  .kansen { list-style: none; margin: 0; padding: 0; }
  .kans { padding: 14px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; }
  .kans-kop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .kans h3 { font-size: 15px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
  .kans-rechts { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
  .impact { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .4px; padding: 1px 8px; border-radius: 99px; white-space: nowrap; line-height: 18px; }
  .impact--hoog { background: var(--ink); color: var(--surface); }
  .impact--middel { box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); }
  .impact--laag { box-shadow: inset 0 0 0 1px var(--rule-strong); color: var(--muted); }
  .keten { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .keten a { font-weight: 600; text-decoration: none; color: var(--ink-2); padding: 1px 9px; border-radius: 99px; box-shadow: inset 0 0 0 1px var(--rule-strong); white-space: nowrap; }
  .keten a:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .keten .plus { color: var(--muted); }
  .stap { font-size: 13px; color: var(--ink-2); line-height: 1.5; overflow-wrap: anywhere; }
  .stap b { color: var(--ink); font-weight: 600; }
  .kans-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); align-items: center; }
  .kans-meta a { color: var(--ink-2); font-weight: 600; text-decoration: none; }
  .kans-meta a:hover { text-decoration: underline; }
  .kans.is-dicht { opacity: .6; }
  .kans-menu:empty, .actie-menu:empty { display: none; }

  /* Agenda en deadlines: datumkolom + items */
  .kal { list-style: none; margin: 0; padding: 0; }
  .kal-dag { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .kal-datum { display: flex; flex-direction: column; gap: 3px; }
  .kal-datum b { font-weight: 800; font-size: 22px; line-height: 1; }

  // ── Grafieken ─────────────────────────────────────────────────────────────
  const NS = 'http://www.w3.org/2000/svg';

  const tip = $('tip');

  function weekGrafiek() {
    const data = R.stats.per_week || [];

    const max = Math.max(1, ...data.map(d => d.aantal));

    const slot = (W - links) / Math.max(1, data.length), bw = Math.min(26, slot * 0.62), basis = H - onder;
    const y = (v) => basis - (basis - top) * v / max;
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Onderzoeken per week' });
    for (let v = stap; v <= max; v += stap) {
      svg.append(svgEl('line', { class: 'raster', x1: links, y1: y(v), x2: W, y2: y(v) }));
      svg.append(svgEl('text', { x: 0, y: y(v) + 4, 'font-size': '11' }, String(v)));
    }
    svg.append(svgEl('line', { class: 'as', x1: links, y1: basis, x2: W, y2: basis }));
    data.forEach((d, i) => {
      const x = links + i * slot + (slot - bw) / 2, h = basis - y(d.aantal), r = Math.min(4, h);
      const g = svgEl('g');
      if (h > 0) g.append(svgEl('path', { class: i === data.length - 1 ? 'laatste' : 'staaf', d: `M${x},${basis} v-${h - r} a${r},${r} 0 0 1 ${r},-${r} h${bw - 2 * r} a${r},${r} 0 0 1 ${r},${r} v${h - r} z` }));
      if (d.aantal) g.append(svgEl('text', { x: x + bw / 2, y: y(d.aantal) - 6, 'text-anchor': 'middle', 'font-weight': '600' }, String(d.aantal)));
      g.append(svgEl('text', { x: x + bw / 2, y: H - 6, 'text-anchor': 'middle', 'font-size': '11' }, 'W' + d.week.slice(-2)));
      g.append(svgEl('rect', { class: 'hit', x: links + i * slot, y: 0, width: slot, height: H }));
      hoverbaar(g, `Week ${Number(d.week.slice(-2))} (vanaf ${datumNL(d.start)}): ${d.aantal} ${d.aantal === 1 ? 'onderzoek' : 'onderzoeken'}`);

  }
  function categorieGrafiek() {
    const data = Object.entries(R.stats.per_categorie || {}).sort((a, b) => b[1] - a[1]);
    const W = 560, rij = 28, links = 104, rechts = 36, H = data.length * rij + 4;
    const max = Math.max(1, ...data.map(d => d[1]));
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${Math.max(H, 20)}`, role: 'img', 'aria-label': 'Onderzoeken per categorie' });
    svg.append(svgEl('line', { class: 'as', x1: links, y1: 0, x2: links, y2: H }));
    data.forEach(([cat, n], i) => {
      const yy = i * rij + 4, h = 18, b = Math.max(2, Math.round((W - links - rechts) * n / max)), r = Math.min(4, b / 2);
      const g = svgEl('g');

      g.append(svgEl('path', { class: 'staaf', d: `M${links},${yy} h${b - r} a${r},${r} 0 0 1 ${r},${r} v${h - 2 * r} a${r},${r} 0 0 1 -${r},${r} h-${b - r} z` }));

  function niceStap(bereik, n) {
    if (!(bereik > 0)) return 1;
    const ruw = bereik / n, mag = Math.pow(10, Math.floor(Math.log10(ruw))), f = ruw / mag;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  }
  // Lijngrafiek: punten [{label, v|null, lopend?, tekst?}]; omgekeerd = lager is beter (positie 1 bovenaan)
  function lijnGrafiek(punten, o) {
    o = o || {};
    const W = o.breedte || 480, H = o.hoogte || 200, links = o.links || 50, rechts = 14, top = 18, onder = 26, basis = H - onder;
    const vals = punten.map(p => p.v).filter(v => v != null);
    if (!vals.length) return null;
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (!o.omgekeerd) lo = Math.min(0, lo);
    if (hi === lo) { if (o.omgekeerd) { lo = Math.max(1, lo - 2); hi = hi + 2; } else hi = lo + Math.max(1, Math.abs(lo) * 0.2); }
    const stap = niceStap(hi - lo, o.omgekeerd ? 3 : 4);
    lo = Math.floor(lo / stap) * stap; hi = Math.ceil(hi / stap) * stap;
    if (o.omgekeerd && lo < 1 && stap === 1) lo = 1;
    const y = (v) => o.omgekeerd ? top + (v - lo) / (hi - lo) * (basis - top) : basis - (v - lo) / (hi - lo) * (basis - top);
    const n = punten.length, slot = n > 1 ? (W - links - rechts) / (n - 1) : W - links - rechts;
    const x = (i) => n === 1 ? (links + W - rechts) / 2 : links + i * slot;
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': o.label || 'Lijngrafiek', class: o.klein ? 'klein' : '' });
    for (let k = 0; lo + k * stap <= hi + stap / 1000; k++) {
      const t = +(lo + k * stap).toFixed(6), yy = y(t);
      const isAs = o.omgekeerd ? Math.abs(t - hi) < stap / 1000 : k === 0;
      svg.append(svgEl('line', { class: isAs ? 'as' : 'raster', x1: links, y1: yy, x2: W - rechts, y2: yy }));
      if (!(o.omgekeerd && t < 1)) svg.append(svgEl('text', { class: 'aslabel', x: links - 8, y: yy + 4, 'text-anchor': 'end' }, o.as ? o.as(t) : String(t)));
    }
    const px = (i) => x(i).toFixed(1), py = (i) => y(punten[i].v).toFixed(1);
    // doorlopende stukken zonder gaten; de lopende week apart en gestippeld
    const stukken = []; let cur = [];
    punten.forEach((p, i) => { if (p.v == null || p.lopend) { if (cur.length) stukken.push(cur); cur = []; } else cur.push(i); });
    if (cur.length) stukken.push(cur);
    const pad = (s) => s.map((i, k) => (k ? 'L' : 'M') + px(i) + ',' + py(i)).join('');
    stukken.forEach(s => {
      if (!o.omgekeerd && s.length > 1) svg.append(svgEl('path', { class: 'vlak', d: pad(s) + `L${px(s[s.length - 1])},${basis}L${px(s[0])},${basis}Z` }));
      svg.append(svgEl('path', { class: 'lijn', d: pad(s) }));
    });
    punten.forEach((p, i) => { if (p.lopend && p.v != null && i > 0 && punten[i - 1].v != null) svg.append(svgEl('path', { class: 'lijn', 'stroke-dasharray': '3 4', d: `M${px(i - 1)},${py(i - 1)}L${px(i)},${py(i)}` })); });
    const laatste = punten.map((p, i) => (p.v != null && !p.lopend ? i : -1)).filter(i => i >= 0).pop();
    const elke = Math.max(1, Math.ceil(n / (o.klein ? 4 : 6)));
    punten.forEach((p, i) => {
      const g = svgEl('g');
      if (p.v != null) g.append(svgEl('circle', { class: 'punt' + (i === laatste ? ' laatste' : ''), cx: px(i), cy: py(i), r: i === laatste ? 4.5 : 3 }));
      // laatste label rechts uitlijnen, anders valt het buiten de grafiek
      if ((n - 1 - i) % elke === 0) g.append(svgEl('text', { class: 'aslabel', x: i === n - 1 && n > 1 ? W - 1 : px(i), y: H - 6, 'text-anchor': i === n - 1 && n > 1 ? 'end' : 'middle' }, p.label));
      g.append(svgEl('rect', { class: 'hit', x: (x(i) - slot / 2).toFixed(1), y: 0, width: slot.toFixed(1), height: H }));
      hoverbaar(g, p.tekst || `${p.label}: ${p.v == null ? 'geen data' : o.fmt ? o.fmt(p.v) : p.v}`);
      svg.append(g);
    });
    if (laatste != null && !o.klein) {
      const ly = y(punten[laatste].v);
      svg.append(svgEl('text', { x: (x(laatste) - 8).toFixed(1), y: (ly < top + 16 ? ly + 20 : ly - 10).toFixed(1), 'text-anchor': 'end', 'font-weight': '700' }, o.fmt ? o.fmt(punten[laatste].v) : String(punten[laatste].v)));
    }

  }
  // Staven per dag (Shopify-omzet), deze week donker
  function dagGrafiek(dagen) {
    // viewBox op de echte breedte, zodat de tekst op elk scherm 12px blijft
    const vak = $('pagina'), W = Math.round(Math.max(320, Math.min(1100, (vak ? vak.clientWidth : 600) - 44))), H = 220, links = 50, rechts = 8, top = 16, onder = 26, basis = H - onder;
    const kaart = new Map(dagen.map(d => [d.dag, d]));
    const sorted = [...kaart.keys()].sort(), laatste = sorted[sorted.length - 1];
    const aantal = Math.min(90, Math.round((utc(laatste) - utc(sorted[0])) / 864e5) + 1);
    const lijst = [];
    for (let i = aantal - 1; i >= 0; i--) { const d = plusDagen(laatste, -i); lijst.push(kaart.get(d) || { dag: d, omzet: null, orders: null }); }
    const max = Math.max(1, ...lijst.map(d => num(d.omzet) || 0));
    const stap = niceStap(max, 4), boven = Math.ceil(max / stap) * stap;
    const y = (v) => basis - v / boven * (basis - top);
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Shopify-omzet per dag', class: 'echt' });
    for (let t = 0; t <= boven + stap / 1000; t += stap) {
      svg.append(svgEl('line', { class: t === 0 ? 'as' : 'raster', x1: links, y1: y(t), x2: W - rechts, y2: y(t) }));
      svg.append(svgEl('text', { class: 'aslabel', x: links - 8, y: y(t) + 4, 'text-anchor': 'end' }, '€' + COMPACT.format(t)));
    }
    const slot = (W - links - rechts) / lijst.length, bw = Math.max(1.5, slot * 0.7), maandag = maandagVan(VANDAAG);
    lijst.forEach((d, i) => {
      const g = svgEl('g'), xx = links + i * slot + (slot - bw) / 2, v = num(d.omzet) || 0, h = basis - y(v);
      if (h > 0) g.append(svgEl('rect', { class: 'staaf' + (d.dag >= maandag ? ' nu' : ''), x: xx.toFixed(1), y: y(v).toFixed(1), width: bw.toFixed(1), height: h.toFixed(1), rx: Math.min(2, bw / 2) }));
      if (d.dag.slice(8) === '01' || (i === 0 && Number(d.dag.slice(8)) <= 20)) g.append(svgEl('text', { class: 'aslabel', x: (xx + bw / 2).toFixed(1), y: H - 6, 'text-anchor': i === 0 ? 'start' : 'middle' }, MAANDEN[Number(d.dag.slice(5, 7)) - 1]));
      g.append(svgEl('rect', { class: 'hit', x: (links + i * slot).toFixed(1), y: 0, width: slot.toFixed(1), height: H }));
      hoverbaar(g, `${DAGEN[weekdag(d.dag)]} ${datumKort(d.dag)}: ` + (d.omzet == null ? 'geen data' : `${eur(d.omzet)}, ${getal(d.orders)} ${num(d.orders) === 1 ? 'order' : 'orders'}`));
      svg.append(g);
    });
    return svg;
  }

      afwezig: ['niet_gekoppeld', 'Niet gekoppeld', 'Je hebt Shopify niet gekoppeld in claude.ai.', `${KOPPEL_HOE} koppelen.`],
      kiezen: ['niet_gekoppeld', 'Kies een koppeling', 'Je hebt meer dan één Shopify-koppeling en nog niet gekozen welke.', 'Kies er één in de melding van claude.ai op de pagina Cijfers.'],
    })[L.shopify] || ['onbekend', 'Nog niet gevraagd', 'claude.ai vraagt om toestemming zodra je Cijfers opent.', ''];
    const regel = (naam, soort, [st, label, detail, hoe]) => el('div', { class: 'bron-rij' },
      el('h3', null, naam, el('small', { text: soort })), el('span', { class: 'stat stat--' + st, text: label }),
      el('p', { text: detail }), hoe ? el('p', { class: 'hoe' }, el('b', { text: 'Hoe: ' }), hoe) : null);
    return rise(el('section', { class: 'sectie' }, blokTitel('In jouw weergave', el('span', { class: 'tel', text: 'per persoon, live gecontroleerd' })),
      el('div', { class: 'lijst' },
        regel('Shopify live', 'Connector', shop),
        regel('Vraag Claude', 'Eigen Claude', state.sample ? ['ok', 'Werkt', 'Knoppen staan op elke onderzoeks- en backlogpagina en bij Laat Claude dit doen. Gaat van je eigen Claude-gebruik.', ''] : ['niet_gekoppeld', 'Niet beschikbaar', 'Vragen aan Claude werkt alleen als je het dashboard in claude.ai opent en het toestaat.', '']),
        regel('Bewerken', 'Gedeelde opslag', state.writable ? ['ok', 'Werkt', 'Afvinken, beheren, goedkeuren en nieuwe acties gaan om 05:00 naar de vault.', ''] : ['niet_gekoppeld', 'Alleen lezen', state.readOnlyReason || 'Alleen lezen.', '']))));
  }

  // ── Pagina: Wat Claude voor je kan doen ──
  function opdrachtRij({ a, o }) {
    const r = o.reg || {}, res = r.resultaat && typeof r.resultaat === 'object' ? r.resultaat : {};
    const titel = knip(stripMd(a ? a.tekst : r.titel || r.actie_id || 'Opdracht'), 110);
    const wanneer = o.wacht ? `${o.doc.naam || 'onbekend'} · ${tsKort(o.doc.ts)}` : r.bijgewerkt ? 'bijgewerkt ' + tijdNL(r.bijgewerkt) : '';
    const links = veiligeLinks(res);
    return el('li', { class: 'opdr' },
      el('div', { class: 'opdr-kop' }, a ? el('a', { href: actieHref(a), text: titel }) : el('b', { text: titel }), el('span', { class: 'chip chip--claude', text: opdrachtLabel(o) })),
      res.samenvatting ? el('p', { text: res.samenvatting }) : null,
      links.length ? el('p', null, 'Resultaat: ', links.map((l, i) => [i ? ', ' : '', el('a', { href: l.url, target: '_blank', rel: 'noopener', text: l.label || 'Bekijk' })])) : null,
      res.voor_mens ? el('p', null, el('b', { text: 'Wat jij nog doet: ' }), res.voor_mens) : null,
      el('div', { class: 'todo-meta' }, wanneer ? el('span', { class: 'num', text: wanneer }) : null, o.wacht ? el('span', { class: 'chip chip--sync', text: 'nog niet in vault' }) : null,
        a ? el('button', { type: 'button', class: 'knop2 knop2--klein', 'aria-haspopup': 'dialog', onclick: () => openClaude(a), text: 'Details' }) : null));
  }
  function paginaClaude(p) {
    p.append(kop({ eyebrow: 'Goedkeuren en laten uitvoeren', titel: 'Wat Claude voor je kan doen', tekst: 'Claude maakt concepten, onderzoek en voorbereidingen voor acties die jij goedkeurt. Live zetten en versturen doe je altijd zelf.' }));
    p.append(rise(el('section', { class: 'route-uitleg' },
      el('div', { class: 'panel' }, el('h2', { text: 'Zo werkt goedkeuren' }), el('ol', { class: 'stappen' },
        el('li', { text: 'De Actiecontrole beoordeelt elke open actie één keer: kan Claude dit helemaal, deels of niet? Dat zie je als chip bij de actie.' }),
        el('li', { text: 'Jij klikt op Laat Claude dit doen, leest wat Claude wel en niet doet, geeft eventueel een extra instructie en keurt goed.' }),
        el('li', { text: 'Elke ochtend om 05:00 neemt de Actiecontrole je goedkeuring mee naar de vault. Tot de Uitvoerder begint, kun je hem intrekken.' }),
        el('li', { text: 'Om 06:15 voert de Uitvoerder de opdracht uit. Het resultaat komt terug bij de actie en hieronder: een samenvatting, links naar de concepten en wat jij nog doet.' }))),
      el('div', { class: 'panel' }, el('h2', { text: 'Grenzen' }), el('dl', { class: 'uitleg-dl' },
        rij('Claude mag', 'Teksten, meta\'s, e-mailconcepten, code in het testthema, onderzoek en bestanden in de vault maken.'),
        rij('Claude doet nooit', 'Iets live zetten, versturen of publiceren. Prijzen, kortingen, voorraad, bestellingen of de checkout aanpassen.'),
        rij('Altijd bij jou', 'Nakijken, live zetten en versturen. Dat staat bij elke opdracht onder Wat jij nog doet.'),
        rij('Kosten', 'De Uitvoerder draait op het Claude-account van info@higrip.nl. Vraag Claude op het dashboard gaat van je eigen Claude-gebruik.'))))));

    const perActie = new Map();
    ACTIES.forEach(a => { const o = opdrachtInfo(a); if (o && o.status !== 'ingetrokken') perActie.set(a.id, { a, o }); });
    R.opdrachten.forEach(r => { if (!actieById[r.actie_id] && OPDRACHT_LABEL[r.status]) perActie.set('los:' + (r.id || r.actie_id), { a: null, o: { status: r.status, wacht: false, reg: r } }); });
    const alle = [...perActie.values()];
    const lopend = alle.filter(x => isLopend(x.o));
    const af = alle.filter(x => !isLopend(x.o)).sort((x, y) => String((y.o.reg || {}).bijgewerkt || '').localeCompare(String((x.o.reg || {}).bijgewerkt || '')));
    const kan = kanGoedkeuren().sort(actieSortering);
    const tel = (n, een, meer) => el('span', { class: 'tel num', text: n + ' ' + (n === 1 ? een : meer) });
    p.append(rise(el('section', { class: 'sectie' }, blokTitel('Loopt nu', tel(lopend.length, 'opdracht', 'opdrachten')),
      lopend.length ? el('ul', { class: 'lijst' }, lopend.map(opdrachtRij)) : el('p', { class: 'uitleg-leeg', text: 'Geen lopende opdrachten. Keur hieronder een actie goed om Claude aan het werk te zetten.' }))));
    p.append(rise(el('section', { class: 'sectie' }, blokTitel('Klaar voor jouw goedkeuring', tel(kan.length, 'actie', 'acties')),
      el('div', { class: 'melding', id: 'check-melding', role: 'status' }),
      kan.length ? el('ul', { class: 'todo' }, kan.map(a => actieRij(a, { waarom: true, claudeKnop: true })))
        : el('p', { class: 'uitleg-leeg', text: 'Nog geen acties waarvan de Actiecontrole zegt dat Claude ze kan doen. Hij beoordeelt elke open actie één keer, tijdens zijn ochtendrun om 05:00.' }))));
    p.append(rise(el('section', { class: 'sectie' }, blokTitel('Afgerond', tel(af.length, 'opdracht', 'opdrachten')),
      af.length ? el('ul', { class: 'lijst' }, af.slice(0, 20).map(opdrachtRij)) : el('p', { class: 'uitleg-leeg', text: 'Nog geen afgeronde opdrachten.' }))));
    return 'Claude';
  }

  // ── Verbinding: register eerst tonen, daarna de db erbij ──────────────────
  let rerenderGepland = false;
  function herrender() {
    if (rerenderGepland) return;
    rerenderGepland = true;
    requestAnimationFrame(() => {
      rerenderGepland = false;
      const actief = document.activeElement;
      const actiefId = actief && actief.id;
      const sel = actief && typeof actief.selectionStart === 'number' ? [actief.selectionStart, actief.selectionEnd] : null;
      // knop zonder id in een actie- of kansrij: na de render dezelfde knop terugzoeken, anders het werkvlak
      const haak = !actiefId && actief && actief.closest ? actief.closest('[data-actie-id],[data-kans-id]') : null;
      const haakSel = haak ? (haak.dataset.actieId != null ? `[data-actie-id="${CSS.escape(haak.dataset.actieId)}"] button` : `[data-kans-id="${CSS.escape(haak.dataset.kansId)}"] button`) : null;
      render(true);
      if (actief && !actief.isConnected && !DLG.open && document.activeElement === document.body) {
        const n = (haakSel && document.querySelector(haakSel)) || $('werk');
        if (n) n.focus({ preventScroll: true });
      }
      if (actiefId && $(actiefId)) { const nieuw = $(actiefId); nieuw.focus({ preventScroll: true }); if (sel && nieuw.setSelectionRange) try { nieuw.setSelectionRange(sel[0], sel[1]); } catch (e) { /* geen tekstveld */ } }
    });
  }
  function luister(collectie) {
    state.db.collection(collectie).onSnapshot(
      (snap) => { const map = {}; snap.docs.forEach(doc => { map[doc.id] = doc.data() || {}; }); state.overrides[collectie] = map; herrender(); },
      (e) => { if (e && e.code === 'revoked') zetAlleenLezen('Toegang tot de gedeelde opslag is ingetrokken; de pagina is nu alleen-lezen.'); }
    );
  }
  async function verbind() {
    if (!window.claude || typeof window.claude.use !== 'function') { zetAlleenLezen('Alleen lezen: lokale weergave zonder gedeelde opslag.'); return; }
    // sample en mcp los van de db: niets aanroepen, alleen de knoppen aanzetten
    window.claude.use('sample').then(f => { if (typeof f === 'function') { state.sample = f; herrender(); } }).catch(() => {});
    window.claude.use('mcp').then(m => { if (m) { state.mcp = m; herrender(); } }).catch(() => {});
    const db = await window.claude.use('db');
    if (!db) { zetAlleenLezen(); return; }
    state.db = db;
    const user = await window.claude.use('user');
    const mag = user ? await user.can('data.write') : null;
    if (mag === false) zetAlleenLezen();
    else {
      state.writable = true;   // null = onbekend: knoppen tonen, een geweigerde schrijfactie beslist
      $('toegang').textContent = 'Bewerken staat aan.';
      $('naam-veld').hidden = false;
      $('naam').value = lezen('hi-research-naam');
    }
    ['status', 'checks', 'aantekeningen', 'beheer', 'opdrachten', 'kansen', 'nieuwe_acties'].forEach(luister);   // één keer per collectie, nooit in render
    herrender();
  }

  // ── Start ─────────────────────────────────────────────────────────────────
  $('gebouwd').textContent = tijdNL(R.gebouwd);
  if (DATA.sync && DATA.sync.laatste_sync) { $('sync-regel').hidden = false; $('sync-regel').textContent = 'Laatste sync naar vault ' + tijdNL(DATA.sync.laatste_sync); }
  $('naam').addEventListener('change', (e) => opslaan('hi-research-naam', e.target.value.trim()));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') sluitMenu();
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (e.key === '/' && !DLG.open && !/INPUT|TEXTAREA|SELECT/.test(tag)) {
      e.preventDefault();
      if (!$('zoek')) location.hash = 'onderzoeken';
      requestAnimationFrame(() => $('zoek') && $('zoek').focus());
    }
  });
  render(false);
  verbind().catch(() => zetAlleenLezen('Alleen lezen: de gedeelde opslag is niet bereikbaar.'));
})();
</script>
