<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HÏ Grip Research Dashboard</title>
<meta name="description" content="Alle onderzoeken, routines en bevindingen van HÏ Grip op één plek — de vault is de bron.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap">
<style>
  /* ── Tokens: HÏ Grip-merkkleuren; licht op :root, donker via media + data-theme ── */
  :root {
    color-scheme: light;
    --bg: #FFFFFF;
    --surface: color-mix(in oklab, #EAE8E5 55%, #FFFFFF);
    --surface-2: #EAE8E5;
    --ink: #000000;
    --muted: color-mix(in oklab, var(--ink) 56%, var(--bg));
    --line: color-mix(in oklab, var(--ink) 11%, var(--bg));
    --nav-bg: #111111;
    --nav-ink: #FFFFFF;
    --nav-muted: rgba(255, 255, 255, 0.58);
    --nav-hover: rgba(255, 255, 255, 0.07);
    --nav-line: rgba(255, 255, 255, 0.10);
    --volt: #CCFF00;
    --orange: #FF6A00;
    --blue: #0011A7;
    --red: #E10600;
    --link: #0011A7;
    --nieuw: #0011A7;
    --chip-bg: #EAE8E5;
    --bar: #0011A7;
    --font: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --nav-w: 248px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111111;
      --surface: #1a1a1a;
      --surface-2: #222222;
      --ink: #FFFFFF;
      --nav-bg: #000000;
      --link: #FFFFFF;
      --nieuw: #CCFF00;
      --chip-bg: #262626;
      --bar: #CCFF00;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111111;
    --surface: #1a1a1a;
    --surface-2: #222222;
    --ink: #FFFFFF;
    --nav-bg: #000000;
    --link: #FFFFFF;
    --nieuw: #CCFF00;
    --chip-bg: #262626;
    --bar: #CCFF00;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font); -webkit-text-size-adjust: 100%; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  .micro { font-weight: 600; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; }
  .muted { color: var(--muted); }

  /* ── App-frame: vaste zijbalk + werkvlak ─────────────────────────────── */
  .app { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: 100vh; }
  .nav {
    position: sticky; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--nav-bg); color: var(--nav-ink);
    display: flex; flex-direction: column; gap: 22px; padding: 20px 12px 16px;
  }
  .merk { display: flex; align-items: baseline; gap: 8px; padding: 4px 10px 0; text-decoration: none; }
  .merk b { font-weight: 900; font-size: 20px; letter-spacing: -0.5px; text-transform: uppercase; }
  .merk span { font-weight: 600; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--volt); }
  .nav-groep { display: grid; gap: 2px; }
  .nav-kop { padding: 0 10px 6px; color: var(--nav-muted); }
  .nav a.item {
    display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: 6px; text-decoration: none; color: var(--nav-muted);
    font-weight: 500; font-size: 14px; position: relative;
  }
  .nav a.item:hover { background: var(--nav-hover); color: var(--nav-ink); }
  .nav a.item[aria-current="page"] { background: var(--nav-hover); color: var(--nav-ink); font-weight: 600; }
  .nav a.item[aria-current="page"]::before {
    content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--volt);
  }
  .nav a.item svg { width: 16px; height: 16px; }
  .nav .tel { font-size: 12px; color: var(--nav-muted); font-variant-numeric: tabular-nums; }
  .nav .tel--p1 { background: var(--orange); color: #000; font-weight: 700; padding: 0 7px; border-radius: 999px; }
  .nav .code { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; color: var(--nav-muted); border: 1px solid var(--nav-line); border-radius: 4px; text-align: center; line-height: 16px; }
  .nav-voet { margin-top: auto; display: grid; gap: 10px; padding: 12px 10px 0; border-top: 1px solid var(--nav-line); font-size: 12px; color: var(--nav-muted); }
  .nav-voet label { display: block; margin-bottom: 4px; }
  .nav-voet input {
    width: 100%; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--nav-line);
    background: rgba(255, 255, 255, 0.06); color: var(--nav-ink); font-size: 13px;
  }
  .nav-voet input::placeholder { color: var(--nav-muted); }
  .nav :focus-visible { outline-color: var(--volt); }

  .topbar { display: none; }
  .werk { min-width: 0; padding-inline: 16px; padding-block: 28px 64px; }
  .werk-in { max-width: 1120px; margin-inline: auto; display: grid; gap: 28px; }

  @media (max-width: 899px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .nav {
      position: fixed; z-index: 50; inset: 0 auto 0 0; width: min(300px, 86vw); height: auto;
      padding-top: calc(20px + env(safe-area-inset-top, 0px)); transform: translateX(-102%); transition: transform 180ms ease-out;
    }
    .nav.is-open { transform: none; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.5); }
    .topbar {
      display: flex; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
      background: var(--nav-bg); color: var(--nav-ink); padding: 10px 16px;
    }
    .topbar button { background: none; border: 1px solid var(--nav-line); color: var(--nav-ink); border-radius: 6px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; }
    .topbar b { font-weight: 900; text-transform: uppercase; letter-spacing: -0.3px; }
    .topbar span { color: var(--nav-muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar :focus-visible { outline-color: var(--volt); }
  }
  @media (prefers-reduced-motion: reduce) { .nav { transition: none; } }

  /* ── Paginakop ────────────────────────────────────────────────────────── */
  .pagina-kop { display: grid; gap: 6px; }
  .kruimel { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  .kruimel a { color: var(--muted); text-decoration: none; }
  .kruimel a:hover { color: var(--ink); text-decoration: underline; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  h1 { font-weight: 900; font-size: clamp(1.75rem, 4vw, 2.6rem); line-height: 1.02; text-transform: uppercase; letter-spacing: -0.5px; }
  h2 { font-weight: 800; font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; }
  .pagina-kop p { margin: 0; color: var(--muted); max-width: 70ch; }
  .sectie { display: grid; gap: 12px; }
  .sectie-kop { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .sectie-kop a { font-size: 13px; font-weight: 600; color: var(--link); text-decoration: none; }
  .sectie-kop a:hover { text-decoration: underline; }

  /* ── Chips, status-iconen, codes ──────────────────────────────────────── */
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
    font-weight: 600; font-size: 11px; letter-spacing: 0.5px; line-height: 18px; background: var(--chip-bg); color: var(--ink); border: 1px solid transparent;
  }
  .chip--P1 { background: var(--orange); color: #000; }
  .chip--P2 { background: transparent; border-color: var(--ink); }
  .chip--P3 { background: transparent; border-color: var(--line); color: var(--muted); }
  .chip--sync { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
  .code { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: 0.3px; }
  .st { width: 14px; height: 14px; flex: none; display: inline-block; vertical-align: -2px; }
  .st--nieuw { color: var(--nieuw); }
  .st--bekeken, .st--in-uitvoering { color: var(--ink); }
  .st--verwerkt, .st--gearchiveerd { color: var(--muted); }
  .deadline { color: var(--red); font-weight: 600; white-space: nowrap; }

  /* ── Overzicht: cijferstrook ──────────────────────────────────────────── */
  .strook { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .strook a { display: grid; gap: 2px; padding: 16px 18px; text-decoration: none; border-left: 1px solid var(--line); }
  .strook a:first-child { border-left: 0; }
  .strook a:hover { background: var(--surface); }
  .strook b { font-weight: 900; font-size: clamp(2rem, 5vw, 3rem); line-height: 1; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .strook span { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .strook .is-p1 b { color: var(--orange); }
  @media (max-width: 640px) {
    .strook { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .strook a:nth-child(3) { border-left: 0; }
    .strook a:nth-child(n+3) { border-top: 1px solid var(--line); }
  }
  .duo { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 32px; align-items: start; }
  @media (max-width: 1020px) { .duo { grid-template-columns: minmax(0, 1fr); } }

  /* ── Lijsten (Linear-stijl) ───────────────────────────────────────────── */
  .lijst { display: grid; border-top: 1px solid var(--line); }
  .groep-kop {
    display: flex; align-items: center; gap: 10px; padding: 14px 4px 8px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--bg); z-index: 2;
  }
  @media (max-width: 899px) { .groep-kop { top: calc(58px + env(safe-area-inset-top, 0px)); } }
  .groep-kop b { font-weight: 700; font-size: 14px; }
  .groep-kop .tel { font-size: 12px; color: var(--muted); }
  .rij {
    display: grid; grid-template-columns: 16px 56px minmax(0, 1fr) auto auto 64px 76px; gap: 12px; align-items: center;
    padding: 10px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit;
  }
  .rij:hover { background: var(--surface); }
  .rij.is-archief { opacity: 0.55; }
  .rij-titel { min-width: 0; display: grid; }
  .rij-titel b { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rij-titel span { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rij .acties-tel { font-size: 12px; color: var(--muted); text-align: right; }
  .rij .datum { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
  .rij--kort { grid-template-columns: 16px 56px minmax(0, 1fr) 76px; }
  @media (max-width: 760px) {
    .rij { grid-template-columns: 16px minmax(0, 1fr) auto; grid-template-areas: "st titel datum" ". meta meta"; row-gap: 4px; }
    .rij > .st { grid-area: st; }
    .rij > .rij-titel { grid-area: titel; }
    .rij > .datum { grid-area: datum; }
    .rij > .code, .rij > .cat, .rij > .prio, .rij > .acties-tel { display: none; }
    .rij > .rij-meta { grid-area: meta; display: flex !important; }
    .rij--kort { grid-template-columns: 16px minmax(0, 1fr) auto; }
  }
  .rij-meta { display: none; gap: 6px; flex-wrap: wrap; align-items: center; }
  .leeg { color: var(--muted); font-style: italic; padding: 16px 4px; }

  /* Actie-rijen */
  .actie {
    display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: start;
    padding: 12px 4px; border-bottom: 1px solid var(--line);
  }
  .actie input[type=checkbox] { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--orange); cursor: pointer; }
  .actie .tekst { font-weight: 500; }
  .actie.is-af .tekst { text-decoration: line-through; color: var(--muted); }
  .actie-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .actie-meta a { color: var(--link); text-decoration: none; font-weight: 600; }
  .actie-meta a:hover { text-decoration: underline; }
  .bol { width: 18px; height: 18px; display: grid; place-items: center; margin-top: 2px; color: var(--muted); }

  /* ── Filterbalk ───────────────────────────────────────────────────────── */
  .filterbalk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .zoek { flex: 1 1 260px; position: relative; }
  .zoek input { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .zoek svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
  .zoek kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 600 11px var(--font); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .kiezer { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 13px; }
  .schakel { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .schakel button { border: 0; background: var(--bg); padding: 7px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .schakel button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
  .vink { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .telregel { font-size: 13px; color: var(--muted); }

  /* ── Reeks-tegels ─────────────────────────────────────────────────────── */
  .reeksen { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .reeks-tegel {
    display: grid; gap: 8px; align-content: start; padding: 16px; border: 1px solid var(--line); border-radius: 10px;
    text-decoration: none; color: inherit;
  }
  .reeks-tegel:hover { border-color: var(--ink); }
  .reeks-tegel .boven { display: flex; justify-content: space-between; align-items: center; }
  .reeks-tegel b { font-weight: 800; font-size: 15px; }
  .reeks-tegel .groot { font-weight: 900; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
  .reeks-tegel p { margin: 0; font-size: 12px; color: var(--muted); }
  .codeblok { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; padding: 0 6px; border-radius: 4px; background: var(--ink); color: var(--bg); line-height: 18px; }

  /* ── Detailpagina ─────────────────────────────────────────────────────── */
  .detail { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 40px; align-items: start; }
  @media (max-width: 1020px) { .detail { grid-template-columns: minmax(0, 1fr); } .eigenschappen { order: -1; } }
  .detail-hoofd { display: grid; gap: 32px; min-width: 0; }
  .ondertitel { font-size: 16px; color: var(--muted); margin: 0; max-width: 70ch; }
  .kort {
    padding: 18px 20px; background: var(--surface); border-radius: 10px; display: grid; gap: 6px;
  }
  .kort p { margin: 0; font-size: 16px; line-height: 1.6; max-width: 72ch; }
  .eigenschappen {
    display: grid; gap: 0; border: 1px solid var(--line); border-radius: 10px; padding: 6px 16px;
    position: sticky; top: 20px;
  }
  @media (max-width: 1020px) { .eigenschappen { position: static; } }
  .eig { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .eig:last-child { border-bottom: 0; }
  .eig > span:first-child { color: var(--muted); }
  .eig select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 13px; width: 100%; }
  .eig a { color: var(--link); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
  .eig a:hover { text-decoration: underline; }
  .eig--blok { grid-template-columns: minmax(0, 1fr); align-items: start; gap: 6px; }
  .verwant { display: grid; gap: 6px; }
  .verwant a { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; font-weight: 500; color: var(--ink); }
  .verwant a span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bladeren { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }
  .bladeren a { display: grid; gap: 2px; text-decoration: none; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; max-width: 48%; min-width: 0; }
  .bladeren a:hover { border-color: var(--ink); }
  .bladeren a span { font-size: 12px; color: var(--muted); }
  .bladeren a b { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bladeren .volgende { margin-left: auto; text-align: right; }
  .banner { padding: 10px 14px; border: 1px dashed var(--muted); border-radius: 8px; font-size: 13px; }
  .banner a { color: var(--link); font-weight: 600; }

  /* Markdown */
  .md { max-width: 74ch; overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; }
  .md h1, .md h2, .md h3, .md h4 { text-transform: none; letter-spacing: 0; margin: 1.6em 0 0.5em; line-height: 1.3; }
  .md h1 { font-size: 1.4rem; font-weight: 800; }
  .md h2 { font-size: 1.25rem; font-weight: 800; }
  .md h3 { font-size: 1.05rem; font-weight: 700; }
  .md h4 { font-size: 0.95rem; font-weight: 700; }
  .md p, .md ul, .md ol { margin: 0.6em 0; }
  .md li { margin: 0.25em 0; }
  .md a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  .md blockquote { margin: 1em 0; padding: 10px 16px; background: var(--surface); border-radius: 8px; }
  .md blockquote p { margin: 0.3em 0; }
  .md code { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 0.86em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .md pre { overflow-x: auto; background: var(--surface); padding: 14px; border-radius: 8px; }
  .md pre code { background: none; padding: 0; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 1.6em 0; }
  .md .tabel { overflow-x: auto; margin: 1em 0; }
  .md table { border-collapse: collapse; width: 100%; font-size: 14px; }
  .md th, .md td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .md th { font-weight: 700; }
  .md--breed { max-width: none; }

  /* Aantekeningen */
  .notes { display: grid; gap: 10px; }
  .note { padding: 12px 14px; background: var(--surface); border-radius: 8px; }
  .note .wie { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 2px; }
  .note .wat { white-space: pre-wrap; overflow-wrap: anywhere; }
  .invoer { display: grid; gap: 10px; }
  .invoer textarea { width: 100%; min-height: 90px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .knop {
    justify-self: start; display: inline-flex; align-items: center; gap: 8px; padding: 9px 20px; border-radius: 30px; border: 0;
    background: var(--ink); color: var(--bg); font-weight: 700; font-size: 14px; letter-spacing: 0.5px; cursor: pointer;
  }
  .knop:disabled { opacity: 0.45; cursor: not-allowed; }
  .melding { font-size: 13px; color: var(--red); font-weight: 600; }
  .melding:empty { display: none; }

  /* Grafieken */
  .grafieken { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
  @media (max-width: 760px) { .grafieken { grid-template-columns: minmax(0, 1fr); } }
  .grafiek { display: grid; gap: 8px; }
  .grafiek p { margin: 0; font-size: 12px; color: var(--muted); }
  .grafiek svg { width: 100%; height: auto; display: block; }
  .grafiek svg text { fill: var(--ink); font-family: var(--font); font-size: 12px; font-variant-numeric: tabular-nums; }
  .grafiek svg .as { stroke: var(--line); }
  .grafiek svg .raster { stroke: var(--line); stroke-dasharray: 2 4; }
  .grafiek svg .staaf { fill: var(--bar); }
  .grafiek svg .laatste { fill: var(--orange); }
  .grafiek svg .hit { fill: transparent; }
  .tip { position: fixed; z-index: 60; pointer-events: none; padding: 6px 10px; border-radius: 6px; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600; white-space: nowrap; }
</style>

<div class="app">
  <nav class="nav" id="nav" aria-label="Hoofdmenu">
    <a class="merk" href="#overzicht"><b>HÏ Grip</b><span>Research</span></a>

    <header class="topbar">
      <button type="button" id="menu-knop" aria-label="Menu openen" aria-controls="nav" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <b>HÏ Grip</b><span id="topbar-titel">Overzicht</span>

</div>
<div class="tip" id="tip" role="tooltip" hidden></div>

<script src="data/register.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.12/marked.min.js"></script>
<script>
(function () {
  'use strict';
  const R = window.HI_RESEARCH || { notities: [], backlog: [], kaart_md: '', stats: {}, gebouwd: '' };
  const $ = (id) => document.getElementById(id);

  // ── Reeksen: elk onderzoek krijgt een reeks, code en volgnummer ──────────
  const REEKSEN = [
    { key: 'growth-radar', naam: 'Growth Radar', code: 'GR', uitleg: 'Dagelijkse trendscan, elke dag een ander thema (SEO, CRO, social, AI-search).' },
    { key: 'seo-conversietest', naam: 'SEO- & conversietest', code: 'SC', uitleg: 'Wekelijks: meten, auditen en concepten klaarzetten in Shopify. Volledig rapport in het Shopify-logboek.' },
    { key: 'seo-regressiecheck', naam: 'SEO-regressiecheck', code: 'RC', uitleg: 'Maandagcheck: is er sinds vorige week iets achteruitgegaan op higrip.nl?' },
    { key: 'search-console', naam: 'Search Console & rankings', code: 'GS', uitleg: 'Wekelijks: posities, klikken, zoektermen en kansen in Google.' },
    { key: 'backlinks-merchant', naam: 'Backlinks & Merchant Center', code: 'BL', uitleg: 'Maandelijks: autoriteit, links en Google Shopping-status.' },
    { key: 'concurrentie', naam: 'Concurrentie-monitor', code: 'CM', uitleg: 'Tweewekelijks: concurrenten, hun pagina’s, prijzen en advertenties.' },
    { key: 'denzel-week', naam: 'Weekoverzicht', code: 'WK', uitleg: 'Weekoverzicht uit de cloud-routine van Denzel.' },
    { key: 'strategie-maand', naam: 'Strategiesynthese', code: 'ST', uitleg: 'Maandelijks: alle onderzoek gebundeld tot onderbouwde strategische stappen.' },
    { key: 'los', naam: 'Losse onderzoeken', code: 'LO', uitleg: 'Audits, analyses en vragen buiten de vaste routines.' },
  ];
  const REEKS = Object.fromEntries(REEKSEN.map(r => [r.key, r]));
  const FOCUS = { 'seo-content': 'SEO content', 'seo-technisch': 'SEO techniek', 'cro': 'CRO', 'social': 'Social', 'ai-search': 'AI search', 'basislijn': 'Basislijn', 'social-content': 'Social content' };
  const STATUSSEN = ['nieuw', 'bekeken', 'in-uitvoering', 'verwerkt', 'gearchiveerd'];
  const STATUS_LABEL = { 'nieuw': 'Nieuw', 'bekeken': 'Bekeken', 'in-uitvoering': 'In uitvoering', 'verwerkt': 'Verwerkt', 'gearchiveerd': 'Gearchiveerd' };
  const CATEGORIEEN = ['SEO', 'CRO', 'Social', 'Product', 'B2B', 'Merk', 'Compliance', 'Techniek'];
  const MAANDEN = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];

  function isoWeek(iso) {
    const d = new Date(iso + 'T12:00:00Z');
    const dag = (d.getUTCDay() + 6) % 7;
    d.setUTCDate(d.getUTCDate() - dag + 3);
    const jan4 = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
    return 1 + Math.round(((d - jan4) / 864e5 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7);
  }
  function reeksVan(n) { return n.bron === 'routine' && REEKS[n.routine] ? n.routine : 'los'; }
  function naamVan(n, nr) {
    const slug = n.id.slice(11);
    switch (reeksVan(n)) {
      case 'growth-radar': {
        const f = slug.replace(/^growth-radar-/, '');
        return 'Growth Radar · ' + (FOCUS[f] || f.replace(/-/g, ' '));
      }
      case 'seo-conversietest': { const m = slug.match(/run-(\d+)/); return 'SEO- & conversietest · run ' + (m ? m[1] : nr); }
      case 'seo-regressiecheck': return 'Regressiecheck · week ' + isoWeek(n.datum);
      case 'denzel-week': return 'Weekoverzicht · week ' + isoWeek(n.datum);
      case 'search-console': return 'Search Console · week ' + isoWeek(n.datum);
      case 'backlinks-merchant': return 'Backlinks & Merchant · ' + MAANDEN[Number(n.datum.slice(5, 7)) - 1];
      case 'concurrentie': return 'Concurrentie · week ' + isoWeek(n.datum);
      case 'strategie-maand': return 'Strategie · ' + MAANDEN[Number(n.datum.slice(5, 7)) - 1] + ' ' + n.datum.slice(0, 4);
      default: return n.titel.split(' — ')[0];
    }
  }
  // Nummer per reeks in volgorde van verschijnen: GR-01 is de eerste Growth Radar
  (function verrijk() {
    const perReeks = {};
    [...R.notities].sort((a, b) => (a.datum + a.id).localeCompare(b.datum + b.id)).forEach(n => {
      const k = reeksVan(n);
      perReeks[k] = (perReeks[k] || 0) + 1;
      n._reeks = k;
      n._nr = perReeks[k];
      n._code = REEKS[k].code + '-' + String(n._nr).padStart(2, '0');
      n._naam = naamVan(n, n._nr);
    });
  })();
  const notitieById = Object.fromEntries(R.notities.map(n => [n.id, n]));
  const backlogById = Object.fromEntries(R.backlog.map(b => [b.id, b]));

  // ── Staat ─────────────────────────────────────────────────────────────────
  const state = {
    db: null, writable: false, readOnlyReason: '',
    overrides: { status: {}, checks: {}, aantekeningen: {} },
    lijst: { zoek: '', categorie: '', status: '', prioriteit: '', groep: lezen('hi-r-groep') || 'reeks', archief: false },
    acties: { bron: '', afgevinkt: false },
    drafts: {},
    route: '',
  };

  // ── Helpers ───────────────────────────────────────────────────────────────
  function el(tag, attrs, ...kids) {
    const node = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k === 'svg') node.innerHTML = v;   // alleen vaste, eigen iconen
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else if (k === 'checked' || k === 'disabled' || k === 'hidden' || k === 'selected') node[k] = !!v;
      else node.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return node;
  }
  function datumNL(iso) { if (!iso) return ''; const [j, m, d] = iso.slice(0, 10).split('-').map(Number); return `${d} ${MAANDEN[m - 1]} ${j}`; }
  function datumKort(iso) { if (!iso) return ''; const [, m, d] = iso.slice(0, 10).split('-').map(Number); return `${d} ${MAANDEN[m - 1]}`; }
  function tijdNL(iso) {
    if (!iso) return '—'; const d = new Date(iso); if (isNaN(d)) return iso;
    return d.toLocaleString('nl-NL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Amsterdam' });
  }
  function tsKort(iso) {
    const d = new Date(iso); if (isNaN(d)) return iso;
    const p = new Intl.DateTimeFormat('nl-NL', { timeZone: 'Europe/Amsterdam', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(d);
    const g = (t) => p.find(x => x.type === t).value;
    return `${g('year')}-${g('month')}-${g('day')} ${g('hour')}:${g('minute')}`;
  }
  const encActie = (id) => id.replace('#', '~');
  const backlogRoute = (id) => 'b-' + id.split('#')[1];
  function opslaan(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* privé venster */ } }
  function lezen(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

  const ICON = {
    overzicht: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.2" stroke="currentColor" stroke-width="1.4"/></svg>',
    onderzoeken: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 3.5h12M2 8h12M2 12.5h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    acties: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="3" stroke="currentColor" stroke-width="1.4"/><path d="M5 8.2l2 2 4-4.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    kaart: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M1.5 3.5l4-1.5 5 1.5 4-1.5v10.5l-4 1.5-5-1.5-4 1.5z M5.5 2v10.5 M10.5 3.5V14" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
    zoek: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.8" stroke="currentColor" stroke-width="1.5"/><path d="M10.6 10.6L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    bol: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/></svg>',
    vink: '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M5 8.2l2 2 4-4.4" style="stroke:var(--bg)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };
  // Status als vorm én kleur: leeg rondje → half → vinkje → gestreept (Linear-conventie)
  const ST = {
    'nieuw': '<svg viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.6"/><circle cx="7" cy="7" r="2.6" fill="currentColor"/></svg>',
    'bekeken': '<svg viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.6"/></svg>',
    'in-uitvoering': '<svg viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.6"/><path d="M7 3.4a3.6 3.6 0 010 7.2z" fill="currentColor"/></svg>',
    'verwerkt': '<svg viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.3" fill="currentColor"/><path d="M4.3 7.2l1.9 1.9 3.6-3.9" style="stroke:var(--bg)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    'gearchiveerd': '<svg viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.2 2"/></svg>',
  };
  function statusIcoon(status) {
    return el('span', { class: 'st st--' + status, svg: ST[status] || ST.bekeken, role: 'img', 'aria-label': 'Status: ' + (STATUS_LABEL[status] || status), title: STATUS_LABEL[status] || status });
  }
  const prioChip = (p) => el('span', { class: 'chip chip--' + p, text: p });

  // Markdown → HTML. Links naar andere notities blijven binnen het dashboard.
  function renderMd(md, doel) {
    doel.innerHTML = window.marked ? window.marked.parse(md || '', { gfm: true }) : '';
    doel.querySelectorAll('a[href]').forEach(a => {
      const m = decodeURIComponent(a.getAttribute('href')).match(/05_Research\/(\d{4}-\d{2}-\d{2}-[a-z0-9-]+)\.md$/);
      if (m && notitieById[m[1]]) { a.setAttribute('href', '#n-' + m[1]); a.textContent = notitieById[m[1]]._code + ' · ' + notitieById[m[1]]._naam; return; }
      a.target = '_blank'; a.rel = 'noopener';
    });
    doel.querySelectorAll('table').forEach(t => { const w = el('div', { class: 'tabel' }); t.replaceWith(w); w.append(t); });
    doel.querySelectorAll('input[type=checkbox]').forEach(c => { c.disabled = true; });
  }
  function secties(md) {
    const out = { intro: '', overige: [], acties: '', aantekeningen: '' };
    (md || '').split(/\n(?=## )/).forEach((deel, i) => {
      const m = deel.match(/^## (.+)\n?/);
      if (!m) { if (i === 0) out.intro = deel.replace(/^# .*\n?/, ''); return; }
      const kop = m[1].trim().toLowerCase();
      if (kop === 'acties') out.acties = deel;
      else if (kop === 'aantekeningen') out.aantekeningen = deel;
      else if (kop === 'in het kort') { /* staat al als samenvatting bovenaan */ }
      else out.overige.push(deel);
    });
    return out;
  }
  function vaultAantekeningen(sectie) {
    const re = /^- \*\*(.+?) · (\d{4}-\d{2}-\d{2} \d{2}:\d{2})\*\* — (.*)$/;
    return (sectie || '').split('\n').map(l => l.match(re)).filter(Boolean).map(m => ({ naam: m[1], ts: m[2], tekst: m[3], inVault: true }));
  }

  // ── Afgeleide gegevens ────────────────────────────────────────────────────
  function statusVan(n) { const o = state.overrides.status[n.id]; return o && STATUSSEN.includes(o.status) ? o.status : n.status; }
  function afgevinkt(a) { const o = state.overrides.checks[encActie(a.id)]; return o ? !!o.afgevinkt : a.afgevinkt; }
  function heeftOverride(a) { return !!state.overrides.checks[encActie(a.id)]; }
  function vervangenDoor(n) { return R.notities.filter(m => (m.vervangt || []).includes(n.id)); }
  function openActies(n) { return n.acties.filter(a => !afgevinkt(a)).length; }
  function alleActies() {
    const lijst = [];
    for (const n of R.notities) for (const a of n.acties) lijst.push({ ...a, notitie: n, bronType: 'notitie' });
    for (const b of R.backlog) lijst.push({ id: b.id, tekst: b.kop, prioriteit: b.prioriteit, afgevinkt: b.afgevinkt, backlog: b, bronType: 'backlog' });
    return lijst;
  }
  function tellers() {
    const t = { P1: 0, P2: 0, P3: 0 };
    for (const a of alleActies()) if (!afgevinkt(a)) t[a.prioriteit]++;
    return t;
  }
  function inReeks(key) { return R.notities.filter(n => n._reeks === key); }

  // ── Navigatie ─────────────────────────────────────────────────────────────
  function navItem(href, icoon, label, tel, telKlasse) {
    return el('a', { class: 'item', href: '#' + href, 'data-route': href, onclick: sluitMenu },
      typeof icoon === 'string' ? el('span', { svg: icoon }) : icoon,
      el('span', { text: label }),
      tel != null ? el('span', { class: 'tel ' + (telKlasse || ''), text: tel }) : el('span'));
  }
  function renderNav() {
    const t = tellers();
    const nieuw = R.notities.filter(n => statusVan(n) === 'nieuw').length;
    $('nav-hoofd').replaceChildren(
      navItem('overzicht', ICON.overzicht, 'Overzicht'),
      navItem('onderzoeken', ICON.onderzoeken, 'Alle onderzoeken', nieuw ? nieuw + ' nieuw' : R.notities.length),
      navItem('acties', ICON.acties, 'Acties', t.P1 ? t.P1 + ' P1' : t.P1 + t.P2 + t.P3, t.P1 ? 'tel--p1' : ''),
      navItem('kaart', ICON.kaart, 'Waar staat wat'),
    );
    $('nav-reeksen').replaceChildren(...REEKSEN.map(r => navItem('reeks-' + r.key, el('span', { class: 'code', text: r.code }), r.naam, inReeks(r.key).length)));
    markeerNav();
  }
  function markeerNav() {
    const r = state.route;
    let actief = r;
    if (r.startsWith('n-')) { const n = notitieById[r.slice(2)]; actief = n ? 'reeks-' + n._reeks : 'onderzoeken'; }
    if (r.startsWith('b-')) actief = 'acties';
    document.querySelectorAll('.nav a.item').forEach(a => {
      if (a.dataset.route === actief) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }
  function sluitMenu() { $('nav').classList.remove('is-open'); $('menu-knop').setAttribute('aria-expanded', 'false'); }
  $('menu-knop').addEventListener('click', () => {
    const open = $('nav').classList.toggle('is-open');
    $('menu-knop').setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', (e) => {
    if ($('nav').classList.contains('is-open') && !$('nav').contains(e.target) && !$('menu-knop').contains(e.target)) sluitMenu();
  });

  // ── Router ────────────────────────────────────────────────────────────────
  function huidigeRoute() { return (location.hash || '').replace(/^#/, '') || 'overzicht'; }
  function render(behoudScroll) {
    const y = window.scrollY;
    const route = huidigeRoute();
    const nieuweRoute = route !== state.route;
    state.route = route;
    const p = $('pagina');
    p.replaceChildren();
    let titel = 'Overzicht';
    if (route === 'overzicht') titel = paginaOverzicht(p);
    else if (route === 'onderzoeken') titel = paginaLijst(p, null);
    else if (route.startsWith('reeks-') && REEKS[route.slice(6)]) titel = paginaLijst(p, route.slice(6));
    else if (route === 'acties') titel = paginaActies(p);
    else if (route === 'kaart') titel = paginaKaart(p);
    else if (route.startsWith('n-') && notitieById[route.slice(2)]) titel = paginaNotitie(p, notitieById[route.slice(2)]);
    else if (route.startsWith('b-') && backlogById['backlog#' + route.slice(2)]) titel = paginaBacklog(p, backlogById['backlog#' + route.slice(2)]);
    else titel = paginaNietGevonden(p);
    $('topbar-titel').textContent = titel;
    renderNav();
    if (nieuweRoute && !behoudScroll) { window.scrollTo(0, 0); } else { window.scrollTo(0, y); }
  }
  window.addEventListener('hashchange', () => render(false));

  function kop(opts) {
    const k = el('header', { class: 'pagina-kop' });
    if (opts.kruimel) k.append(el('nav', { class: 'kruimel', 'aria-label': 'Kruimelpad' }, ...opts.kruimel.flatMap((c, i) => [i ? el('span', { text: '/' }) : null, c.href ? el('a', { href: '#' + c.href, text: c.label }) : el('span', { text: c.label })])));
    else if (opts.eyebrow) k.append(el('div', { class: 'micro muted', text: opts.eyebrow }));
    k.append(el('h1', { text: opts.titel }));
    if (opts.tekst) k.append(el('p', { text: opts.tekst }));
    return k;
  }

  // ── Rijen ─────────────────────────────────────────────────────────────────
  function onderzoekRij(n, kort) {
    const status = statusVan(n);
    const open = openActies(n);
    const rij = el('a', { class: 'rij' + (kort ? ' rij--kort' : '') + (status === 'gearchiveerd' ? ' is-archief' : ''), href: '#n-' + n.id },
      statusIcoon(status),
      el('span', { class: 'code', text: n._code }),
      el('span', { class: 'rij-titel' }, el('b', { text: n._naam }), el('span', { text: n.samenvatting })),
    );
    if (!kort) rij.append(
      el('span', { class: 'cat chip', text: n.categorie }),
      el('span', { class: 'prio' }, prioChip(n.prioriteit)),
      el('span', { class: 'acties-tel num', text: n.acties.length ? `${open}/${n.acties.length}` : '–', title: n.acties.length ? `${open} van ${n.acties.length} acties open` : 'Acties via de backlog' }),
    );
    rij.append(el('span', { class: 'datum num', text: datumKort(n.datum) }));
    rij.append(el('span', { class: 'rij-meta' }, el('span', { class: 'code', text: n._code }), prioChip(n.prioriteit), el('span', { class: 'chip', text: n.categorie }),
      n.acties.length ? el('span', { class: 'code', text: `${open}/${n.acties.length} acties open` }) : null));
    return rij;
  }
  function actieRij(a) {
    const af = afgevinkt(a);
    const mag = state.writable;
    const li = el('div', { class: 'actie' + (af ? ' is-af' : '') });
    const vak = mag
      ? el('input', { type: 'checkbox', id: 'cb-' + encActie(a.id), checked: af, 'aria-label': 'Afvinken: ' + a.tekst, onchange: (e) => schrijfCheck(a, e.target) })
      : el('span', { class: 'bol', svg: af ? ICON.vink : ICON.bol, 'aria-label': af ? 'Afgevinkt' : 'Open' });
    const meta = el('div', { class: 'actie-meta' }, prioChip(a.prioriteit));
    if (a.bronType === 'backlog') {
      meta.append(el('a', { href: '#' + backlogRoute(a.id), text: 'Backlog · details' }));
      const gevonden = a.backlog.velden['Gevonden op']; if (gevonden) meta.append(el('span', { text: 'gevonden ' + gevonden }));
    } else {
      const n = a.notitie;
      meta.append(el('a', { href: '#n-' + n.id, text: n._code + ' · ' + n._naam }));
      if (n.deadline) meta.append(el('span', { class: 'deadline num', text: 'deadline ' + datumNL(n.deadline) }));
    }

    const y = (v) => basis - (basis - top) * v / max;
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Onderzoeken per week' });
    for (let v = stap; v <= max; v += stap) {
      svg.append(svgEl('line', { class: 'raster', x1: links, y1: y(v), x2: W, y2: y(v) }));
      svg.append(svgEl('text', { x: 0, y: y(v) + 4, 'font-size': '11' }, String(v)));
    }
    svg.append(svgEl('line', { class: 'as', x1: links, y1: basis, x2: W, y2: basis }));
    data.forEach((d, i) => {
      const x = links + i * slot + (slot - bw) / 2, h = basis - y(d.aantal), r = Math.min(4, h);
      const g = svgEl('g');
      if (h > 0) g.append(svgEl('path', { class: i === data.length - 1 ? 'laatste' : 'staaf', d: `M${x},${basis} v-${h - r} a${r},${r} 0 0 1 ${r},-${r} h${bw - 2 * r} a${r},${r} 0 0 1 ${r},${r} v${h - r} z` }));
      if (d.aantal) g.append(svgEl('text', { x: x + bw / 2, y: y(d.aantal) - 6, 'text-anchor': 'middle', 'font-weight': '600' }, String(d.aantal)));
      g.append(svgEl('text', { x: x + bw / 2, y: H - 6, 'text-anchor': 'middle', 'font-size': '11' }, 'W' + d.week.slice(-2)));
      g.append(svgEl('rect', { class: 'hit', x: links + i * slot, y: 0, width: slot, height: H }));
      hoverbaar(g, `Week ${Number(d.week.slice(-2))} (vanaf ${datumNL(d.start)}): ${d.aantal} ${d.aantal === 1 ? 'onderzoek' : 'onderzoeken'}`);
      svg.append(g);
    });
    return svg;
  }
  function categorieGrafiek() {
    const data = Object.entries(R.stats.per_categorie || {}).sort((a, b) => b[1] - a[1]);
    const W = 560, rij = 28, links = 104, rechts = 36, H = data.length * rij + 4;
    const max = Math.max(1, ...data.map(d => d[1]));
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Onderzoeken per categorie' });
    svg.append(svgEl('line', { class: 'as', x1: links, y1: 0, x2: links, y2: H }));
    data.forEach(([cat, n], i) => {
      const yy = i * rij + 4, h = 18, b = Math.max(2, Math.round((W - links - rechts) * n / max)), r = Math.min(4, b / 2);
      const g = svgEl('g');
      g.append(svgEl('text', { x: links - 10, y: yy + h / 2 + 4, 'text-anchor': 'end' }, cat));
      g.append(svgEl('path', { class: 'staaf', d: `M${links},${yy} h${b - r} a${r},${r} 0 0 1 ${r},${r} v${h - 2 * r} a${r},${r} 0 0 1 -${r},${r} h-${b - r} z` }));
      g.append(svgEl('text', { x: links + b + 8, y: yy + h / 2 + 4, 'font-weight': '600' }, String(n)));
      g.append(svgEl('rect', { class: 'hit', x: 0, y: yy, width: W, height: h }));
      hoverbaar(g, `${cat}: ${n} ${n === 1 ? 'onderzoek' : 'onderzoeken'}`);
      svg.append(g);
    });
    return svg;
  }

  // ── Schrijven naar de gedeelde opslag (zelfde documentvormen als /research-sync verwacht) ──
  function naamOfMelding(meldingId) {
    const naam = ($('naam').value || '').trim();
    if (!naam) {
      const m = meldingId && $(meldingId); if (m) m.textContent = 'Vul eerst je naam in, onderaan het menu.';
      if (window.matchMedia('(max-width: 899px)').matches) { $('nav').classList.add('is-open'); $('menu-knop').setAttribute('aria-expanded', 'true'); }
      $('naam').focus();
      return null;
    }
    opslaan('hi-research-naam', naam);
    return naam;
  }
  function zetAlleenLezen(reden) {
    state.writable = false;
    state.readOnlyReason = reden || 'Alleen lezen. Vraag bewerkrechten aan via info@higrip.nl';
    $('toegang').textContent = state.readOnlyReason;
    $('naam-veld').hidden = true;
    render(true);
  }
  function geweigerd(e, meldingId) {
    const code = e && e.code;
    if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked') { zetAlleenLezen('Alleen lezen: je hebt geen bewerkrechten op dit artifact. Vraag ze aan via info@higrip.nl'); return; }
    const m = meldingId && $(meldingId); if (m) m.textContent = 'Opslaan mislukt (' + (code || 'onbekend') + '). Probeer het zo nog eens.';
  }
  async function schrijfCheck(a, cb) {
    const naam = naamOfMelding('check-melding'); if (!naam) { cb.checked = !cb.checked; return; }
    cb.disabled = true;
    try { await state.db.doc('checks/' + encActie(a.id)).set({ actionId: a.id, afgevinkt: cb.checked, naam, ts: new Date().toISOString() }); }
    catch (e) { cb.checked = !cb.checked; geweigerd(e, 'check-melding'); }
    cb.disabled = false;
  }
  async function schrijfStatus(n, sel) {
    const naam = naamOfMelding('status-melding'); if (!naam) { sel.value = statusVan(n); return; }
    sel.disabled = true;
    try { await state.db.doc('status/' + n.id).set({ status: sel.value, naam, ts: new Date().toISOString() }); }
    catch (e) { sel.value = statusVan(n); geweigerd(e, 'status-melding'); }
    sel.disabled = false;
  }
  async function schrijfAantekening(n, ta, knop) {
    const tekst = (ta.value || '').trim();
    if (!tekst) { $('aantekening-melding').textContent = 'Schrijf eerst een aantekening.'; ta.focus(); return; }
    const naam = naamOfMelding('aantekening-melding'); if (!naam) return;
    knop.disabled = true;
    try {
      await state.db.doc(`aantekeningen/${n.id}_${Date.now()}`).set({ noteId: n.id, naam, ts: new Date().toISOString(), tekst });
      ta.value = ''; delete state.drafts[n.id];
    } catch (e) { geweigerd(e, 'aantekening-melding'); }
    knop.disabled = false;
  }

  // ── Verbinding: register eerst tonen, daarna de db erbij ──────────────────
  let rerenderGepland = false;
  function herrender() {
    if (rerenderGepland) return;
    rerenderGepland = true;
    requestAnimationFrame(() => {
      rerenderGepland = false;
      const actief = document.activeElement;
      const actiefId = actief && actief.id;
      const sel = actief && typeof actief.selectionStart === 'number' ? [actief.selectionStart, actief.selectionEnd] : null;
      render(true);
      if (actiefId && $(actiefId)) { const nieuw = $(actiefId); nieuw.focus({ preventScroll: true }); if (sel && nieuw.setSelectionRange) try { nieuw.setSelectionRange(sel[0], sel[1]); } catch (e) { /* geen tekstveld */ } }
    });
  }
  function luister(collectie) {
    state.db.collection(collectie).onSnapshot(
      (snap) => { const map = {}; snap.docs.forEach(doc => { map[doc.id] = doc.data() || {}; }); state.overrides[collectie] = map; herrender(); },
      (e) => { if (e && e.code === 'revoked') zetAlleenLezen('Toegang tot de gedeelde opslag is ingetrokken; de pagina is nu alleen-lezen.'); }
    );
  }
  async function verbind() {
    if (!window.claude || typeof window.claude.use !== 'function') { zetAlleenLezen('Alleen lezen: lokale weergave zonder gedeelde opslag.'); return; }
    const db = await window.claude.use('db');
    if (!db) { zetAlleenLezen(); return; }
    state.db = db;
    const user = await window.claude.use('user');
    const mag = user ? await user.can('data.write') : null;
    if (mag === false) zetAlleenLezen();
    else {
      state.writable = true;   // null = onbekend: knoppen tonen, een geweigerde schrijfactie beslist
      $('toegang').textContent = 'Bewerken staat aan.';
      $('naam-veld').hidden = false;
      $('naam').value = lezen('hi-research-naam');
    }
    ['status', 'checks', 'aantekeningen'].forEach(luister);   // één keer per collectie, nooit in render
    herrender();
  }

  // ── Start ─────────────────────────────────────────────────────────────────
  $('gebouwd').textContent = tijdNL(R.gebouwd);
  $('naam').addEventListener('change', (e) => opslaan('hi-research-naam', e.target.value.trim()));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') sluitMenu();
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(tag)) {
      e.preventDefault();
      if (!$('zoek')) location.hash = 'onderzoeken';
      requestAnimationFrame(() => $('zoek') && $('zoek').focus());
    }
  });
  render(false);
  verbind();
})();
</script>
