<title>HÏ Grip Research Dashboard</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Alle onderzoeken, routines, acties en de dagelijkse actiecontrole van HÏ Grip op één plek. De vault is de bron.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap">
<style>
  /* Tokens. Elke kleur heeft één betekenis: rood = P1, oranje = P2, volt = nieuw/ongelezen,
     blauw = door de actiecontrole bevestigd. Verder alleen zwart, wit, grijs en de neutrals. */
  :root {
    color-scheme: light;
    --ground: #EAE8E5;
    --surface: #FFFFFF;
    --sunk: #F4F3F1;
    --ink: #111111;
    --ink-2: #4A4945;
    --muted: #66645F;
    --rule: rgba(17, 17, 17, 0.10);
    --rule-strong: rgba(17, 17, 17, 0.24);
    --p1: #E10600;
    --p2: #FF6A00;
    --new: #CCFF00;
    --auto: #0011A7;
    --auto-soft: rgba(0, 17, 167, 0.08);
    --auto-ink: #0011A7;
    --rail: #111111;
    --rail-ink: #F2F1EE;
    --rail-muted: #9A9893;
    --rail-hover: rgba(255, 255, 255, 0.07);
    --rail-line: rgba(255, 255, 255, 0.10);
    --hl-top: 58%;
    --hl-bottom: 2px;
    --ease: cubic-bezier(.32, .72, 0, 1);
    --font: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #111111; --surface: #1a1a1a; --sunk: #151515;
      --ink: #F2F1EE; --ink-2: #C9C7C2; --muted: #8F8D88;
      --rule: rgba(242, 241, 238, 0.09); --rule-strong: rgba(242, 241, 238, 0.22);
      --auto-soft: rgba(120, 135, 255, 0.13); --auto-ink: #A8B0FF;
      --rail: #000000;
      --hl-top: 80%; --hl-bottom: 3px;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #111111; --surface: #1a1a1a; --sunk: #151515;
    --ink: #F2F1EE; --ink-2: #C9C7C2; --muted: #8F8D88;
    --rule: rgba(242, 241, 238, 0.09); --rule-strong: rgba(242, 241, 238, 0.22);
    --auto-soft: rgba(120, 135, 255, 0.13); --auto-ink: #A8B0FF;
    --rail: #000000;
    --hl-top: 80%; --hl-bottom: 3px;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 400 15px/1.6 var(--font); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--auto-ink); outline-offset: 2px; }
  [hidden] { display: none !important; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  code { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: .86em; background: var(--sunk); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ── Frame: rail + werkvlak ─────────────────────────────────────────── */
  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
  .nav {
    position: sticky; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--rail); color: var(--rail-ink);
    display: flex; flex-direction: column; gap: 28px; padding: 26px 16px 18px;
  }
  .merk { display: grid; gap: 0; padding: 0 10px; text-decoration: none; }
  .merk b { font-weight: 900; font-size: 19px; letter-spacing: -0.3px; text-transform: uppercase; }
  .merk span { font-size: 10px; font-weight: 600; letter-spacing: 3px; color: var(--rail-muted); text-transform: uppercase; }
  .nav-groep { display: grid; gap: 2px; }
  .nav-kop { margin: 0 0 8px; padding: 0 10px; font-size: 10px; letter-spacing: 3px; font-weight: 600; color: var(--rail-muted); text-transform: uppercase; }
  .nav a.item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--rail-ink);
    font-weight: 500; font-size: 14px; position: relative;
  }
  .nav a.item.klein { font-size: 13px; padding: 6px 10px; }
  .nav a.item.is-leeg { color: var(--rail-muted); }
  .nav a.item:hover { background: var(--rail-hover); }
  .nav a.item[aria-current="page"] { background: rgba(255, 255, 255, 0.11); font-weight: 600; }
  .nav a.item[aria-current="page"]::before { content: ""; position: absolute; left: -16px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--rail-ink); }
  .nav .tel { font-size: 12px; color: var(--rail-muted); font-variant-numeric: tabular-nums; }
  .nav .tel--p1 { background: var(--p1); color: #fff; font-weight: 600; padding: 0 7px; border-radius: 99px; }
  .nav .tel--nieuw { background: var(--new); color: #111; font-weight: 600; padding: 0 7px; border-radius: 99px; }
  .nav-voet { margin-top: auto; display: grid; gap: 10px; padding: 14px 10px 0; border-top: 1px solid var(--rail-line); font-size: 12px; color: var(--rail-muted); }
  .nav-voet label { display: block; margin-bottom: 4px; }
  .nav-voet input { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--rail-line); background: rgba(255, 255, 255, 0.06); color: var(--rail-ink); font-size: 13px; }
  .nav-voet input::placeholder { color: var(--rail-muted); }
  .nav :focus-visible, .topbar :focus-visible { outline-color: var(--rail-ink); }

  .topbar { display: none; }
  .werk { min-width: 0; padding-block: 28px 96px; padding-inline: clamp(16px, 4vw, 56px); }
  .werk-in { max-width: 1180px; margin-inline: auto; display: flex; flex-direction: column; gap: 40px; }

  @media (max-width: 899px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .nav {
      position: fixed; z-index: 50; inset: 0 auto 0 0; width: min(300px, 86vw); height: auto;
      padding-top: calc(22px + env(safe-area-inset-top, 0px)); transform: translateX(-102%); transition: transform 220ms var(--ease);
    }
    .nav.is-open { transform: none; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.5); }
    .topbar {
      display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 40;
      background: var(--rail); color: var(--rail-ink); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    }
    .topbar button { background: none; border: 1px solid var(--rail-line); color: var(--rail-ink); border-radius: 8px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; flex: none; }
    .topbar b { font-weight: 900; text-transform: uppercase; letter-spacing: -0.3px; }
    .topbar span { color: var(--rail-muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }

  /* ── Paginakop ──────────────────────────────────────────────────────── */
  .pagina-kop { display: grid; gap: 8px; }
  .kruimel { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  .kruimel a { color: var(--muted); text-decoration: none; }
  .kruimel a:hover { color: var(--ink); text-decoration: underline; }
  .pagina-kop h1, .topline h1 { font-weight: 900; font-size: clamp(28px, 3.4vw, 42px); line-height: 1.02; letter-spacing: -1px; text-transform: uppercase; }
  .pagina-kop p { margin: 0; color: var(--muted); max-width: 70ch; }
  .sectie { display: grid; gap: 12px; }
  .block-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
  .block-title h2 { font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.2px; display: flex; align-items: center; gap: 10px; }
  .block-title a, .block-title .tel { font-size: 13px; color: var(--muted); text-decoration: none; font-weight: 500; }
  .block-title a:hover { color: var(--ink); text-decoration: underline; }
  .panel { background: var(--surface); border-radius: 14px; padding: 22px; }
  @media (max-width: 600px) { .panel { padding: 18px 16px; } }

  /* ── Chips en markeringen ───────────────────────────────────────────── */
  .prio { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .5px; padding: 2px 7px; border-radius: 5px; white-space: nowrap; line-height: 16px; }
  .prio.p1 { background: var(--p1); color: #fff; }
  .prio.p2 { background: var(--p2); color: #111; }
  .prio.p3 { box-shadow: inset 0 0 0 1.5px var(--rule-strong); color: var(--muted); }
  .newdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--new); box-shadow: 0 0 0 1.5px var(--ink); flex: none; }
  .autochip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .3px; color: var(--auto-ink); background: var(--auto-soft); padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .autochip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; white-space: nowrap; font-weight: 600; font-size: 11px; letter-spacing: .4px; line-height: 18px; background: var(--sunk); color: var(--ink-2); }
  .chip--sync { background: transparent; box-shadow: inset 0 0 0 1px var(--muted); color: var(--muted); }
  .deadline { font-weight: 700; color: var(--ink); white-space: nowrap; }
  .sname { display: flex; align-items: baseline; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-2); }
  .sname .v { font-weight: 600; letter-spacing: .5px; color: var(--muted); }
  .st { width: 14px; height: 14px; flex: none; display: inline-block; vertical-align: -2px; color: var(--ink); }
  .st--verwerkt, .st--gearchiveerd { color: var(--muted); }
  .leeg { color: var(--muted); padding: 12px 0; margin: 0; }
  .melding { font-size: 13px; color: var(--ink); font-weight: 600; }
  .melding:empty { display: none; }

  /* ── Vandaag: status + tellers ──────────────────────────────────────── */
  .vandaag-kop { display: flex; flex-direction: column; gap: 20px; }
  .statusbar { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .live { display: inline-flex; align-items: center; gap: 10px; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); position: relative; flex: none; }
  .pulse.aan { background: var(--auto-ink); }
  .pulse.aan::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--auto-ink); opacity: 0; }
  .topline { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
  .topline h1 { margin-top: 8px; }
  .tally { display: flex; gap: 28px; flex-wrap: wrap; }
  .tally a { display: flex; flex-direction: column; text-decoration: none; }
  .tally b { font-weight: 800; font-size: 34px; line-height: 1; }
  .tally b.rood { color: var(--p1); }
  .tally span { font-size: 11px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; margin-top: 8px; display: inline-flex; gap: 6px; align-items: center; }
  .tally a:hover span { color: var(--ink); }

  /* Actiecontrole-paneel */
  .check-panel { display: grid; gap: 18px; }
  .check-panel h2 { font-size: 15px; font-weight: 600; }
  .check-panel > div > p { margin: 4px 0 0; font-size: 13px; color: var(--muted); max-width: 64ch; }
  .results { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--rule); }
  .res { padding: 16px 18px 4px 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .res + .res { padding-left: 18px; border-left: 1px solid var(--rule); }
  .res-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .res-h b { font-weight: 800; font-size: 28px; line-height: 1; }
  .res-h span { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .res.ok .res-h b { color: var(--auto-ink); }
  .res-sub { font-size: 12px; color: var(--muted); margin: -4px 0 0; }
  .res ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: var(--ink-2); }
  .res li { line-height: 1.45; }
  .res li a { text-decoration: none; color: var(--ink); font-weight: 500; }
  .res li a:hover { text-decoration: underline; }
  .res li small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .res .meer { font-size: 12px; color: var(--muted); text-decoration: none; font-weight: 600; }
  .res .meer:hover { color: var(--ink); text-decoration: underline; }

  /* Bureau: eerst doen + nieuw binnen */
  .desk { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 40px; align-items: start; }
  .todo { list-style: none; margin: 0; padding: 0; }
  .todo-item { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--rule); transition: opacity .5s var(--ease); }
  .todo-item.done { opacity: .5; }
  .todo-item.done .todo-text { text-decoration: line-through; text-decoration-thickness: 1px; }
  .todo-item.is-dubbel { opacity: .6; }
  .check { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin: 2px 0 0; border-radius: 6px; cursor: pointer; box-shadow: inset 0 0 0 1.5px var(--rule-strong); background: var(--surface); display: grid; place-items: center; transition: transform .3s var(--ease); }
  .check:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .check:active { transform: scale(.88); }
  .check:checked { background: var(--ink); box-shadow: none; }
  .check.auto:checked { background: var(--auto); }
  .check::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px) scale(0); transition: transform .35s var(--ease); }
  .check.auto::after { border-color: #fff; }
  .check:checked::after { transform: rotate(-45deg) translate(1px, -1px) scale(1); }
  .check:disabled { cursor: wait; }
  .bol { width: 20px; height: 20px; margin-top: 2px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--rule-strong); display: grid; place-items: center; }
  .bol.is-af { background: var(--ink); box-shadow: none; }
  .bol.is-af.auto { background: var(--auto); }
  .bol.is-af::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
  .bol.is-af.auto::after { border-color: #fff; }
  .todo-text { display: block; font-size: 14.5px; line-height: 1.5; font-weight: 500; overflow-wrap: anywhere; cursor: default; }
  label.todo-text { cursor: pointer; }
  .why { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.5; overflow-wrap: anywhere; }
  .todo-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .todo-meta a { color: var(--ink-2); text-decoration: none; font-weight: 600; }
  .todo-meta a:hover { text-decoration: underline; }
  .bewijs { font-size: 12px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }

  .feed { list-style: none; margin: 0; padding: 0; }
  .feed a { display: block; padding: 14px 10px; margin: 0 -10px; border-bottom: 1px solid var(--rule); color: inherit; text-decoration: none; border-radius: 8px; transition: transform .4s var(--ease); }
  .feed a:hover { background: var(--surface); transform: translateX(3px); }
  .feed h3 { font-size: 15px; font-weight: 600; line-height: 1.35; margin-top: 4px; }
  .feed p { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .feed .meta { display: flex; gap: 10px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }

  /* Weekrooster */
  .week-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .week-head h2 { font-size: 15px; font-weight: 600; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; align-items: center; }
  .legend > span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .cell { width: 12px; height: 12px; border-radius: 3px; }
  .tabel-scroll { overflow-x: auto; }
  table.sched { border-collapse: collapse; width: 100%; min-width: 560px; }
  .sched th { font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; padding: 0 0 8px; letter-spacing: 1px; text-transform: uppercase; }
  .sched th:first-child { text-align: left; }
  .sched th.today { color: var(--ink); }
  .sched td { padding: 6px 0; text-align: center; border-top: 1px solid var(--rule); }
  .sched td:first-child { text-align: left; font-size: 13px; font-weight: 500; white-space: nowrap; padding-right: 12px; }
  .sched td:first-child small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
  .sched th:first-child, .sched td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); }
  .sched td.todaycol, .sched th.today { background: var(--sunk); }
  .cell { display: inline-block; width: 22px; height: 22px; border-radius: 6px; vertical-align: middle; }
  a.cell:hover { transform: scale(1.12); }
  .cell.ran { background: var(--ink); }
  .cell.plan { box-shadow: inset 0 0 0 1.5px var(--rule-strong); }
  .cell.miss { box-shadow: inset 0 0 0 1.5px var(--ink); background: repeating-linear-gradient(135deg, var(--ink-2) 0 1.5px, transparent 1.5px 5px); }
  .cell.off::after { content: ""; display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--rule-strong); margin: 9px auto; }

  .key { display: flex; flex-wrap: wrap; gap: 10px 22px; font-size: 12px; color: var(--muted); align-items: center; }
  .key > span { display: inline-flex; gap: 8px; align-items: center; }

  /* ── Lijsten ────────────────────────────────────────────────────────── */
  .filterbalk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .zoek { flex: 1 1 260px; position: relative; }
  .zoek input { width: 100%; padding: 9px 12px 9px 36px; border: 0; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule-strong); }
  .zoek svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
  .zoek kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 600 11px var(--font); color: var(--muted); box-shadow: inset 0 0 0 1px var(--rule-strong); border-radius: 4px; padding: 0 5px; }
  .kiezer { padding: 8px 10px; border: 0; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule-strong); font-size: 13px; }
  .schakel { display: inline-flex; border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--rule-strong); background: var(--surface); }
  .schakel button { border: 0; background: transparent; padding: 8px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .schakel button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
  .vink { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .telregel { font-size: 13px; color: var(--muted); }

  .lijst { display: grid; background: var(--surface); border-radius: 14px; padding: 0 18px; }
  .groep-kop { display: flex; align-items: center; gap: 10px; padding: 18px 0 8px; border-bottom: 2px solid var(--ink); }
  .groep-kop b { font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: -.1px; }
  .groep-kop .tel { font-size: 12px; color: var(--muted); }
  .rij { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto 56px 64px; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit; }
  .rij:last-child { border-bottom: 0; }
  .rij:hover .rij-titel b { text-decoration: underline; }
  .rij.is-archief { opacity: .55; }
  .rij-titel { min-width: 0; display: grid; gap: 1px; }
  .rij-titel b { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rij-titel > span:last-child { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rij .acties-tel, .rij .datum { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
  .rij-meta { display: none; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }

  // ── Grafieken ─────────────────────────────────────────────────────────────
  const NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs, text) { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v); if (text != null) n.textContent = text; return n; }

  function weekGrafiek() {
    const data = R.stats.per_week || [];
    const W = 560, H = 190, onder = 24, top = 20, links = 24;
    const max = Math.max(1, ...data.map(d => d.aantal));
    const stap = max <= 5 ? 1 : Math.ceil(max / 4);
    const slot = (W - links) / Math.max(1, data.length), bw = Math.min(26, slot * 0.62), basis = H - onder;
    const y = (v) => basis - (basis - top) * v / max;
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Onderzoeken per week' });
    for (let v = stap; v <= max; v += stap) {
      svg.append(svgEl('line', { class: 'raster', x1: links, y1: y(v), x2: W, y2: y(v) }));
      svg.append(svgEl('text', { x: 0, y: y(v) + 4, 'font-size': '11' }, String(v)));
    }
    svg.append(svgEl('line', { class: 'as', x1: links, y1: basis, x2: W, y2: basis }));
    data.forEach((d, i) => {
      const x = links + i * slot + (slot - bw) / 2, h = basis - y(d.aantal), r = Math.min(4, h);
      const g = svgEl('g');
      if (h > 0) g.append(svgEl('path', { class: i === data.length - 1 ? 'laatste' : 'staaf', d: `M${x},${basis} v-${h - r} a${r},${r} 0 0 1 ${r},-${r} h${bw - 2 * r} a${r},${r} 0 0 1 ${r},${r} v${h - r} z` }));
      if (d.aantal) g.append(svgEl('text', { x: x + bw / 2, y: y(d.aantal) - 6, 'text-anchor': 'middle', 'font-weight': '600' }, String(d.aantal)));
      g.append(svgEl('text', { x: x + bw / 2, y: H - 6, 'text-anchor': 'middle', 'font-size': '11' }, 'W' + d.week.slice(-2)));
      g.append(svgEl('rect', { class: 'hit', x: links + i * slot, y: 0, width: slot, height: H }));
      hoverbaar(g, `Week ${Number(d.week.slice(-2))} (vanaf ${datumNL(d.start)}): ${d.aantal} ${d.aantal === 1 ? 'onderzoek' : 'onderzoeken'}`);
      svg.append(g);
    });
    return svg;
  }
  function categorieGrafiek() {
    const data = Object.entries(R.stats.per_categorie || {}).sort((a, b) => b[1] - a[1]);
    const W = 560, rij = 28, links = 104, rechts = 36, H = data.length * rij + 4;
    const max = Math.max(1, ...data.map(d => d[1]));

    svg.append(svgEl('line', { class: 'as', x1: links, y1: 0, x2: links, y2: H }));
    data.forEach(([cat, n], i) => {

      const g = svgEl('g');
      g.append(svgEl('text', { x: links - 10, y: yy + h / 2 + 4, 'text-anchor': 'end' }, cat));
      g.append(svgEl('path', { class: 'staaf', d: `M${links},${yy} h${b - r} a${r},${r} 0 0 1 ${r},${r} v${h - 2 * r} a${r},${r} 0 0 1 -${r},${r} h-${b - r} z` }));
      g.append(svgEl('text', { x: links + b + 8, y: yy + h / 2 + 4, 'font-weight': '600' }, String(n)));

      const actief = document.activeElement;
      const actiefId = actief && actief.id;
      const sel = actief && typeof actief.selectionStart === 'number' ? [actief.selectionStart, actief.selectionEnd] : null;
      render(true);
      if (actiefId && $(actiefId)) { const nieuw = $(actiefId); nieuw.focus({ preventScroll: true }); if (sel && nieuw.setSelectionRange) try { nieuw.setSelectionRange(sel[0], sel[1]); } catch (e) { /* geen tekstveld */ } }
    });
  }
  function luister(collectie) {
    state.db.collection(collectie).onSnapshot(
      (snap) => { const map = {}; snap.docs.forEach(doc => { map[doc.id] = doc.data() || {}; }); state.overrides[collectie] = map; herrender(); },
      (e) => { if (e && e.code === 'revoked') zetAlleenLezen('Toegang tot de gedeelde opslag is ingetrokken; de pagina is nu alleen-lezen.'); }
    );
  }
  async function verbind() {
    if (!window.claude || typeof window.claude.use !== 'function') { zetAlleenLezen('Alleen lezen: lokale weergave zonder gedeelde opslag.'); return; }
    const db = await window.claude.use('db');
    if (!db) { zetAlleenLezen(); return; }
    state.db = db;
    const user = await window.claude.use('user');
    const mag = user ? await user.can('data.write') : null;
    if (mag === false) zetAlleenLezen();
    else {
      state.writable = true;   // null = onbekend: knoppen tonen, een geweigerde schrijfactie beslist
      $('toegang').textContent = 'Bewerken staat aan.';
      $('naam-veld').hidden = false;
      $('naam').value = lezen('hi-research-naam');
    }
    ['status', 'checks', 'aantekeningen'].forEach(luister);   // één keer per collectie, nooit in render
    herrender();
  }

  // ── Start ─────────────────────────────────────────────────────────────────
  $('gebouwd').textContent = tijdNL(R.gebouwd);
  $('naam').addEventListener('change', (e) => opslaan('hi-research-naam', e.target.value.trim()));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') sluitMenu();
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(tag)) {
      e.preventDefault();
      if (!$('zoek')) location.hash = 'onderzoeken';
      requestAnimationFrame(() => $('zoek') && $('zoek').focus());
    }
  });
  render(false);
  verbind().catch(() => zetAlleenLezen('Alleen lezen: de gedeelde opslag is niet bereikbaar.'));
})();
</script>
