<meta charset="utf-8">
<title>HÏ Grip Ad-landingspagina's</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,800;1,900&display=swap">
<style>
/* Layout v1.3: packs zoals op higrip.nl, onderste helft opnieuw: reviews, foto's, meting, vergelijking, FAQ, aanbod. Eerder v1.2: geen herhaling van de ad-foto. De ad-kop loopt door als titel van een productpagina-hero (galerij + koopblok boven de vouw), daarna het verkoopverhaal per sport */
:root{
  --black:#0A0A0A; --onyx:#111111; --carbon:#1a1a1a; --white:#FFFFFF; --titanium:#909194;
  --volt:#CCFF00; --red:#E10600; --trust:#00b67a;
  --ink-soft:#5b5b5d;
  --line-d:rgba(255,255,255,.14); --line-l:rgba(10,10,10,.12);
  --acc:var(--volt);
  --f:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gutr:max(16px,env(safe-area-inset-right,0px));
  --max:1240px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--onyx);color:var(--white);font:400 16px/1.6 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--volt);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr)}
h1,h2,h3{margin:0;text-transform:uppercase;letter-spacing:-.035em;text-wrap:balance}
p{margin:0}

/* ---------- prototypebalk (alleen in deze artifact) ---------- */
.proto{background:#2a2a2c;color:#d9d9db;font-size:12px;border-bottom:1px solid #3a3a3c}
.proto .wrap{display:flex;gap:16px;align-items:center;padding-block:6px;flex-wrap:nowrap}
.proto b{color:#fff;font-weight:600}
.proto__groups{display:flex;gap:18px;overflow-x:auto;padding-bottom:2px;max-width:100%}
.pgroup{display:flex;gap:6px;align-items:center;flex:none}
.pgroup span{font-weight:600;color:#fff;margin-right:4px;white-space:nowrap}
.pchip{display:flex;align-items:center;gap:6px;border:1px solid #4a4a4c;background:#1d1d1f;border-radius:10px;padding:3px 8px 3px 3px;cursor:pointer;white-space:nowrap;font-size:11px;color:#cfcfd1}
.pchip img{width:16px;height:28px;object-fit:cover;border-radius:6px}
.pchip[aria-current="true"]{border-color:#fff;color:#fff;background:#000}
.proto__note{display:none}
.proto .wrap>div:first-child{white-space:nowrap}
@media (max-width:700px){.proto .wrap>div:first-child{display:none}}

/* ---------- kop van de pagina ---------- */
.top{position:absolute;left:0;right:0;z-index:5}
.top .wrap{display:flex;justify-content:center;padding-block:22px}
.top img{height:30px;width:auto}

/* ---------- knop: pill met chevron (zoals in de ads) ---------- */
.cta{display:inline-flex;align-items:center;gap:22px;background:var(--white);color:var(--black);border-radius:999px;padding:8px 8px 8px 26px;font-weight:700;font-size:16px;text-decoration:none;border:0;cursor:pointer;transition:transform .2s}
.cta i{width:40px;height:40px;border-radius:50%;background:var(--black);display:grid;place-items:center;transition:transform .25s}
.cta i svg{width:14px;height:14px;stroke:var(--volt);transition:transform .25s}
.cta:hover i svg{transform:translateX(3px)}
.cta:active{transform:scale(.98)}
.cta--dark{background:var(--black);color:var(--white)}
.cta--dark i{background:var(--white)} .cta--dark i svg{stroke:var(--black)}
.cta--wide{width:100%;justify-content:space-between;font-size:17px;padding-left:30px}

/* ---------- trust-regel ---------- */
.stars{display:inline-flex;gap:2px;vertical-align:-2px}
.stars i{width:15px;height:15px;background:var(--trust);display:grid;place-items:center}
.stars i svg{width:11px;height:11px;fill:#fff}
.stars i.half{background:linear-gradient(90deg,var(--trust) 60%,#c8c8c8 60%)}
.trust{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:rgba(255,255,255,.78);align-items:center}
.trust b{color:#fff;font-weight:600}
.trust .dot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.4)}

/* ---------- hero ---------- */
.hero{position:relative;background:var(--black);overflow:hidden}
.hero__media{position:absolute;inset:0}
.hero__media img{width:100%;height:100%;object-fit:cover}
.hero__media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.65) 0%,rgba(10,10,10,0) 22%,rgba(10,10,10,0) 45%,rgba(10,10,10,.92) 78%,var(--black) 100%)}
.hero__in{position:relative;min-height:min(880px,100svh);display:flex;flex-direction:column;justify-content:flex-end;gap:22px;padding-top:110px;padding-bottom:40px}
.hero__sub{font-size:17px;max-width:30ch;color:rgba(255,255,255,.92)}
.hero__price{font-size:14px;color:rgba(255,255,255,.8)}.hero__price b{color:#fff;font-weight:700}
.hero__row{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:center}

.h-echo{font-weight:300;font-style:italic;font-size:clamp(52px,13vw,112px);line-height:.88;text-shadow:-12px 0 rgba(255,255,255,.2),-28px 0 rgba(255,255,255,.1),-48px 0 rgba(255,255,255,.05);display:block}
.h-heavy{font-weight:900;font-style:italic;font-size:clamp(56px,14vw,124px);line-height:.88;display:block}
.h-big{font-weight:900;font-style:italic;font-size:clamp(50px,12vw,104px);line-height:.9}
.h-plain{font-weight:800;font-size:clamp(48px,11.5vw,104px);line-height:.92;letter-spacing:-.03em}

@media (min-width:900px){
  .hero--split .hero__media{left:auto;width:46%;inset-block:0;right:0}
  .hero--split .hero__media::after{background:linear-gradient(90deg,var(--black) 0%,rgba(10,10,10,0) 30%),linear-gradient(0deg,rgba(10,10,10,.5),rgba(10,10,10,0) 30%)}
  .hero--split .hero__in{justify-content:center;max-width:var(--max);padding-top:120px;padding-bottom:80px}
  .hero--split .hero__text{max-width:62%}
  .hero--split .h-heavy{font-size:clamp(56px,7.4vw,108px)}
  .hero--split .h-echo{font-size:clamp(52px,6.8vw,100px)}
  .hero__in{min-height:min(820px,100svh)}
}

/* post-it */
.postit{position:absolute;z-index:2;width:min(60vw,330px);padding:26px 26px 24px;color:var(--black);background:var(--acc);box-shadow:0 18px 40px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);transform:rotate(3deg)}
.postit h3{text-transform:none;letter-spacing:-.01em;font-size:22px;font-weight:800;line-height:1.1;margin-bottom:16px}
.postit ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:17px;font-weight:500}
.postit li{display:flex;gap:12px;align-items:flex-start;line-height:1.2}
.postit li:last-child{font-weight:800}
.box{flex:none;width:22px;height:22px;border:2.5px solid currentColor;border-radius:5px;display:grid;place-items:center}
.box svg{width:14px;height:14px;stroke:currentColor;stroke-width:3.2;fill:none;stroke-dasharray:24;stroke-dashoffset:0}
.box--open svg{stroke-dashoffset:24;transition:stroke-dashoffset .45s cubic-bezier(.6,0,.2,1)}
.is-ticked .box--open svg{stroke-dashoffset:0}
.postit--red{--acc:var(--red);color:#fff;transform:rotate(-3deg)}
@media (max-width:899px){.postit{width:220px;padding:18px 18px 16px}.postit h3{font-size:17px;margin-bottom:10px}.postit ul{font-size:14px;gap:7px}.box{width:18px;height:18px}.hero--note .hero__in{justify-content:flex-start;padding-top:330px;min-height:0;padding-bottom:44px}.hero--note .hero__media .postit{top:72px!important;right:16px!important}}
@media (min-width:900px){.postit--red{left:auto!important;right:8%;top:120px!important}.hero--note .hero__copy{margin-top:0!important}}
.postit .tape{position:absolute;top:-14px;left:50%;width:110px;height:28px;margin-left:-55px;background:rgba(255,255,255,.55);transform:rotate(-2deg)}

/* brief */
.letter{background:var(--white);color:var(--black);border-radius:6px;padding:34px 30px 30px;max-width:620px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.letter h1{text-transform:none;letter-spacing:-.01em;font-size:22px;font-weight:800;margin-bottom:16px}
.letter p{font-size:16px;line-height:1.55;margin-bottom:14px}
.letter .sig{display:flex;align-items:center;gap:10px;font-weight:800;font-style:italic;font-size:20px;margin:6px 0 12px}
.letter .sig img{width:30px}
.letter .ps{font-size:15px;margin-bottom:22px}
.letter .ps b{font-weight:700}

/* meter (ad 09) */
.specgrid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(255,255,255,.35);font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;max-width:640px}
.specgrid div{padding:12px 12px 12px 0;border-bottom:1px solid rgba(255,255,255,.35)}
.specgrid div:nth-child(odd){border-right:1px solid rgba(255,255,255,.35)}
.specgrid div:nth-child(even){padding-left:18px}
.ruler{position:relative;height:26px;max-width:var(--max)}
.ruler::before{content:"";position:absolute;inset:0 0 auto;height:100%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 1px,transparent 1px 22px);mask:linear-gradient(180deg,#000 40%,transparent 40%)}
.ruler::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.55)}
.ruler i{position:absolute;top:0;width:3px;height:26px;background:var(--volt);left:4%;animation:tick 2.6s cubic-bezier(.2,.8,.2,1) .4s forwards}
@keyframes tick{to{left:78%}}
.h-meter{font-size:clamp(48px,7vw,104px)}
.hero--bw .hero__media img{filter:grayscale(1) contrast(1.05)}

/* product-hero's */
.hero--product{background:radial-gradient(70% 60% at 75% 35%,#262626 0%,var(--black) 70%)}
.hero--product .hero__in{justify-content:center}
.pgrid{display:grid;gap:28px;align-items:center}
.pgrid__media{position:relative;display:grid;place-items:center}
.pgrid__media img{max-height:min(560px,62vh);width:auto;filter:drop-shadow(0 40px 50px rgba(0,0,0,.6))}
@media (min-width:900px){.pgrid{grid-template-columns:1.1fr .9fr}.hero--product .h-big{font-size:clamp(46px,5.4vw,78px)!important}.hero--product .pgrid>div:first-child{gap:20px!important}.hero--product .hero__in{padding-top:96px;padding-bottom:48px}.qa div{padding:10px 0}}
.duo{font-size:22px;line-height:1.5;color:rgba(255,255,255,.55)}
.duo b{color:#fff;font-weight:700}
.mini{color:var(--white);width:100%;border-collapse:collapse;font-size:15px;max-width:560px}
.mini th{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:10px 8px;color:rgba(255,255,255,.55)}
.mini th.hi{color:var(--black);background:var(--white);border-radius:14px 14px 0 0}
.mini td{padding:14px 8px;border-top:1px solid var(--line-d);text-align:center}
.mini td:first-child{text-align:left;padding-left:0}
.mini td.hi{background:var(--white);color:var(--black)}
.mini tr:last-child td.hi{border-radius:0 0 14px 14px}
.mini svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.4;fill:none;vertical-align:-3px}
.mini td.no{color:rgba(255,255,255,.4)}
.price{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.price b{font-weight:900;font-style:italic;font-size:44px;letter-spacing:-.03em;line-height:1}
.price em{font-style:italic;font-weight:900;font-size:44px;color:var(--volt);letter-spacing:-.03em;line-height:1}
.price s{font-weight:800;font-size:22px;color:rgba(255,255,255,.55);text-decoration-color:var(--red);text-decoration-thickness:3px}
.price-note{font-size:14px;color:rgba(255,255,255,.6)}
.strike{display:block;font-weight:900;font-style:italic;font-size:clamp(50px,12vw,112px);line-height:.95;color:rgba(255,255,255,.4);position:relative;width:fit-content}
.strike::after{content:"";position:absolute;left:-4px;right:-10px;top:52%;height:7px;border-radius:4px;background:#fff;transform:scaleX(0);transform-origin:left;animation:strike .5s cubic-bezier(.7,0,.2,1) forwards}
.strike:nth-child(2)::after{animation-delay:.55s}.strike:nth-child(3)::after{animation-delay:.9s}.strike:nth-child(4)::after{animation-delay:1.25s}
@keyframes strike{to{transform:scaleX(1)}}
.qa{display:grid;gap:0;max-width:540px}
.qa div{padding:14px 0;border-bottom:1px solid var(--line-d)}
.qa p:first-child{font-size:15px;color:rgba(255,255,255,.55)}
.qa p:last-child{font-size:19px;font-weight:700;line-height:1.3}

/* ---------- secties ---------- */
.sec{padding-block:clamp(72px,11vw,150px)}
.sec--onyx{background:var(--onyx)}
.sec--black{background:var(--black)}
.sec--white{background:var(--white);color:var(--black)}
.h2{font-weight:800;font-size:clamp(36px,6.4vw,64px);line-height:.98}
.lead{font-size:18px;line-height:1.6;max-width:56ch;color:rgba(255,255,255,.78)}
.sec--white .lead{color:var(--ink-soft)}

/* probleem + demo */
.prob{display:grid;gap:48px;align-items:center}
@media (min-width:900px){.prob{grid-template-columns:1fr 1fr;gap:80px}}
.prob__text{display:grid;gap:24px;min-width:0}
.demo{background:var(--carbon);border-radius:28px;padding:22px;display:grid;gap:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--black);border-radius:999px;padding:4px;position:relative}
.seg button{border:0;background:none;padding:11px 10px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;position:relative;z-index:1;color:rgba(255,255,255,.6);transition:color .3s}
.seg button[aria-pressed="true"]{color:var(--black)}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:#fff;transition:transform .35s cubic-bezier(.6,0,.2,1)}
.seg[data-on="grip"]::before{transform:translateX(100%)}
.stage{position:relative;aspect-ratio:16/10;border-radius:18px;background:#0d0d0d;overflow:hidden}
.stage svg{width:100%;height:100%;display:block}
.foot{transition:transform .3s}
.demo[data-on="los"] .foot{animation:slip 1.6s cubic-bezier(.5,0,.3,1) infinite}
@keyframes slip{0%,30%{transform:translateX(0)}45%{transform:translateX(34px)}70%,100%{transform:translateX(0)}}
.demo[data-on="los"] .shoe{animation:brake 1.6s cubic-bezier(.5,0,.3,1) infinite}
@keyframes brake{0%,30%{transform:translateX(0)}42%{transform:translateX(6px)}60%,100%{transform:translateX(0)}}
.tri{fill:#333;transition:fill .4s}
.demo[data-on="grip"] .tri{fill:var(--acc)}
.slipline{stroke:#fff;stroke-width:3;stroke-linecap:round;opacity:0}
.demo[data-on="los"] .slipline{animation:lines 1.6s infinite}
@keyframes lines{0%,32%{opacity:0}42%{opacity:.8}60%,100%{opacity:0}}
.gap{fill:none;stroke:var(--red);stroke-width:2;stroke-dasharray:4 4;opacity:0}
.demo[data-on="los"] .gap{animation:lines 1.6s infinite}
.demo[data-on="los"] .lbl--grip,.demo[data-on="grip"] .lbl--los{display:none}
.demo__cap{font-size:15px;min-height:3em;color:rgba(255,255,255,.85)}
.sci{display:grid;gap:12px;border-top:1px solid var(--line-d);padding-top:26px}
.sci__n{font-weight:900;font-size:clamp(64px,10vw,96px);line-height:.85;letter-spacing:-.04em;color:var(--acc-text,var(--volt))}
.sci__n small{font-size:.38em;color:rgba(255,255,255,.4);font-weight:700;letter-spacing:-.01em;margin-left:6px}
.sci p{font-size:15px;color:rgba(255,255,255,.78);max-width:52ch}
.sci .src{font-size:12px;color:rgba(255,255,255,.45)}

/* features met hotspots */
.feat{display:grid;gap:48px;align-items:center}
@media (min-width:900px){.feat{grid-template-columns:.9fr 1.1fr;gap:72px}}
.sock{position:relative;max-width:400px;margin:0 auto;width:100%;aspect-ratio:556/1000}
.sock img{width:100%}
@media (max-width:899px){.sock{max-width:250px}}
.hs{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:0;background:rgba(10,10,10,.85);cursor:pointer;display:grid;place-items:center;transition:transform .25s,background .25s}
.hs::before{content:"";width:10px;height:10px;border-radius:50%;background:#fff;transition:transform .25s}
.hs::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(10,10,10,.5);animation:pulse 2.4s infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.5);opacity:0}}
.hs[aria-pressed="true"]{background:var(--black);transform:scale(1.15)}
.hs[aria-pressed="true"]::before{background:var(--volt);transform:scale(1.2)}
.flist{list-style:none;margin:32px 0 0;padding:0;display:grid}
.flist li{border-top:1px solid var(--line-l)}
.flist li:last-child{border-bottom:1px solid var(--line-l)}
.flist button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:4px 16px;width:100%;padding:18px 0;cursor:pointer}
.flist button:focus-visible{outline:2px solid var(--black);outline-offset:2px}
.flist b{font-weight:700;font-size:19px;line-height:1.3}
.flist span{font-size:13px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;align-self:center;text-align:right}
.flist p{grid-column:1/-1;font-size:15px;color:var(--ink-soft);max-height:0;overflow:hidden;transition:max-height .35s ease,margin .35s}
.flist li.on p{max-height:6em;margin-top:4px}
.flist li.on b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--black);margin-right:10px;vertical-align:4px}

/* bewijs */
.proof{position:relative;overflow:hidden}
.proof__bg{position:absolute;inset:0;opacity:.32}
.proof__bg img{width:100%;height:100%;object-fit:cover}
.proof__bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--black) 0%,rgba(10,10,10,.6) 40%,var(--black) 100%)}
.proof .wrap{position:relative;display:grid;gap:56px}
.proof__head{display:grid;gap:18px}
.proof__big{font-weight:900;font-style:italic;font-size:clamp(46px,9vw,100px);line-height:.92;letter-spacing:-.04em;text-transform:uppercase}
.proof__score{display:flex;align-items:center;gap:12px;font-size:15px;color:rgba(255,255,255,.85);flex-wrap:wrap}
.reviews{display:grid;gap:16px}
@media (min-width:760px){.reviews{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.reviews{grid-template-columns:repeat(3,1fr)}}
.rev{background:rgba(26,26,26,.86);backdrop-filter:blur(6px);border:1px solid var(--line-d);border-radius:22px;padding:26px;display:grid;gap:16px;align-content:start}
.rev q{font-size:18px;line-height:1.45;quotes:"“" "”"}
.rev small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--titanium);font-weight:600}
.rev-src{font-size:12px;color:rgba(255,255,255,.45)}
.founders{display:grid;gap:22px;border-top:1px solid var(--line-d);padding-top:40px}
@media (min-width:900px){.founders{grid-template-columns:1fr 1fr;gap:80px;align-items:end}}
.founders p{font-size:20px;line-height:1.5;max-width:40ch}
.founders .sig{display:flex;align-items:center;gap:10px;font-weight:800;font-style:italic;font-size:20px}
.founders .sig img{width:28px}
.clubs{font-size:14px;color:rgba(255,255,255,.6);line-height:1.8}
.clubs b{color:#fff;font-weight:600}

/* koopblok */
.buy{display:grid;gap:48px;align-items:start}
@media (min-width:980px){.buy{grid-template-columns:1fr 1fr;gap:72px}}
.gal{display:grid;gap:12px}
.buy__media{position:relative;background:#f4f4f4;border-radius:24px;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}
.buy__media img{width:100%;height:100%;object-fit:contain}
.buy__media img.cover{object-fit:cover}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.thumbs button{border:0;padding:0;border-radius:14px;overflow:hidden;background:#f4f4f4;aspect-ratio:1/1;cursor:pointer;outline:2px solid transparent;outline-offset:2px}
.thumbs button[aria-pressed="true"]{outline-color:var(--black)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.pay{font-size:13px;color:var(--ink-soft)}
.minirev{margin:0;border-top:1px solid var(--line-l);padding-top:18px;display:grid;gap:6px}
.minirev q{font-size:16px;font-weight:600;line-height:1.4}
.minirev figcaption{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
#koop{padding-block:clamp(48px,7vw,110px)}
@media (max-width:979px){.buy{gap:28px}}
.cmp{color:var(--black);width:100%;border-collapse:collapse;font-size:15px;margin-top:28px}
.cmp th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:12px 6px;color:var(--ink-soft)}
.cmp th.hi{background:var(--black);color:#fff;border-radius:14px 14px 0 0}
.cmp td{padding:13px 6px;border-top:1px solid var(--line-l);text-align:center}
.cmp td:first-child{text-align:left;padding-left:0}
.cmp td.hi{background:var(--black);color:var(--volt)}
.cmp tr:last-child td.hi{border-radius:0 0 14px 14px}
.cmp td.no{color:#b0b0b2}
.cmp svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.6;fill:none;vertical-align:-3px}
.form{display:grid;gap:26px;min-width:0}
.form h2{font-weight:800;font-size:clamp(30px,4.6vw,44px);line-height:1}
.opt-l{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;justify-content:space-between}
.opt-l em{font-style:normal;color:var(--red);text-transform:none;letter-spacing:0;font-weight:500}
.packs{display:grid;gap:10px}
.pack{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;border:1.5px solid var(--line-l);border-radius:18px;padding:16px 18px;cursor:pointer;position:relative;text-align:left;background:#fff;color:var(--black)}
.pack input{position:absolute;opacity:0}
.pack .rad{width:20px;height:20px;border-radius:50%;border:2px solid #c9c9cb;grid-row:span 2}
.pack strong{font-weight:700;font-size:17px}
.pack .p{font-weight:800;font-size:17px;text-align:right}
.pack .p s{font-weight:500;font-size:13px;color:#9a9a9c;margin-right:6px}
.pack small{grid-column:2/4;font-size:13px;color:var(--ink-soft)}
.pack .tag{position:absolute;top:-10px;right:16px;background:var(--black);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.pack:has(input:checked){border-color:var(--black);box-shadow:0 0 0 1px var(--black)}
.pack:has(input:checked) .rad{border:6px solid var(--black)}
.pack:has(input:focus-visible){outline:2px solid var(--black);outline-offset:3px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{position:relative}
.chip input{position:absolute;opacity:0}
.chip span{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line-l);border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px;cursor:pointer}
.chip span i{width:16px;height:16px;border-radius:50%;border:1px solid #bbb}
.chip input:checked+span{border-color:var(--black);box-shadow:0 0 0 1px var(--black)}
.chip input:focus-visible+span{outline:2px solid var(--black);outline-offset:3px}
.sizes.err .chip span{border-color:var(--red)}
.assure{display:grid;gap:8px;font-size:14px;color:var(--ink-soft)}
.assure div{display:flex;gap:10px;align-items:center}
.assure svg{width:16px;height:16px;stroke:var(--black);stroke-width:2.4;fill:none;flex:none}
.added{background:var(--black);color:#fff;border-radius:16px;padding:16px 18px;font-size:14px;display:grid;gap:12px}
.added b{font-size:16px}
.added small{color:rgba(255,255,255,.55)}

/* faq */
.faq{display:grid;gap:40px}
@media (min-width:900px){.faq{grid-template-columns:.8fr 1.2fr;gap:80px}}
.faq details{border-top:1px solid var(--line-d)}
.faq details:last-child{border-bottom:1px solid var(--line-d)}
.faq summary{list-style:none;cursor:pointer;padding:22px 0;font-weight:700;font-size:19px;display:flex;justify-content:space-between;gap:20px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-weight:400;font-size:26px;line-height:1;transition:transform .25s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 0 22px;color:rgba(255,255,255,.75);max-width:60ch}

/* slot */
.end{position:relative;overflow:hidden;background:var(--black)}
.end__bg{position:absolute;inset:0}
.end__bg img{width:100%;height:100%;object-fit:cover;opacity:.5}
.end__bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--black) 0%,rgba(10,10,10,.35) 60%,var(--black) 100%)}
.end .wrap{position:relative;display:grid;gap:30px;justify-items:start;padding-block:clamp(110px,16vw,200px)}
.foot-l{background:var(--black);border-top:1px solid var(--line-d);font-size:13px;color:rgba(255,255,255,.5)}
.foot-l .wrap{display:flex;flex-wrap:wrap;gap:10px 28px;padding-block:28px;align-items:center}
.foot-l img{height:22px;width:auto;margin-right:auto}

/* sticky balk */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,10,10,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line-d);transform:translateY(110%);transition:transform .35s cubic-bezier(.6,0,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sticky.show{transform:none}
.sticky .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:10px}
.sticky p{font-size:12px;line-height:1.3;color:rgba(255,255,255,.7)}
.st__info{display:grid;gap:8px;min-width:0}
.st__sizes{display:flex;gap:6px}
.st__sizes label{position:relative}
.st__sizes input{position:absolute;opacity:0}
.st__sizes span{display:block;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.st__sizes input:checked+span{background:#fff;color:var(--black);border-color:#fff}
.st__sizes input:focus-visible+span{outline:2px solid var(--volt);outline-offset:2px}
.st__sizes.err span{border-color:var(--red)}
.added[hidden]{display:none}
.sticky .wrap{flex-wrap:wrap;row-gap:8px}
.st__info{display:contents}
.sticky p{order:1;flex:1;min-width:0}
#stickyBtn{order:2}
.st__sizes{order:3;flex-basis:100%}
.st__sizes label{flex:1}.st__sizes span{text-align:center;padding:7px 0;font-size:13px}
@media (min-width:700px){.sticky .wrap{flex-wrap:nowrap}.st__sizes{order:2;flex-basis:auto}.st__sizes label{flex:none}.st__sizes span{padding:6px 14px}#stickyBtn{order:3}}
.sticky p b{display:block;font-size:16px;color:#fff;font-weight:800}
.sticky .cta{padding-left:20px;font-size:15px;gap:14px;white-space:nowrap;flex:none}
.sticky .cta i{width:36px;height:36px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .strike::after{transform:none}
  .ruler i{left:78%}
}

/* ---------- v1.2: productpagina-hero met de ad-kop als scent ---------- */
.top{position:relative;background:var(--black)}
.top .wrap{padding-block:14px}
.top img{height:24px}
.ph{background:var(--white);color:var(--black);padding:20px 0 64px}
.ph__grid{display:grid;gap:18px}
.ph__h{font-weight:900;font-style:italic;font-size:clamp(34px,9vw,64px);line-height:.92;letter-spacing:-.035em}
.ph__h .e{font-weight:300;display:block}
.ph__h--plain{font-style:normal;font-weight:800}
.ph__h--letter{text-transform:none;font-style:normal;font-weight:800;letter-spacing:-.02em;font-size:clamp(30px,7vw,48px)}
.ph__h .strike{display:inline-block;font-size:inherit;line-height:inherit;color:rgba(10,10,10,.32)}
.ph__h .strike::after{background:var(--black);height:5px;top:50%}
.ph__sub{font-size:16px;line-height:1.55;color:var(--ink-soft);max-width:46ch;margin-top:12px}
.ph__sig{display:flex;align-items:center;gap:8px;font-weight:800;font-style:italic;margin-top:10px}
.ph__sig img{width:22px}
.ph__meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:14px;font-size:14px}
.ph__name{font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:13px}
.ph__rate{display:inline-flex;gap:8px;align-items:center;color:var(--ink-soft);text-decoration:none}
.ph__rate b{color:var(--black)}
.ph__opts{display:grid;gap:22px}
.ph .buy__media{border-radius:20px}
.ph .buy__media img.bw{filter:grayscale(1) contrast(1.05)}
.assure--qa{font-size:14px;gap:10px}
.assure--qa div{align-items:flex-start}
.assure--qa svg{margin-top:3px}
.assure--qa b{color:var(--black);font-weight:600}
.note{position:absolute;z-index:2;left:12px;top:12px;width:168px;padding:12px 12px 10px;background:var(--volt);color:var(--black);transform:rotate(-2.5deg);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.note--red{background:var(--red);color:#fff;transform:rotate(2.5deg)}
.note[hidden]{display:none}
.note b{display:block;font-size:12px;font-weight:800;line-height:1.15;margin-bottom:7px}
.note ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:11.5px;font-weight:500}
.note li{display:flex;gap:7px;align-items:flex-start;line-height:1.2}
.note li:last-child{font-weight:800}
.note .box{width:14px;height:14px;border-width:2px;border-radius:3px}
.note .box svg{width:9px;height:9px}
@media (min-width:980px){
  .ph{padding:40px 0 96px}
  .ph__grid{grid-template-columns:1.1fr .9fr;column-gap:64px;row-gap:26px;align-items:start}
  .ph .gal{grid-column:1;grid-row:1/span 2;position:sticky;top:24px}
  .ph__head{grid-column:2;grid-row:1}
  .ph .form{grid-column:2;grid-row:2;gap:22px}
  .ph__opts{grid-template-columns:auto 1fr;gap:22px 28px}
  .ph__h{font-size:clamp(40px,4.4vw,62px)}
  .note{left:22px;top:22px;width:230px;padding:18px 18px 14px}
  .note b{font-size:15px;margin-bottom:10px}.note ul{font-size:14px;gap:7px}.note .box{width:17px;height:17px}.note .box svg{width:11px;height:11px}
}
@media (max-width:979px){.ph .buy__media{aspect-ratio:5/4}}
@media (min-width:980px){
  .ph{padding:28px 0 96px}
  .ph .pack{padding:11px 16px}.ph .packs{gap:8px}.ph .pack small{font-size:12px}
  .ph .form{gap:18px!important}
  .ph__h{font-size:clamp(38px,3.8vw,56px)!important}
  .ph__h--letter{font-size:clamp(30px,2.8vw,40px)!important}
  .ph__sub{font-size:15px;margin-top:10px}
  .ph .minirev{display:none}
}
@media (min-width:980px){
  .ph .packs{grid-template-columns:repeat(3,1fr);gap:10px}
  .ph .pack{grid-template-columns:auto 1fr;padding:14px 14px 12px;gap:2px 10px;align-items:start}
  .ph .pack .rad{grid-row:auto;width:18px;height:18px;margin-top:3px}
  .ph .pack .p{grid-column:1/3;text-align:left;font-size:18px}
  .ph .pack .p s{display:block;margin:0}
  .ph .pack small{grid-column:1/3;font-size:11.5px;line-height:1.35}
  .ph .pack .tag{right:auto;left:12px}
}

/* ---------- v1.3 ---------- */
.ph .form{gap:16px}
.ph__rate{display:inline-flex;gap:8px;align-items:center;color:var(--ink-soft);text-decoration:none;font-size:14px;margin-top:14px}
.ph__rate b{color:var(--black)}
.ph__meta,.ph__name{display:none}
.ph__qa{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px;color:var(--ink-soft)}
.ph__qa b{color:var(--black);font-weight:600;margin-right:4px}
.sw{border:0;padding:0;margin:0}
.sw__l{font-size:14px;padding:0;margin-bottom:8px;color:var(--ink-soft)}.sw__l b{color:var(--black);font-weight:600}
.sw__row{display:flex;gap:8px}
.sw__o{position:relative;cursor:pointer}
.sw__o input{position:absolute;opacity:0}
.sw__o img{width:54px;height:54px;object-fit:contain;border:1.5px solid var(--line-l);border-radius:10px;padding:4px;background:#fff}
.sw__o input:checked+img{border-color:var(--black);box-shadow:0 0 0 1px var(--black)}
.sw__o input:focus-visible+img{outline:2px solid var(--black);outline-offset:2px}
.bundle{display:grid;gap:10px}
.bo{position:relative;border:1.5px solid var(--line-l);border-radius:14px;background:#fff;transition:border-color .2s}
.bo:has(.bo__radio[name=pack]:checked){border-color:var(--black);box-shadow:0 0 0 1px var(--black)}
.bo__radio{position:absolute;opacity:0;pointer-events:none}
.bo__card{display:grid;grid-template-columns:56px 1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;cursor:pointer}
.bo__img{width:56px;height:56px;object-fit:contain;grid-row:span 2}
.bo__text{display:grid;gap:4px;justify-items:start;min-width:0}
.bo__title{font-weight:600;font-size:14px;line-height:1.25}
.bo__save{font-size:11px;font-weight:700;background:var(--black);color:var(--volt);border-radius:6px;padding:2px 7px}
.bo__prices{display:grid;justify-items:end;line-height:1.15}
.bo__price{font-weight:800;font-size:18px}
.bo__prices s{font-size:12px;color:#9a9a9c}
.bo__ben{grid-column:2/4;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--black)}
.bo__ben svg{width:13px;height:13px;stroke:var(--black);stroke-width:2.6;fill:none}
.bo__ben--muted{color:var(--ink-soft)}
.bo__per{margin-left:auto;color:var(--ink-soft);font-weight:500}
.bo__badge{position:absolute;top:-9px;right:12px;background:var(--black);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:999px}
.bo__sizes{border:0;margin:0;padding:0 14px 14px;min-width:0}.bo__sz{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bo__sizes legend{padding:0;font-size:12px;font-weight:600;margin-bottom:6px;display:flex;gap:8px}
.bo__sizes legend em{font-style:normal;color:var(--red);font-weight:500}
.bo__size{display:grid;place-items:center;height:42px;border:1.5px solid var(--line-l);border-radius:10px;font-weight:600;font-size:14px;cursor:pointer}
.bo__radio:checked+.bo__size{background:var(--black);color:#fff;border-color:var(--black)}
.bo__radio:focus-visible+.bo__size{outline:2px solid var(--black);outline-offset:2px}
.bo__sizes.err .bo__size{border-color:var(--red)}
.ship{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--black);background:#f4f4f4;border-radius:12px;padding:10px 14px}
.ship svg,.usp svg{width:20px;height:20px;stroke:var(--black);stroke-width:1.7;fill:none;flex:none;stroke-linejoin:round;stroke-linecap:round}
.usp{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.usp li{display:grid;justify-items:center;text-align:center;gap:4px;font-size:12px;color:var(--ink-soft);line-height:1.3}
.usp b{display:block;color:var(--black);font-weight:700;font-size:13px}
.pay{font-size:12px;color:var(--ink-soft);text-align:center}
@media (min-width:980px){
  .ph .form{gap:14px!important}
  .bo__card{padding:10px 14px}
  .usp{display:none}
}

/* reviews */
.rv{background:var(--onyx);padding-block:clamp(64px,9vw,110px)}
.rv__head{display:grid;gap:18px;margin-bottom:32px}
.rv__score{display:flex;align-items:center;gap:14px}
.rv__score>b{font-size:64px;font-weight:900;line-height:.9;letter-spacing:-.04em}
.rv__score div{display:grid;gap:4px;font-size:13px;color:rgba(255,255,255,.6)}
.rv__h{font-size:clamp(30px,5vw,52px);font-weight:800;line-height:1;max-width:14ch}
.rv__row{display:grid;grid-auto-flow:column;grid-auto-columns:min(82%,340px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:none}
.rv__row::-webkit-scrollbar{display:none}
.rv__c{margin:0;scroll-snap-align:start;background:var(--carbon);border-radius:16px;padding:22px;display:grid;gap:14px;align-content:start}
.rv__c q{font-size:16px;line-height:1.5;quotes:none}
.rv__c figcaption{font-size:12px;color:var(--titanium);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.rv__clubs{margin-top:28px;font-size:14px;color:rgba(255,255,255,.65)}.rv__clubs b{color:#fff;font-weight:600}
@media (min-width:980px){.rv__head{grid-template-columns:1fr auto;align-items:end}.rv__score{order:2}.rv__row{grid-auto-flow:row;grid-template-columns:repeat(3,1fr);grid-auto-columns:auto;overflow:visible}}

/* tegels */
.ft{background:var(--white);color:var(--black);padding-block:clamp(64px,9vw,110px)}
.ft__h{font-size:clamp(30px,5vw,52px);font-weight:800;line-height:1;margin-bottom:28px}
.ft__grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ft__t{margin:0;position:relative;border-radius:16px;overflow:hidden;background:#f4f4f4;aspect-ratio:1/1}

.ft__t img{width:100%;height:100%;object-fit:cover}
.ft__t img[src$=".png"],.ft__t img[src$=".webp"]{object-fit:contain;padding:14% 14% 30%}
.ft__t figcaption{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 14px;background:linear-gradient(0deg,rgba(10,10,10,.85),rgba(10,10,10,0));color:#fff;display:grid;gap:2px}
.ft__t figcaption b{font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:-.01em}
.ft__t figcaption span{font-size:13px;line-height:1.35;color:rgba(255,255,255,.85)}
@media (min-width:980px){.ft__grid{grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;height:620px}.ft__t{aspect-ratio:auto}.ft__t--big{grid-column:1;grid-row:1/3;aspect-ratio:auto}.ft__t:nth-child(4){grid-column:2/4}.ft__t figcaption b{font-size:18px}}

/* meting + vergelijking */
.sci2{background:var(--black);padding-block:clamp(64px,9vw,110px)}
.sci2__grid{display:grid;gap:48px}
.sci2__h{font-size:clamp(36px,6vw,64px);font-weight:900;font-style:italic;line-height:.95}
.sci2__p{margin-top:14px;color:rgba(255,255,255,.75);max-width:40ch}
.bars{display:grid;gap:14px;margin-top:28px}
.bar{display:grid;grid-template-columns:96px 1fr 44px;gap:12px;align-items:center;font-size:14px}
.bar i{height:14px;border-radius:7px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;width:var(--w);background:#5b5b5d;border-radius:7px}
.bar--hi i::after{background:var(--volt)}
.bar b{font-weight:800;text-align:right}.bar--hi b{color:var(--volt)}

.vs td.no svg{width:14px;height:14px;stroke:#5b5b5d;stroke-width:2.4;fill:none}
.vs td.no{color:rgba(255,255,255,.45)}.vs td.hi b{color:var(--volt)}
@media (min-width:980px){.sci2__grid{grid-template-columns:1fr 1fr;gap:96px}}

/* faq */
.fq{background:var(--white);color:var(--black);padding-block:clamp(64px,9vw,110px)}
.fq__grid{display:grid;gap:24px}
.fq__h{font-size:clamp(30px,5vw,52px);font-weight:800;line-height:1}
.fq details{border-top:1px solid var(--line-l);padding:16px 0}
.fq details:last-child{border-bottom:1px solid var(--line-l)}
.fq summary{cursor:pointer;font-weight:600;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:16px}
.fq summary::-webkit-details-marker{display:none}

@media (min-width:980px){.fq__grid{grid-template-columns:1fr 2fr;gap:64px}}

/* slotaanbod */
.of{position:relative;background:var(--black);overflow:hidden}
.of__bg{position:absolute;inset:0}
.of__bg img{width:100%;height:100%;object-fit:cover;opacity:.45}
.of__grid{position:relative;display:grid;gap:28px;padding-block:clamp(80px,12vw,150px)}

function wire(adKey){
  // post-it: laatste vakje vinkt zichzelf af
  const pi=document.getElementById('postit');
  if(pi){setTimeout(()=>pi.classList.add('is-ticked'),1400)}

  // koopblok
  const f=document.getElementById('buyForm'),btn=document.getElementById('buyBtn'),added=document.getElementById('added');
  const main=document.getElementById('galMain'),thumbs=document.getElementById('thumbs');
  const price={1:'€17,95',3:'€44,95',5:'€69,95'},nm={1:'1 paar',3:'3-pack',5:'5-pack'};
  document.getElementById('shipLine').innerHTML=`Bestel je nu, dan gaat je pakket <b>uiterlijk ${shipDay()}</b> de deur uit`;
  const showGal=i=>{const k=f.kleur.value,L=galList(k),g=L[i],A=AD[curAd];main.src=g[0];main.alt=g[1];main.classList.toggle('cover',/\.jpg$/.test(g[0]));main.classList.toggle('bw',!!A.bw&&A.lead&&g[0]===A.lead[0]);const n=document.getElementById('postit');if(n)n.hidden=!(A.lead&&g[0]===A.lead[0]);thumbs.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',j===i))};
  thumbs.addEventListener('click',e=>{const b=e.target.closest('button');if(b)showGal(+b.dataset.i)});
  const moveSizes=()=>{const o=f.querySelector('.bo__radio[name=pack]:checked').closest('.bo');o.appendChild(document.getElementById('sizes'))};moveSizes();
  const sync=()=>{const p=f.pack.value;btn.querySelector('span').textContent=`In winkelwagen · ${price[p]}`;document.querySelector('#sticky b').textContent=`${p==='1'?'1 paar':p+' paar'} ${price[p]}`;document.getElementById('stSub').textContent=(p==='1'?'+ €4,50 verzending':'Gratis verzonden')+' · '+(f.maat.value?'maat '+f.maat.value:'kies je maat')};
  f.addEventListener('change',e=>{
    if(e.target.name==='kleur'){const k=f.kleur.value;thumbs.innerHTML=thumbsHtml(k);showGal(0);document.getElementById('kleurNaam').textContent=k==='wit'?'Wit':'Zwart';f.querySelectorAll('.bo__img').forEach(im=>im.src=packThumb(+im.dataset.n,k))}
    if(e.target.name==='pack')moveSizes();
    if(e.target.name==='maat'){document.getElementById('sizeErr').hidden=true;document.getElementById('sizes').classList.remove('err');document.querySelectorAll('#stickySizes input').forEach(x=>x.checked=x.value===f.maat.value)}
    sync();added.hidden=true;
  });
  window._addToCart=()=>{
    if(!f.maat.value){document.getElementById('sizeErr').hidden=false;document.getElementById('sizes').classList.add('err');document.getElementById('sizes').scrollIntoView({block:'center'});return false}
    added.hidden=false;
    added.innerHTML=`<b>Toegevoegd: ${nm[f.pack.value]} ${f.kleur.value}, maat ${f.maat.value}</b><a class="cta cta--wide" href="#koop"><span>Afrekenen · ${price[f.pack.value]}</span>${CHEV}</a><small>Prototype. Live zet deze knop je keuze in de winkelwagen${f.pack.value==='1'?'':', met bundelkorting'}.</small>`;
    return true;
  };
  f.addEventListener('submit',e=>{e.preventDefault();if(!window._addToCart())document.getElementById('maat0').focus()});
  showGal(0);

  // sticky balk: zichtbaar zolang de koopknop niet in beeld is (mobiel dus al bij binnenkomst)
  const sticky=document.getElementById('sticky'),buyBtn=document.getElementById('buyBtn');
  const upd=s=>{sticky.classList.toggle('show',s);sticky.setAttribute('aria-hidden',!s);document.getElementById('stickyBtn').tabIndex=s?0:-1};
  if(!window._stWired){window._stWired=1;
    document.getElementById('stickySizes').addEventListener('change',e=>{const f=document.getElementById('buyForm');const t=[...f.maat].find(x=>x.value===e.target.value);if(t){t.checked=true;t.dispatchEvent(new Event('change',{bubbles:true}))}document.getElementById('stickySizes').classList.remove('err')});
    document.getElementById('stickyBtn').addEventListener('click',()=>{const f=document.getElementById('buyForm');if(!f.maat.value){document.getElementById('stickySizes').classList.add('err');return}window._addToCart();document.getElementById('added').scrollIntoView({behavior:'smooth',block:'center'})});}
  document.querySelectorAll('#stickySizes input').forEach(x=>x.checked=false);
  if(window._io)window._io.forEach(o=>o.disconnect());
  const a=new IntersectionObserver(([en])=>upd(!en.isIntersecting));
  a.observe(buyBtn);window._io=[a];
  const first=()=>{const r=buyBtn.getBoundingClientRect();upd(r.top>innerHeight||r.bottom<0)};requestAnimationFrame(first);setTimeout(first,400);
}
